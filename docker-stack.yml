version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: ghcr.io/cloudtolocalllm-online/cloudtolocalllm/postgres:${DOCKER_TAG}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudtolocalllm}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      cloudtolocalllm_net:
        aliases:
          - postgres
    healthcheck:
      test: pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-cloudtolocalllm}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 512M
      restart_policy:
        condition: on-failure

  # Redis for Tunnel State
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      cloudtolocalllm_net:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 128M
      restart_policy:
        condition: on-failure

  # API Backend
  api-backend:
    image: ghcr.io/cloudtolocalllm-online/cloudtolocalllm/api:${DOCKER_TAG}
    user: "1001:1001"
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_TYPE: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-cloudtolocalllm}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
    networks:
      cloudtolocalllm_net:
        aliases:
          - api-backend
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      replicas: 2
      resources:
        reservations:
          memory: 512M
        limits:
          memory: 1024M

  # Streaming Proxy
  streaming-proxy:
    image: ghcr.io/cloudtolocalllm-online/cloudtolocalllm/streaming:${DOCKER_TAG}
    user: "1001:1001"
    environment:
      NODE_ENV: production
      PORT: 3001
      API_BACKEND_URL: http://api-backend:8080
    networks:
      cloudtolocalllm_net:
        aliases:
          - streaming-proxy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3001/health | grep healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 512M

  # Web Frontend (Nginx serving Flutter)
  web:
    image: ghcr.io/cloudtolocalllm-online/cloudtolocalllm/web:${DOCKER_TAG}
    user: "1001:1001"
    networks:
      cloudtolocalllm_net:
        aliases:
          - web
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health | grep OK || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 2
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 128M

  # Cloudflare Tunnel (Ingress)
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    command: tunnel --metrics 0.0.0.0:2000 --config /etc/cloudflared/config.yml run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      cloudtolocalllm_net:
        aliases:
          - cloudflared
    configs:
      - source: cloudflared_config
        target: /etc/cloudflared/config.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:2000/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      resources:
        reservations:
          memory: 128M
        limits:
          memory: 256M
      restart_policy:
        condition: on-failure

configs:
  cloudflared_config:
    file: ./config/cloudflared/config.yml

networks:
  cloudtolocalllm_net:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
  redis_data:
