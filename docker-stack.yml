version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: ghcr.io/zoidbot-online/zoidbot/postgres:${DOCKER_TAG}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zoidbot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      zoidbot_net:
        aliases:
          - postgres
    healthcheck:
      test: pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-zoidbot}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["postgres", "-c", "shared_buffers=1024MB", "-c", "max_connections=200", "-c", "work_mem=32MB", "-c", "maintenance_work_mem=256MB", "-c", "effective_cache_size=3GB"]
    deploy:
      replicas: 1
      resources:
        reservations:
          memory: 2G
        limits:
          memory: 4G
      restart_policy:
        condition: on-failure

  # Redis for Tunnel State
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      zoidbot_net:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 128M
      restart_policy:
        condition: on-failure

  # API Backend
  api-backend:
    image: ghcr.io/zoidbot-online/zoidbot/api:${DOCKER_TAG}
    user: "1001:1001"
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_TYPE: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-zoidbot}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      # Cloudflare Infrastructure Management
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY}
      CLOUDFLARE_EMAIL: ${CLOUDFLARE_EMAIL:-cmaltais@zoidbot.online}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-35fa09929e656c4e96e4aa79909d11b7}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-01bae6fa9d97d5e731a1fa6fc8e1f960}
      CLOUDFLARE_TUNNEL_ID: ${CLOUDFLARE_TUNNEL_ID:-62da6c19-947b-4bf6-acad-100a73de4e0d}
      INFRASTRUCTURE_API_KEY: ${INFRASTRUCTURE_API_KEY}
    networks:
      zoidbot_net:
        aliases:
          - api-backend
          - api-backend.zoidbot.svc.cluster.local
    ports:
      - "8081:8080"
    volumes:
      # Docker socket for infrastructure management (cloudflared restart)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      replicas: 2
      resources:
        reservations:
          memory: 1G
        limits:
          memory: 2G

  # Streaming Proxy
  streaming-proxy:
    image: ghcr.io/zoidbot-online/zoidbot/streaming:${DOCKER_TAG}
    user: "1001:1001"
    environment:
      NODE_ENV: production
      PORT: 3001
      API_BACKEND_URL: http://api-backend:8080
    networks:
      zoidbot_net:
        aliases:
          - streaming-proxy
          - streaming-proxy.zoidbot.svc.cluster.local
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3001/health | grep healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 512M

  # Web Frontend (Nginx serving Flutter)
  web:
    image: ghcr.io/zoidbot-online/zoidbot/web:${DOCKER_TAG}
    user: "1001:1001"
    networks:
      zoidbot_net:
        aliases:
          - web
          - web.zoidbot.svc.cluster.local
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health | grep OK || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 2
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 128M

  # Cloudflare Tunnel (Ingress)
  # Note: Using TUNNEL_TOKEN means ingress rules are managed in Cloudflare dashboard
  # To update routing, log into Cloudflare Zero Trust > Access > Tunnels
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    # TUNNEL_TOKEN env var is auto-read by cloudflared
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
       - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      zoidbot_net:
        aliases:
          - cloudflared
    # DNS is handled by Docker's embedded DNS at 127.0.0.11 automatically
    deploy:
      replicas: 1
      resources:
        reservations:
          memory: 128M
        limits:
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0

networks:
  zoidbot_net:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
  redis_data:
