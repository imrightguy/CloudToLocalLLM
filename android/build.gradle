buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Force AndroidX deps to versions compatible with AGP 8.6.0
    configurations.all {
        resolutionStrategy {
            force 'androidx.browser:browser:1.5.0'
            force 'androidx.core:core-ktx:1.12.0'
            force 'androidx.core:core:1.12.0'
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Force K2 to produce 1.9-compatible bytecode for old plugins (tesseract_ocr 0.5.0)
allprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            languageVersion = "1.9"
            apiVersion = "1.9"
        }
    }
}

// AGP 8.6+ Kotlin K2 generates duplicate .class in bundle jars (tesseract_ocr 0.5.0)
// useLegacyPackaging falls back to zip-based packaging that allows overwrite
subprojects { subproject ->
    afterEvaluate {
        subproject.tasks.withType(com.android.build.gradle.tasks.BundleLibraryClasses) {
            it.useLegacyPackaging = true
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
    
    project.pluginManager.withPlugin('com.android.library') {
        android {
            testOptions {
                unitTests.all {
                    enabled = false
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
