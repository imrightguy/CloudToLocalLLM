# ── ImmoGestion Production Deployment ─────────────────────────────────
# Docker Compose for Hostinger VPS
# Use: docker compose up -d
# ──────────────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── PostgreSQL Database ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: immogestion-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: immogestion
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # Only exposed on localhost — Cloudflare Tunnel handles public access
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d immogestion"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - internal

  # ── API Backend ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: immogestion-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      # NOTE: DATABASE_URL should be set in .env.production with postgres://user:pass@postgres:5432/immogestion
      # (using "postgres" as hostname, not localhost, since they share a Docker network)
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    ports:
      # Only exposed on localhost — Cloudflare Tunnel handles public access
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - internal

  # ── Automated PostgreSQL Backup ───────────────────────────────────
  backup:
    image: postgres:16-alpine
    container_name: immogestion-backup
    restart: unless-stopped
    entrypoint: >
      sh -c "
        echo '[backup-cron] Installing cron...' &&
        apk add --no-cache dcron &&
        echo '0 2 * * * /scripts/backup.sh >> /backups/cron.log 2>&1' > /etc/crontabs/root &&
        echo '[backup-cron] Running initial backup...' &&
        /scripts/backup.sh &&
        echo '[backup-cron] Starting cron daemon (daily at 2:00 AM)...' &&
        crond -f -l 2
      "
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: immogestion
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_RETENTION_DAYS: 30
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks:
      - internal

  # ── Flutter Web App ───────────────────────────────────────────────
  flutter-web:
    build:
      context: ../../
      dockerfile: services/flutter-web/Dockerfile
    container_name: immogestion-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    networks:
      - internal

  # ── Cloudflare Tunnel ──────────────────────────────────────────────
  # Requires CLOUDFLARE_TUNNEL_TOKEN in .env.production
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: immogestion-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    logging: *default-logging
    networks:
      - internal
    depends_on:
      - api

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
  logs:
    driver: local
  backups:
    driver: local

networks:
  internal:
    driver: bridge
