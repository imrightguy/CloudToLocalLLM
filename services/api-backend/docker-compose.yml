# ── ImmoGestion Production Deployment ─────────────────────────────────
# Docker Compose for Hostinger VPS
# Use: docker compose up -d
# ──────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL Database ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: immogestion-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: immogestion
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # Only exposed on localhost — Cloudflare Tunnel handles public access
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d immogestion"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── API Backend ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: immogestion-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      # DATABASE_URL comes from .env.production (loaded via env_file above)
      PORT: 3000
      DB_HOST: postgres
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    ports:
      # Only exposed on localhost — Cloudflare Tunnel handles public access
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - internal

  # ── Cloudflare Tunnel ──────────────────────────────────────────────
  # Uncomment once cloudflared token is configured
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   container_name: immogestion-tunnel
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
  #   networks:
  #     internal

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
  logs:
    driver: local

networks:
  internal:
    driver: bridge
