name: '🔧 Fix Backend Services'

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  fix_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::422017356244:role/github-actions-role' }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com
      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.EKS_CLUSTER_NAME || 'cloudtolocalllm-eks' }} \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }}
      - name: Nuclear Reset and Redeploy
        env:
          ENVIRONMENT: managed
          NAMESPACE: cloudtolocalllm
          WEB_IMAGE: ghcr.io/cloudtolocalllm-online/cloudtolocalllm/web:latest
          API_IMAGE: ghcr.io/cloudtolocalllm-online/cloudtolocalllm/api:latest
          STREAMING_IMAGE: ghcr.io/cloudtolocalllm-online/cloudtolocalllm/streaming:latest
          POSTGRES_IMAGE: ghcr.io/cloudtolocalllm-online/cloudtolocalllm/postgres:latest
        run: |
          echo "☢️ CORE CLEAN: Deleting all core deployments and replicasets..."
          kubectl delete deployment api-backend web streaming-proxy -n $NAMESPACE --force --grace-period=0 || true
          kubectl delete replicaset --all -n $NAMESPACE --force --grace-period=0 || true
          
          echo "🗑️ Cleaning up pods..."
          kubectl delete pod --all -n $NAMESPACE --force --grace-period=0 || true
          
          echo "🚀 Redeploying using standard script..."
          chmod +x scripts/deploy-in-cluster.sh
          ./scripts/deploy-in-cluster.sh
          
          echo "📋 Post-reset status:"
          kubectl get pods -n $NAMESPACE
