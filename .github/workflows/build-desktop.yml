name: "💻 Desktop Build & Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 10.1.202). Leave empty for auto-bump."
        required: false
        default: ""
        type: string
      platforms:
        description: "Platforms to build (comma-separated)"
        required: false
        default: "linux,windows"
        type: string

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: flutter analyze
        run: |
          flutter pub get
          flutter analyze lib/
          echo "✅ Analysis passed"

  set_version:
    name: Set Version
    needs: analyze
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Compute version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION=${{ inputs.version }}
          else
            VERSION=$(jq -r '.version' assets/version.json)
            IFS='.' read -r -a v <<< "$VERSION"
            v[2]=$((v[2] + 1))
            VERSION="${v[0]}.${v[1]}.${v[2]}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_linux:
    name: Linux Build
    needs: set_version
    if: contains(inputs.platforms, 'linux')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set Version
        run: |
          VERSION=${{ needs.set_version.outputs.version }}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          sed -i "s/^version: .*/version: $VERSION+${{ github.run_number }}/" pubspec.yaml
          jq ".version = \"$VERSION\" | .build_number = \"${{ github.run_number }}\"" assets/version.json > assets/version.json.tmp && mv assets/version.json.tmp assets/version.json

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++6 libayatana-appindicator3-dev libsecret-1-dev libcurl4-openssl-dev libnotify-dev zip

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Flutter Build Linux
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package Linux Distributions
        run: |
          sudo apt-get install -y libfuse2
          mkdir -p dist/linux

          STAGING_DIR=$(mktemp -d)
          mkdir -p $STAGING_DIR/cloudtolocalllm
          cp -r build/linux/x64/release/bundle/* $STAGING_DIR/cloudtolocalllm/
          tar -czf dist/linux/CloudToLocalLLM-Linux-x64.tar.gz -C $STAGING_DIR cloudtolocalllm

          chmod +x scripts/packaging/build_deb.sh
          ./scripts/packaging/build_deb.sh

          chmod +x scripts/packaging/build_appimage.sh
          ./scripts/packaging/build_appimage.sh || echo "AppImage build skipped"

          chmod +x scripts/packaging/update_aur_pkgbuild.sh
          ./scripts/packaging/update_aur_pkgbuild.sh

      - name: Generate Installer Script
        run: |
          chmod +x scripts/packaging/build_installer.sh
          ./scripts/packaging/build_installer.sh

      - name: Upload Linux Bundles
        uses: actions/upload-artifact@v5
        with:
          name: linux-bundles
          path: dist/linux/*
          retention-days: 7

  build_windows:
    name: Windows Build
    needs: set_version
    if: contains(inputs.platforms, 'windows')
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v5

      - name: Set Version
        shell: bash
        run: |
          VERSION=${{ needs.set_version.outputs.version }}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          sed -i "s/^version: .*/version: $VERSION+${{ github.run_number }}/" pubspec.yaml
          jq ".version = \"$VERSION\" | .build_number = \"${{ github.run_number }}\"" assets/version.json > assets/version.json.tmp && mv assets/version.json.tmp assets/version.json

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Windows Dependencies (cpprestsdk)
        shell: pwsh
        run: |
          # auth0_flutter needs cpprestsdk — install via vcpkg
          vcpkg install cpprestsdk --triplet x64-windows
          echo "CPPRESTSDK_DIR=C:\vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Flutter Build Windows
        run: |
          flutter pub get
          flutter build windows --release

      - name: Build Windows Installer
        shell: pwsh
        run: ./scripts/packaging/build_windows_installer.ps1

      - name: Upload Windows Bundles
        uses: actions/upload-artifact@v5
        with:
          name: windows-bundles
          path: |
            build/windows/x64/runner/Release/*.msix
            dist/windows/*.exe
          retention-days: 7

  create_release:
    needs: [set_version, build_linux, build_windows]
    if: always() && needs.build_linux.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5

      - name: Compute version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          else
            VERSION=$(jq -r '.version' assets/version.json)
            IFS='.' read -r -a v <<< "$VERSION"
            v[2]=$((v[2] + 1))
            VERSION="${v[0]}.${v[1]}.${v[2]}"
            echo "VERSION=$VERSION" >> $GITHUB_ENV
          fi
          echo "tag=v${{ env.VERSION }}" >> $GITHUB_ENV

      - name: Prepare AUR metadata
        run: |
          set -euo pipefail
          APPIMAGE=$(ls linux-bundles/*.AppImage 2>/dev/null | head -1 || echo "")
          if [ -n "$APPIMAGE" ]; then
            SHA256=$(sha256sum "$APPIMAGE" | awk '{print $1}')
            AUR_VERSION_OVERRIDE="${{ env.VERSION }}" AUR_APPIMAGE_SHA256="$SHA256" bash ./scripts/packaging/update_aur_pkgbuild.sh
          fi

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            linux-bundles/*,
            windows-bundles/*
          tag: "v${{ env.VERSION }}"
          name: "Release v${{ env.VERSION }}"
          artifactErrorsFailBuild: false
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
          body: |
            ## Desktop Release v${{ env.VERSION }}

            ### Linux
            - **AppImage**: `cloudtolocalllm-${{ env.VERSION }}-x86_64.AppImage`
            - **Debian/Ubuntu**: `CloudToLocalLLM_${{ env.VERSION }}_amd64.deb`
            - **Portable**: `CloudToLocalLLM-Linux-x64.tar.gz`
            - **Arch Linux**: AUR package (`cloudtolocalllm`)
            - Install script: `curl -fsSL https://cloudtolocalllm.online/install.sh | bash`

            ### Windows
            - **Installer**: `CloudToLocalLLM-Windows-x64-Setup.exe`
            - **Portable ZIP**: `CloudToLocalLLM-Windows-x64.zip`

            ### macOS
            - **Coming soon**
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "AUR_SSH_KEY not set — skipping AUR publish"
            exit 0
          fi
          set -euo pipefail
          VERSION="${{ env.VERSION }}"
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          echo -e "Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur_key\n  User aur" >> ~/.ssh/config
          git clone ssh://aur@aur.archlinux.org/cloudtolocalllm.git /tmp/aur-pkg
          cp -r dist/aur/PKGBUILD dist/aur/.SRCINFO /tmp/aur-pkg/
          cd /tmp/aur-pkg
          git config user.name "CloudToLocalLLM CI"
          git config user.email "ci@cloudtolocalllm.online"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No changes to AUR package — skipping push"
          else
            git commit -m "Update to v${VERSION}"
            git push origin master
          fi
