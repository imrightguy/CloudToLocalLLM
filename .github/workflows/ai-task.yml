name: "🤖 AI Task Execution"

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_call:
    inputs:
      additional_context:
        type: "string"
        description: "Context for AI Agent"
        required: false

jobs:
  execute_task:
    runs-on: "blacksmith-4vcpu-ubuntu-2404"
    timeout-minutes: 15
    permissions:
      contents: "write"
      id-token: "write"
      issues: "write"
      pull-requests: "write"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
      - name: "Mint identity token"
        id: "mint_identity_token"
        if: |-
          ${{ vars.APP_ID }}
        uses: "actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b"
        with:
          app-id: "${{ vars.APP_ID }}"
          private-key: "${{ secrets.APP_PRIVATE_KEY }}"
          permission-contents: "write"
          permission-issues: "write"
          permission-pull-requests: "write"

      - name: "Run AI Agent"
        id: "run_ai_agent"
        env:
          KILOCODE_TOKEN: "${{ secrets.KILOCODE_TOKEN }}"
          KILOCODE_MODEL: "${{ vars.KILOCODE_MODEL }}"
          KILOCODE_POSTHOG_API_KEY: "${{ secrets.KILOCODE_POSTHOG_API_KEY }}"
          GITHUB_TOKEN: "${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}"
          TITLE: "${{ github.event.pull_request.title || github.event.issue.title }}"
          DESCRIPTION: "${{ github.event.pull_request.body || github.event.issue.body }}"
          ADDITIONAL_CONTEXT: "${{ inputs.additional_context }}"
        run: |
          # Generate Kilocode Configuration
          cat <<EOF > kilocode.config.json
          {
            "version": "1.0.0",
            "mode": "code",
            "telemetry": true,
            "provider": "default",
            "providers": [
              {
                "id": "default",
                "provider": "kilocode",
                "kilocodeToken": "$KILOCODE_TOKEN",
                "kilocodeModel": "$KILOCODE_MODEL",
                "kilocodePosthogApiKey": "$KILOCODE_POSTHOG_API_KEY"
              }
            ],
            "autoApproval": {
              "enabled": true,
              "read": {
                "enabled": true,
                "outside": false
              },
              "write": {
                "enabled": true,
                "outside": true,
                "protected": false
              },
              "browser": {
                "enabled": true
              },
              "retry": {
                "enabled": true,
                "delay": 10
              },
              "mcp": {
                "enabled": true
              },
              "mode": {
                "enabled": true
              },
              "subtasks": {
                "enabled": true
              },
              "execute": {
                "enabled": true,
                "allowed": [
                  "ls",
                  "cat",
                  "echo",
                  "pwd",
                  "mkdir",
                  "cd",
                  "kubectl",
                  "curl"
                ],
                "denied": [
                  "rm -rf",
                  "sudo rm",
                  "mkfs",
                  "dd if="
                ]
              },
              "question": {
                "enabled": false,
                "timeout": 60
              },
              "todo": {
                "enabled": true
              }
            },
            "theme": "dark",
            "customThemes": {}
          }
          EOF

          mkdir -p .ai-agent
          cat > .ai-agent/settings.json <<EOF
          {
            "model": { "maxSessionTurns": 25 },
            "output": { "format": "json" },
            "mcpServers": {
              "github": {
                "command": "docker",
                "args": [
                  "run", "-i", "--rm",
                  "-e", "GITHUB_PERSONAL_ACCESS_TOKEN",
                  "ghcr.io/github/github-mcp-server:v0.18.0"
                ],
                "env": {
                  "GITHUB_PERSONAL_ACCESS_TOKEN": "$GITHUB_TOKEN"
                }
              }
            }
          }
          EOF
          echo "🔄 Starting AI Agent execution..."
          
          # Ensure local kilocode CLI is usable
          if [ -f scripts/kilocode-cli.cjs ]; then
            chmod +x scripts/kilocode-cli.cjs
            sudo ln -sf "$(pwd)/scripts/kilocode-cli.cjs" /usr/local/bin/kilocode
          fi
          
          TITLE_ESCAPED=$(echo "$TITLE" | sed 's/"/\"/g')
          DESC_ESCAPED=$(echo "$DESCRIPTION" | sed 's/"/\"/g')
          CONTEXT_ESCAPED=$(echo "$ADDITIONAL_CONTEXT" | sed 's/"/\"/g')
          if ! kilocode "TITLE: $TITLE_ESCAPED. DESCRIPTION: $DESC_ESCAPED. CONTEXT: $CONTEXT_ESCAPED. Please assist with the request." > raw_output.json 2> ai_error.log; then
            echo "::error::AI Agent failed"
            cat ai_error.log
            exit 1
          fi
          echo "✅ AI Agent completed successfully"
