name: "🤖 AI Task Execution"

permissions:
  contents: write
  id-token: write

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_dispatch:
  workflow_call:
    inputs:
      additional_context:
        type: "string"
        description: "Context for AI Agent"
        required: false

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref || github.event.pull_request.number || github.event.issue.number }}"
  cancel-in-progress: true

env:
  # Official Kilocode CLI Docker image
  KILOCODE_IMAGE: kiloai/cli:latest

jobs:
  execute_task:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: "write"
      id-token: "write"
      issues: "write"
      pull-requests: "write"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: "Mint identity token"
        id: "mint_identity_token"
        if: |-
          ${{ vars.APP_ID }}
        uses: "actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b"
        with:
          app-id: "${{ vars.APP_ID }}"
          private-key: "${{ secrets.APP_PRIVATE_KEY }}"
          permission-contents: "write"
          permission-issues: "write"
          permission-pull-requests: "write"

      - name: "Pull Official Kilocode CLI Image"
        run: |
          echo "Pulling official Kilocode CLI image from Docker Hub..."
          docker pull ${{ env.KILOCODE_IMAGE }}
          echo "✅ Successfully pulled ${{ env.KILOCODE_IMAGE }}"

      - name: "Run AI Agent"
        id: "run_ai_agent"
        continue-on-error: true
        timeout-minutes: 10
        env:
          # Prefer wiring to existing secret names without renaming secrets.
          # The CLI expects KILOCODE_TOKEN, but some repos store this as KILOCODE_API_KEY.
          KILOCODE_TOKEN: "${{ secrets.KILOCODE_TOKEN || secrets.KILOCODE_API_KEY }}"
          KILOCODE_MODEL: "x-ai/grok-code-fast-1"
          KILOCODE_TIMEOUT: 60000
          KILOCODE_RETRIES: 5
          GITHUB_TOKEN: "${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}"
          TITLE: "${{ github.event.pull_request.title || github.event.issue.title }}"
          DESCRIPTION: "${{ github.event.pull_request.body || github.event.issue.body }}"
          ADDITIONAL_CONTEXT: "${{ inputs.additional_context }}"
        run: |
          mkdir -p .ai-agent
          cat > .ai-agent/settings.json <<EOF
          {
            "model": { "maxSessionTurns": 25 },
            "output": { "format": "json" },
            "mcpServers": {
              "github": {
                "command": "docker",
                "args": [
                  "run", "-i", "--rm",
                  "-e", "GITHUB_PERSONAL_ACCESS_TOKEN",
                  "ghcr.io/github/github-mcp-server:v0.18.0"
                ],
                "env": {
                  "GITHUB_PERSONAL_ACCESS_TOKEN": "$GITHUB_TOKEN"
                }
              }
            }
          }
          EOF
          echo "🔄 Starting AI Agent execution..."

          TITLE_ESCAPED=$(echo "$TITLE" | sed 's/"/\"/g')
          DESC_ESCAPED=$(echo "$DESCRIPTION" | sed 's/"/\"/g')
          CONTEXT_ESCAPED=$(echo "$ADDITIONAL_CONTEXT" | sed 's/"/\"/g')

          PROMPT="TITLE: $TITLE_ESCAPED. DESCRIPTION: $DESC_ESCAPED. CONTEXT: $CONTEXT_ESCAPED. Please assist with the request."
          
          # Implementation of robust error handling with retries and timeout
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES..."
            if timeout 600 docker run --rm \
              -v "$(pwd):/workspace" \
              -e KILO_PROVIDER_TYPE=kilocode \
              -e KILOCODE_TOKEN \
              -e KILOCODE_MODEL \
              -e KILO_TELEMETRY=false \
              -e KILO_AUTO_APPROVAL_ENABLED=true \
              -e GITHUB_TOKEN \
              ${{ env.KILOCODE_IMAGE }} \
              kilocode --auto "$PROMPT" > raw_output.json 2> ai_error.log; then
              SUCCESS=true
              break
            else
              echo "::warning::Attempt $((RETRY_COUNT + 1)) failed. CLI Exit Code: $?"
              cat ai_error.log
              RETRY_COUNT=$((RETRY_COUNT + 1))
              [ $RETRY_COUNT -lt $MAX_RETRIES ] && sleep 15
            fi
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "::error::AI Agent CLI failed after $MAX_RETRIES attempts"
            exit 1
          fi
          echo "✅ AI Agent completed successfully"

      - name: "KiloCode Fallback"
        if: steps.run_ai_agent.outcome == 'failure'
        run: |
          echo "::warning::KiloCode analysis failed, using fallback strategy"
          # Implement fallback logic here, e.g., use cached results or default analysis
          echo '{"result": "Analysis failed, using default fallback", "suggestions": []}' > raw_output.json
