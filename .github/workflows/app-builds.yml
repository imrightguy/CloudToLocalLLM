name: "📦 App Builds"

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 10.1.188)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build_linux:
    name: Linux Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++6 libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Build Linux
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package AppImage
        run: |
          chmod +x scripts/packaging/build_appimage.sh
          ./scripts/packaging/build_appimage.sh
        continue-on-error: true # AppImage might fail without all assets

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/x64/release/bundle/

  build_windows:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Build Windows
        run: |
          flutter pub get
          flutter build windows --release

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/

  release:
    name: Create Release
    needs: [build_linux, build_windows]
    if: inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        
      - name: Prepare Release Assets
        run: |
          mkdir -p dist
          # Zip Linux build
          cd linux-build && zip -r ../dist/CloudToLocalLLM-Linux-x64.zip . && cd ..
          # Zip Windows build
          cd windows-build && zip -r ../dist/CloudToLocalLLM-Windows-x64.zip . && cd ..

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*.zip"
          tag: "v${{ inputs.version }}"
          name: "Release v${{ inputs.version }}"
          body: "Automated desktop builds for v${{ inputs.version }}"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
