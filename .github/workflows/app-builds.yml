name: "📦 App Builds"

on:
  workflow_call:
    outputs:
      linux_artifact:
        description: "Name of the uploaded Linux bundle"
        value: linux-bundle
      windows_artifact:
        description: "Name of the uploaded Windows bundle"
        value: windows-bundle

jobs:
  build_linux:
    name: Linux Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++6 libayatana-appindicator3-dev libsecret-1-dev zip

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Build Linux
        run: |
          flutter pub get
          flutter build linux --release

      - name: Upload Linux Bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: build/linux/x64/release/bundle/

  build_windows:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Build Windows
        run: |
          flutter pub get
          flutter build windows --release

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: build/windows/x64/runner/Release/
