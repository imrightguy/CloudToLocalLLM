name: "📦 App Builds"

on:
  workflow_call:
    inputs:
      version:
        description: "Version string to apply before build"
        required: false
        type: string
    outputs:
      linux_artifact:
        description: "Name of the uploaded Linux bundle"
        value: linux-bundle
      windows_artifact:
        description: "Name of the uploaded Windows bundle"
        value: windows-bundle
      windows_installer_artifact:
        description: "Name of the uploaded Windows installer"
        value: windows-installer
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version string to apply before build"
        required: false
        default: ""
        type: string

jobs:
  build_linux:
    name: Linux Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Version
        if: inputs.version != ''
        run: |
          VERSION=${{ inputs.version }}
          sed -i "s/^version: .*/version: $VERSION+${{ github.run_number }}/" pubspec.yaml
          jq ".version = \"$VERSION\" | .build_number = \"${{ github.run_number }}\"" assets/version.json > assets/version.json.tmp && mv assets/version.json.tmp assets/version.json

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++6 libayatana-appindicator3-dev libsecret-1-dev libcurl4-openssl-dev libnotify-dev zip

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Build Linux
        run: |
          flutter pub get
          flutter build linux --release

      - name: Upload Linux Bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: build/linux/x64/release/bundle/

  build_windows:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Version
        if: inputs.version != ''
        shell: bash
        run: |
          VERSION=${{ inputs.version }}
          sed -i "s/^version: .*/version: $VERSION+${{ github.run_number }}/" pubspec.yaml
          jq ".version = \"$VERSION\" | .build_number = \"${{ github.run_number }}\"" assets/version.json > assets/version.json.tmp && mv assets/version.json.tmp assets/version.json

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Build Windows
        run: |
          flutter pub get
          flutter build windows --release

      - name: Build Windows Installer
        shell: pwsh
        run: |
          ./scripts/packaging/build_windows_installer.ps1

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: build/windows/x64/runner/Release/

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/windows/CloudToLocalLLM-Windows-x64-Setup.exe

  build_android:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Version
        if: inputs.version != ''
        run: |
          VERSION=${{ inputs.version }}
          sed -i "s/^version: .*/version: $VERSION+${{ github.run_number }}/" pubspec.yaml
          jq ".version = \"$VERSION\" | .build_number = \"${{ github.run_number }}\"" assets/version.json > assets/version.json.tmp && mv assets/version.json.tmp assets/version.json

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/release-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../release-keystore.jks
          EOF

      - name: Flutter Build APK
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload APK (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-arm32
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload APK (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
