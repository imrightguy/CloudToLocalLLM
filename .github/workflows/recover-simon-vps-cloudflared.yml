name: Recover Simon VPS Cloudflared

on:
  workflow_dispatch:
    inputs:
      host:
        description: Simon VPS host
        required: false
        default: 31.97.140.7
      user:
        description: SSH user
        required: false
        default: root
  repository_dispatch:
    types:
      - recover_simon_vps_cloudflared

permissions:
  contents: read

jobs:
  recover_cloudflared:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Simon VPS SSH key
        env:
          SIMON_VPS_SSH_PRIVATE_KEY: ${{ secrets.SIMON_VPS_SSH_PRIVATE_KEY }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          SWARM_SSH_KEY: ${{ secrets.SWARM_SSH_KEY }}
        run: |
          set -euo pipefail
          SSH_KEY="${SIMON_VPS_SSH_PRIVATE_KEY:-${VM_SSH_PRIVATE_KEY:-${SWARM_SSH_KEY:-}}}"
          if [ -z "$SSH_KEY" ]; then
            echo "No Simon VPS SSH key secret is available" >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/simon_vps_key
          chmod 600 ~/.ssh/simon_vps_key

      - name: Reconcile Cloudflare tunnel and public DNS
        env:
          SIMON_HOST: ${{ inputs.host || '31.97.140.7' }}
          SIMON_USER: ${{ inputs.user || 'root' }}
          SIMON_SSH_KEY_FILE: /home/runner/.ssh/simon_vps_key
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DOMAIN: cloudtolocalllm.online
          CLOUDFLARE_TUNNEL_ID: b0aebd5d-5fdf-4dc1-b64c-932c4ee8b400
          SYNC_REPO: false
          DEPLOY_APP: false
          RECONCILE_CLOUDFLARE: true
          VERIFY_PUBLIC: true
        run: |
          set -euo pipefail
          chmod +x scripts/deploy-simon-vps.sh
          bash scripts/deploy-simon-vps.sh
