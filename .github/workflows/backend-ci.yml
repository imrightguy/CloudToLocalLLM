name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'services/api-backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/api-backend/**'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  API_DIR: services/api-backend
  NODE_VERSION: '20'

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.API_DIR }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: immogestion_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.API_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:test_password@localhost:5432/immogestion_test
          DB_PASSWORD: test_password
          JWT_SECRET: test-secret-for-ci
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/immogestion
            git pull
            cd services/api-backend
            docker compose up -d --build

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if ssh -o StrictHostKeyChecking=no \
              -i <(echo "${{ secrets.VPS_SSH_KEY }}") \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "curl -sf http://localhost:3000/health" > /dev/null 2>&1; then
              echo "API healthy after ${i} attempts"
              exit 0
            fi
            echo "Waiting for API... (${i}/20)"
            sleep 5
          done
          echo "ERROR: API did not become healthy within 100s"
          exit 1
