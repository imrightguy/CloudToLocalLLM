name: "🔀 AI Triage"

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

on:
  schedule:
    - cron: "0 * * * *" # Runs hourly
  workflow_call:
    inputs:
      additional_context:
        type: "string"
        description: "Any additional context from the request"
        required: false

concurrency:
  group: "${{ github.workflow }}-triage-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}"
  cancel-in-progress: true

defaults:
  run:
    shell: "bash"

env:
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  # Official Kilocode CLI Docker image
  KILOCODE_IMAGE: kiloai/cli:latest

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    outputs:
      available_labels: "${{ steps.get_labels.outputs.available_labels }}"
      selected_labels: "${{ steps.parse_output.outputs.labels }}"
    permissions:
      contents: "read"
      id-token: "write"
      issues: "read"
      pull-requests: "read"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: "Validate Secrets"
        run: |
          echo "Checking for required secrets..."
          if [ -z "${{ secrets.KILOCODE_TOKEN || secrets.KILOCODE_API_KEY }}" ]; then
            echo "::error::Missing KILOCODE_TOKEN or KILOCODE_API_KEY secret"
            exit 1
          fi
          echo "✅ Required secrets are present"

      - name: "Authenticate with Docker Hub"
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ] && [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          else
            echo "::info::Docker Hub credentials not found, skipping authentication"
          fi

      - name: "Cache Docker Image"
        uses: actions/cache@v4
        with:
          path: /tmp/.docker-cache
          key: docker-kiloai-cli-${{ hashFiles('config/docker/Dockerfile.kilocode') }}
          restore-keys: |
            docker-kiloai-cli-
    
      - name: "Load Cached Docker Image"
        run: |
          if [ -f /tmp/.docker-cache/image.tar ]; then
            echo "Loading cached Docker image..."
            docker load < /tmp/.docker-cache/image.tar
            echo "✅ Cached image loaded"
          else
            echo "No cached image found, pulling..."
            docker pull ${{ env.KILOCODE_IMAGE }}
            mkdir -p /tmp/.docker-cache
            docker save ${{ env.KILOCODE_IMAGE }} > /tmp/.docker-cache/image.tar
            echo "✅ Image pulled and cached"
          fi

      - name: "Health Check Container"
        run: |
          echo "Verifying container execution..."
          docker run --rm --entrypoint node ${{ env.KILOCODE_IMAGE }} --version
          echo "✅ Container is functional"

      - name: "Get repository labels"
        id: "get_labels"
        uses: "actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea" # ratchet:actions/github-script@v7.0.1
        with:
          # NOTE: we intentionally do not use the given token. The default
          # GITHUB_TOKEN provided by the action has enough permissions to read
          # the labels.
          script: |-
            const labels = [];
            for await (const response of github.paginate.iterator(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100, // Maximum per page to reduce API calls
            })) {
              labels.push(...response.data);
            }

            if (!labels || labels.length === 0) {
              core.setFailed('There are no issue labels in this repository.')
            }

            const labelNames = labels.map(label => label.name).sort();
            core.setOutput('available_labels', labelNames.join(','));
            core.info(`Found ${labelNames.length} labels: ${labelNames.join(', ')}`);
            return labelNames;

      - name: "Run AI issue analysis"
        id: "ai_analysis"
        if: |-
          ${{ steps.get_labels.outputs.available_labels != '' }}
        env:
          # Prefer wiring to existing secret names without renaming secrets.
          # The CLI expects KILOCODE_TOKEN, but some repos store this as KILOCODE_API_KEY.
          KILOCODE_TOKEN: "${{ secrets.KILOCODE_TOKEN || secrets.KILOCODE_API_KEY }}"
          KILOCODE_MODEL: "x-ai/grok-code-fast-1"
          ISSUE_TITLE: "${{ github.event.issue.title }}"
          ISSUE_BODY: "${{ github.event.issue.body }}"
          AVAILABLE_LABELS: "${{ steps.get_labels.outputs.available_labels }}"
        run: |
          PROMPT="You are a precise GitHub issue triager.
          TASK: Assign labels from the list below to the provided issue.
          AVAILABLE LABELS: $AVAILABLE_LABELS
          ISSUE TITLE: $ISSUE_TITLE
          ISSUE BODY: $ISSUE_BODY

          OUTPUT FORMAT:
          - Return ONLY a valid JSON object with exactly one field:
            \"labels\": (array of strings)
          - EVERY string in the array MUST be enclosed in double quotes.
          - Do NOT include any other fields or markdown formatting.

          VALID JSON EXAMPLE:
          {\"labels\": [\"bug\", \"priority: low\"]}"


          echo "🔄 Starting AI issue analysis..."
          
          # Implementation of robust error handling with retries and timeout
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES..."
            # Use arguments instead of pipe and remove explicit 'kilocode' command (assuming ENTRYPOINT)
            if timeout 300 docker run --rm \
              -v "$(pwd):/workspace" \
              -e CI=true \
              -e TERM=dumb \
              -e KILO_PROVIDER_TYPE=kilocode \
              -e KILOCODE_TOKEN \
              -e KILOCODE_MODEL \
              -e KILO_TELEMETRY=false \
              -e KILO_AUTO_APPROVAL_ENABLED=true \
              ${{ env.KILOCODE_IMAGE }} \
              --auto --json "$PROMPT" 2> ai_error.log > raw_output.json; then
              SUCCESS=true
              break
            else
              echo "::warning::Attempt $((RETRY_COUNT + 1)) failed. CLI Exit Code: $?"
              cat ai_error.log
              RETRY_COUNT=$((RETRY_COUNT + 1))
              [ $RETRY_COUNT -lt $MAX_RETRIES ] && sleep 15
            fi
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "::error::AI Agent CLI failed after $MAX_RETRIES attempts"
            exit 1
          fi
          echo "✅ AI issue analysis completed successfully"




      - name: "KiloCode Fallback"
        if: failure()
        run: |
          echo "::warning::AI triage failed, using fallback"
          echo '{"labels": []}' > raw_output.json
          CLEAN_JSON=$(cat raw_output.json)
          echo "ai_output<<EOF" >> $GITHUB_OUTPUT
          echo "$CLEAN_JSON" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: "Parse AI output"
        id: "parse_output"
        if: |-
          ${{ steps.ai_analysis.outcome == 'success' }}
        run: |
          LABELS=$(jq -r '.labels // empty | join(",")' raw_output.json)
          echo "labels=$LABELS" >> $GITHUB_OUTPUT

  label:
    runs-on: ubuntu-latest
    needs:
      - "triage"
    if: |-
      ${{ needs.triage.outputs.selected_labels != '' }}
    permissions:
      contents: "read"
      issues: "write"
      pull-requests: "write"
    steps:
      - name: "Mint identity token"
        id: "mint_identity_token"
        if: |-
          ${{ vars.APP_ID }}
        uses: "actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf" # ratchet:actions/create-github-app-token@v2
        with:
          app-id: "${{ vars.APP_ID }}"
          private-key: "${{ secrets.APP_PRIVATE_KEY }}"
          permission-contents: "read"
          permission-issues: "write"
          permission-pull-requests: "write"

      - name: "Apply labels"
        env:
          ISSUE_NUMBER: "${{ github.event.issue.number }}"
          AVAILABLE_LABELS: "${{ needs.triage.outputs.available_labels }}"
          SELECTED_LABELS: "${{ needs.triage.outputs.selected_labels }}"
        uses: "actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea" # ratchet:actions/github-script@v7.0.1
        with:
          # Use the provided token so that the "ai-agent" is the actor in the
          # log for what changed the labels.
          github-token: "${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}"
          script: |-
            // Parse the available labels
            const availableLabels = (process.env.AVAILABLE_LABELS || '').split(',')
              .map((label) => label.trim())
              .sort()

            // Parse the label as a CSV, reject invalid ones - we do this just
            // in case someone was able to prompt inject malicious labels.
            const selectedLabels = (process.env.SELECTED_LABELS || '').split(',')
              .map((label) => label.trim())
              .filter((label) => availableLabels.includes(label))
              .sort()

            // Set the labels
            const issueNumber = process.env.ISSUE_NUMBER;
            if (selectedLabels && selectedLabels.length > 0) {
              await github.rest.issues.setLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: selectedLabels,
              });
              core.info(`Successfully set labels: ${selectedLabels.join(',')}`);
            } else {
              core.info(`Failed to determine labels to set. There may not be enough information in the issue or pull request.`)
            }
