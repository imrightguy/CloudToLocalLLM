name: "Remove AUR AppImage Package"

on:
  workflow_dispatch:

jobs:
  remove_aur_appimage:
    runs-on: ubuntu-latest
    steps:
      - name: Remove cloudtolocalllm-appimage from AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.AUR_SSH_PUB }}" > ~/.ssh/id_ed25519.pub
          chmod 600 ~/.ssh/id_ed25519
          chmod 644 ~/.ssh/id_ed25519.pub
          if [ -n "${{ secrets.AUR_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.AUR_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts
          printf '%s\n' 'Host aur.archlinux.org' '  IdentityFile ~/.ssh/id_ed25519' '  IdentitiesOnly yes' > ~/.ssh/config
          chmod 600 ~/.ssh/config

          # Clone and delete
          GIT_SSH_COMMAND='ssh -F ~/.ssh/config' git clone ssh://aur@aur.archlinux.org/cloudtolocalllm-appimage.git /tmp/aur-remove || exit 0
          cd /tmp/aur-remove
          
          # Remove all files
          git rm -f PKGBUILD .SRCINFO 2>/dev/null || true
          
          git config user.name "rightguy"
          git config user.email "christopher.maltais@gmail.com"
          git commit -m "Remove package - consolidated into cloudtolocalllm" || echo "Nothing to remove"
          GIT_SSH_COMMAND='ssh -F ~/.ssh/config' git push origin master || echo "Push failed"
          
          echo "cloudtolocalllm-appimage removal complete"
