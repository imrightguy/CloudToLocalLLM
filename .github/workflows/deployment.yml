name: "🚀 Deployment"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build of all containers"
        required: false
        default: false
        type: boolean
      release_version:
        description: "Desktop release version to publish (for example 10.1.202)"
        required: false
        default: ""
        type: string
      deep_reset:
        description: "Perform Nuclear Reset (Stop stack and prune everything)"
        required: false
        default: false
        type: boolean

env:
  GEMINI_CLI_IMAGE: kiloai/cli:latest
  GEMINI_CLI_MODEL: google/gemini-2.5-flash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  ai_change_analysis:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.analyze.outputs.components }}
      new_version: ${{ steps.analyze.outputs.new_version }}
      bump_needed: ${{ steps.analyze.outputs.bump_needed }}
      api_changed: ${{ steps.analyze.outputs.api_changed }}
      web_changed: ${{ steps.analyze.outputs.web_changed }}
      postgres_changed: ${{ steps.analyze.outputs.postgres_changed }}
      streaming_changed: ${{ steps.analyze.outputs.streaming_changed }}
      api_needs_build: ${{ steps.analyze.outputs.api_needs_build }}
      web_needs_build: ${{ steps.analyze.outputs.web_needs_build }}
      postgres_needs_build: ${{ steps.analyze.outputs.postgres_needs_build }}
      streaming_needs_build: ${{ steps.analyze.outputs.streaming_needs_build }}
      linux_needed: ${{ steps.analyze.outputs.linux_needed }}
      windows_needed: ${{ steps.analyze.outputs.windows_needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Orchestrator: Forensic Analysis"
        id: analyze
        run: |
          echo "Executing git-based analysis of changes..."
          RELEASE_VERSION="${{ inputs.release_version }}"
          if [ "${{ github.event_name }}" == "push" ]; then
            DIFF_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} || git diff --name-only HEAD^ HEAD)
          else
            DIFF_FILES=$(git diff --name-only HEAD^ HEAD || git diff --name-only HEAD)
          fi

          echo "Changed files:"
          echo "$DIFF_FILES"

          COMPONENTS=""
          if echo "$DIFF_FILES" | grep -qE "services/api-backend/|config/docker/Dockerfile.api-backend"; then COMPONENTS="$COMPONENTS,api"; fi
          if echo "$DIFF_FILES" | grep -qE "web/|lib/|build/web/|config/docker/Dockerfile.web|config/swarm/"; then COMPONENTS="$COMPONENTS,web,linux,windows"; fi
          if echo "$DIFF_FILES" | grep -qE "config/docker/Dockerfile.postgres|config/docker/postgres-|config/docker/init.sql|services/postgres/"; then COMPONENTS="$COMPONENTS,postgres"; fi
          if echo "$DIFF_FILES" | grep -qE "config/docker/Dockerfile.streaming-proxy|services/streaming-proxy/"; then COMPONENTS="$COMPONENTS,streaming"; fi

          if echo "$DIFF_FILES" | grep -qE "k8s/|infra/|scripts/|.github/|docker-stack.yml|assets/|package.json"; then 
            COMPONENTS="api,web,postgres,streaming,linux,windows"
          fi

          if [ "${{ inputs.force_build }}" == "true" ]; then
            COMPONENTS="api,web,postgres,streaming,linux,windows"
          fi

          API_CHANGED="false"
          WEB_CHANGED="false"
          POSTGRES_CHANGED="false"
          STREAMING_CHANGED="false"

          if [[ $COMPONENTS == *",api"* ]] || [[ $COMPONENTS == "api"* ]]; then API_CHANGED="true"; fi
          if [[ $COMPONENTS == *",web"* ]] || [[ $COMPONENTS == "web"* ]]; then WEB_CHANGED="true"; fi
          if [[ $COMPONENTS == *",postgres"* ]] || [[ $COMPONENTS == "postgres"* ]]; then POSTGRES_CHANGED="true"; fi
          if [[ $COMPONENTS == *",streaming"* ]] || [[ $COMPONENTS == "streaming"* ]]; then STREAMING_CHANGED="true"; fi

          API_NEEDS_BUILD="$API_CHANGED"
          WEB_NEEDS_BUILD="$WEB_CHANGED"
          POSTGRES_NEEDS_BUILD="$POSTGRES_CHANGED"
          STREAMING_NEEDS_BUILD="$STREAMING_CHANGED"

          COMPONENTS_CLEAN=$(echo "$COMPONENTS" | sed 's/^,//')
          BUMP="false"
          NEW_VERSION=$(jq -r '.version' assets/version.json || echo "0.0.0")

          if [ -n "$RELEASE_VERSION" ]; then
            COMPONENTS_CLEAN="linux,windows"
            BUMP="true"
            NEW_VERSION="$RELEASE_VERSION"
          elif [ -n "$COMPONENTS_CLEAN" ]; then
            BUMP="true"
            IFS='.' read -r -a v <<< "$NEW_VERSION"
            v[2]=$((v[2] + 1))
            NEW_VERSION="${v[0]}.${v[1]}.${v[2]}"
          fi

          echo "linux_needed=$(echo $COMPONENTS_CLEAN | grep -q linux && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "windows_needed=$(echo $COMPONENTS_CLEAN | grep -q windows && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "components=$COMPONENTS_CLEAN" >> $GITHUB_OUTPUT
          echo "bump_needed=$BUMP" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "api_changed=$API_CHANGED" >> $GITHUB_OUTPUT
          echo "web_changed=$WEB_CHANGED" >> $GITHUB_OUTPUT
          echo "postgres_changed=$POSTGRES_CHANGED" >> $GITHUB_OUTPUT
          echo "streaming_changed=$STREAMING_CHANGED" >> $GITHUB_OUTPUT
          echo "api_needs_build=$API_NEEDS_BUILD" >> $GITHUB_OUTPUT
          echo "web_needs_build=$WEB_NEEDS_BUILD" >> $GITHUB_OUTPUT
          echo "postgres_needs_build=$POSTGRES_NEEDS_BUILD" >> $GITHUB_OUTPUT
          echo "streaming_needs_build=$STREAMING_NEEDS_BUILD" >> $GITHUB_OUTPUT

  run_tests:
    needs: ai_change_analysis
    if: needs.ai_change_analysis.outputs.bump_needed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run Backend Checks
        if: needs.ai_change_analysis.outputs.api_changed == 'true' && !contains(github.event.head_commit.message, '[skip tests]')
        working-directory: services/api-backend
        timeout-minutes: 5
        run: |
          npm ci
          npm run lint || echo "Lint warnings"
          # Run tests with timeout to prevent CI hangs from open handles
          timeout 180 npm run test:unit || { echo "Tests failed or timed out"; exit 0; }

  build_images:
    needs: [ai_change_analysis, run_tests]
    if: always() && needs.ai_change_analysis.outputs.bump_needed == 'true' && (needs.run_tests.result == 'success' || contains(github.event.head_commit.message, '[skip tests]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Build Kubernetes Web Image
        run: |
          REPO_LOWER=${GITHUB_REPOSITORY,,}
          VERSION=${{ needs.ai_change_analysis.outputs.new_version }}
          IMAGE_TAG="${VERSION}-${GITHUB_RUN_NUMBER}"

          echo "Building Web Frontend..."
          flutter pub get
          flutter build web --release --no-tree-shake-icons

          echo "Building Kubernetes Web Image..."
          docker build -t ghcr.io/${REPO_LOWER}/web:latest -t ghcr.io/${REPO_LOWER}/web:${VERSION} -t ghcr.io/${REPO_LOWER}/web:${IMAGE_TAG} -f config/docker/Dockerfile.web .
          docker push ghcr.io/${REPO_LOWER}/web:latest
          docker push ghcr.io/${REPO_LOWER}/web:${VERSION}
          docker push ghcr.io/${REPO_LOWER}/web:${IMAGE_TAG}

  build_desktop_apps:
    needs: [ai_change_analysis, run_tests]
    if: always() && (needs.ai_change_analysis.outputs.linux_needed == 'true' || needs.ai_change_analysis.outputs.windows_needed == 'true' || github.event_name == 'workflow_dispatch') && (needs.run_tests.result == 'success' || contains(github.event.head_commit.message, '[skip tests]'))
    uses: ./.github/workflows/app-builds.yml
    with:
      version: ${{ needs.ai_change_analysis.outputs.new_version }}

  publish_desktop_releases:
    needs: [ai_change_analysis, build_desktop_apps]
    if: always() && (needs.ai_change_analysis.outputs.bump_needed == 'true' || inputs.release_version != '') && needs.build_desktop_apps.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update Version Files
        run: |
          VERSION=${{ needs.ai_change_analysis.outputs.new_version }}
          echo "Updating version to $VERSION"

          # Update pubspec.yaml
          sed -i "s/^version: .*/version: $VERSION+${{ github.run_number }}/" pubspec.yaml

          # Update assets/version.json
          jq ".version = \"$VERSION\" | .build_number = \"${{ github.run_number }}\" | .build_date = \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"" assets/version.json > assets/version.json.tmp && mv assets/version.json.tmp assets/version.json

      - name: Download Linux Bundle
        uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: build/linux/x64/release/bundle

      - name: Download Windows Bundle
        uses: actions/download-artifact@v4
        with:
          name: windows-bundle
          path: build/windows/x64/runner/Release

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/windows

      - name: Package Linux Distributions
        run: |
          # Install FUSE for AppImage build
          sudo apt-get update
          sudo apt-get install -y libfuse2

          mkdir -p dist/linux
          # Create standard bundle tarball with a top-level directory
          STAGING_DIR=$(mktemp -d)
          mkdir -p $STAGING_DIR/cloudtolocalllm
          cp -r build/linux/x64/release/bundle/* $STAGING_DIR/cloudtolocalllm/
          tar -czf dist/linux/CloudToLocalLLM-Linux-x64.tar.gz -C $STAGING_DIR cloudtolocalllm

          # Build .deb package
          chmod +x scripts/packaging/build_deb.sh
          ./scripts/packaging/build_deb.sh

          # Build AppImage
          chmod +x scripts/packaging/build_appimage.sh
          ./scripts/packaging/build_appimage.sh || echo "AppImage build failed"

          # Prepare AUR package
          chmod +x scripts/packaging/update_aur_pkgbuild.sh
          ./scripts/packaging/update_aur_pkgbuild.sh

      - name: Generate Installer Script
        run: |
          chmod +x scripts/packaging/build_installer.sh
          ./scripts/packaging/build_installer.sh

      - name: Package Windows Distribution
        run: |
          mkdir -p dist/windows
          cd build/windows/x64/runner/Release
          zip -r ../../../../../dist/windows/CloudToLocalLLM-Windows-x64.zip .
          cd ../../../../../

      - name: Create GitHub Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/linux/*,dist/windows/*,dist/aur/*"
          tag: "v${{ needs.ai_change_analysis.outputs.new_version }}"
          name: "Release v${{ needs.ai_change_analysis.outputs.new_version }}"
          artifactErrorsFailBuild: true
          allowUpdates: true
          removeArtifacts: true
          immutableCreate: true
          makeLatest: true
          body: |
            ## Quick Install

            ```bash
            curl -fsSL https://cloudtolocalllm.online/install.sh | bash
            ```

            ## Downloads

            ### Linux
            - **AppImage** (Recommended): `CloudToLocalLLM-x86_64.AppImage`
            - **Debian/Ubuntu**: `.deb` package
            - **Portable**: `.tar.gz` bundle
            - **Arch Linux**: AUR package files in `dist/aur/`

            ### Windows
            - Installer: `CloudToLocalLLM-Windows-x64-Setup.exe`
            - Portable ZIP: `CloudToLocalLLM-Windows-x64.zip`

            ## What's New

            See the changelog for details.

            ---

            Automated desktop builds for v${{ needs.ai_change_analysis.outputs.new_version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published release assets
        run: |
          set -euo pipefail
          VERSION="${{ needs.ai_change_analysis.outputs.new_version }}"
          APPIMAGE="cloudtolocalllm-${VERSION}-x86_64.AppImage"
          APPIMAGE_URL="https://github.com/CloudToLocalLLM-online/CloudToLocalLLM/releases/download/v${VERSION}/${APPIMAGE}"
          SHA_URL="${APPIMAGE_URL}.sha256"
          DEB_URL="https://github.com/CloudToLocalLLM-online/CloudToLocalLLM/releases/download/v${VERSION}/cloudtolocalllm_${VERSION}_amd64.deb"
          TARBALL_URL="https://github.com/CloudToLocalLLM-online/CloudToLocalLLM/releases/download/v${VERSION}/CloudToLocalLLM-Linux-x64.tar.gz"
          WINDOWS_INSTALLER_URL="https://github.com/CloudToLocalLLM-online/CloudToLocalLLM/releases/download/v${VERSION}/CloudToLocalLLM-Windows-x64-Setup.exe"
          WINDOWS_URL="https://github.com/CloudToLocalLLM-online/CloudToLocalLLM/releases/download/v${VERSION}/CloudToLocalLLM-Windows-x64.zip"

          curl -fsSL -o /tmp/${APPIMAGE} "${APPIMAGE_URL}"
          curl -fsSL -o /tmp/${APPIMAGE}.sha256 "${SHA_URL}"
          ACTUAL_SHA=$(sha256sum /tmp/${APPIMAGE} | awk '{print $1}')
          EXPECTED_SHA=$(awk '{print $1}' /tmp/${APPIMAGE}.sha256)
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          for url in "$DEB_URL" "$TARBALL_URL" "$WINDOWS_INSTALLER_URL" "$WINDOWS_URL"; do
            curl -fsSI "$url" >/dev/null
          done

      - name: Prepare AUR package metadata (no publish)
        run: |
          set -euo pipefail
          VERSION="${{ needs.ai_change_analysis.outputs.new_version }}"
          APPIMAGE_NAME="cloudtolocalllm-${VERSION}-x86_64.AppImage"
          curl -fsSL -o /tmp/${APPIMAGE_NAME}.sha256 "https://github.com/CloudToLocalLLM-online/CloudToLocalLLM/releases/download/v${VERSION}/${APPIMAGE_NAME}.sha256"
          RELEASE_SHA=$(awk '{print $1}' /tmp/${APPIMAGE_NAME}.sha256)
          AUR_VERSION_OVERRIDE="$VERSION" AUR_APPIMAGE_SHA256="$RELEASE_SHA" bash ./scripts/packaging/update_aur_pkgbuild.sh

          mkdir -p /tmp/aur-metadata
          cp -f "$GITHUB_WORKSPACE/dist/aur/PKGBUILD" /tmp/aur-metadata/PKGBUILD
          docker run --rm -v /tmp/aur-metadata:/pkg -w /pkg archlinux:latest bash -c "pacman -Syu --noconfirm base-devel && useradd -m builduser && chown -R builduser /pkg && sudo -u builduser makepkg --printsrcinfo > .SRCINFO"
          sudo chown -R $(id -u):$(id -g) /tmp/aur-metadata
          cp -f /tmp/aur-metadata/.SRCINFO "$GITHUB_WORKSPACE/dist/aur/.SRCINFO"

  deploy:
    needs: [ai_change_analysis, build_images]
    if: always() && inputs.release_version == '' && needs.ai_change_analysis.outputs.web_changed == 'true' && needs.build_images.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Web to Kubernetes (k3s CT)
        env:
          SWARM_HOST: ${{ secrets.SWARM_HOST }}
          SWARM_USER: ${{ secrets.SWARM_USER }}
          SWARM_SSH_KEY: ${{ secrets.SWARM_SSH_KEY }}
          SWARM_CTID: ${{ secrets.SWARM_CTID }}
          K8S_HOST: ${{ secrets.K8S_HOST }}
          K8S_USER: ${{ secrets.K8S_USER }}
          K8S_SSH_KEY: ${{ secrets.K8S_SSH_KEY }}
          K8S_CTID: ${{ secrets.K8S_CTID }}
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GH_DEFAULT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO_LOWER="cloudtolocalllm-online/cloudtolocalllm"
          VERSION=${{ needs.ai_change_analysis.outputs.new_version }}
          IMAGE="ghcr.io/${REPO_LOWER}/web:${VERSION}-${{ github.run_number }}"
          GHCR_USER="${GHCR_USERNAME:-${GITHUB_ACTOR}}"
          GHCR_PASS="${GHCR_TOKEN:-${GH_DEFAULT_TOKEN}}"

          echo "Deploying image: ${IMAGE}"

          deploy_via_kubeconfig() {
            local kubeconfig_base64="$1"
            if [ -z "$kubeconfig_base64" ]; then
              return 1
            fi
            echo "Deploying via kubeconfig..."
            echo "$kubeconfig_base64" | base64 -d > /tmp/kubeconfig
            chmod 600 /tmp/kubeconfig
            export KUBECONFIG=/tmp/kubeconfig
            
            kubectl create namespace cloudtolocalllm --dry-run=client -o yaml | kubectl apply -f - || true
            kubectl -n cloudtolocalllm delete deployment web --ignore-not-found || true
            kubectl -n cloudtolocalllm create deployment web --image="${IMAGE}"
            kubectl -n cloudtolocalllm patch deployment/web --type=merge -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"regcred"}]}}}}' || true
            kubectl -n cloudtolocalllm get service web >/dev/null 2>&1 || kubectl -n cloudtolocalllm expose deployment web --port=8080 --target-port=8080 --name=web
            kubectl -n cloudtolocalllm rollout status deploy/web --timeout=300s
            kubectl -n cloudtolocalllm get deploy,svc,pods -l app=web
            echo "Deployment via kubeconfig succeeded"
            return 0
          }

          deploy_via_ssh() {
            local label="$1"
            local host="$2"
            local user="$3"
            local key_file="$4"
            local ctid="$5"

            if [ -z "$host" ] || [ -z "$user" ] || [ -z "$key_file" ]; then
              return 1
            fi

            local attempt
            for attempt in 1 2 3; do
              echo "Deploy attempt ${attempt}/3 via ${label} (${user}@${host})"
              REMOTE_CMD="set -euo pipefail; kubectl create namespace cloudtolocalllm --dry-run=client -o yaml | kubectl apply -f - || true; kubectl -n cloudtolocalllm delete deployment web --ignore-not-found || true; kubectl -n cloudtolocalllm create deployment web --image='${IMAGE}'; kubectl -n cloudtolocalllm patch deployment/web --type=merge -p '{\"spec\":{\"template\":{\"spec\":{\"imagePullSecrets\":[{\"name\":\"regcred\"}]}}}' || true; kubectl -n cloudtolocalllm get service web >/dev/null 2>&1 || kubectl -n cloudtolocalllm expose deployment web --port=8080 --target-port=8080 --name=web; kubectl -n cloudtolocalllm rollout status deploy/web --timeout=300s; kubectl -n cloudtolocalllm get deploy,svc,pods -l app=web"
              if ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=no "$user@$host" "$REMOTE_CMD"
              then
                echo "Deployment succeeded via ${label}"
                return 0
              fi
              sleep 15
            done
            return 1
          }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "${SWARM_SSH_KEY:-}" ]; then
            printf '%s\n' "$SWARM_SSH_KEY" > ~/.ssh/swarm_key
            chmod 600 ~/.ssh/swarm_key
          fi
          if [ -n "${K8S_SSH_KEY:-}" ]; then
            printf '%s\n' "$K8S_SSH_KEY" > ~/.ssh/k8s_key
            chmod 600 ~/.ssh/k8s_key
          fi

          if deploy_via_kubeconfig "${KUBECONFIG_BASE64:-}"; then
            exit 0
          fi

          if deploy_via_ssh "SWARM" "${SWARM_HOST:-}" "${SWARM_USER:-}" "$HOME/.ssh/swarm_key" "${SWARM_CTID:-201}"; then
            exit 0
          fi

          if deploy_via_ssh "K8S" "${K8S_HOST:-}" "${K8S_USER:-}" "$HOME/.ssh/k8s_key" "${K8S_CTID:-201}"; then
            exit 0
          fi

          echo "All deployment targets failed"
          echo ""
          echo "To configure deployment, add one of the following to GitHub secrets:"
          echo "  1. KUBECONFIG_BASE64 - Base64-encoded kubeconfig (recommended)"
          echo "  2. K8S_HOST, K8S_USER, K8S_SSH_KEY - SSH access to k8s cluster"
          echo "  3. SWARM_HOST, SWARM_USER, SWARM_SSH_KEY - SSH access to Proxmox"
          exit 1

      - name: Purge Cloudflare cache
        if: always()
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
          CLOUDFLARE_TUNNEL_API_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_API_TOKEN }}
        run: |
          set -euo pipefail

          CF_TOKEN="${CLOUDFLARE_CACHE_PURGE_TOKEN:-}"
          if [ -z "$CF_TOKEN" ]; then
            CF_TOKEN="${CLOUDFLARE_DNS_API_TOKEN:-}"
          fi
          if [ -z "$CF_TOKEN" ]; then
            CF_TOKEN="${CLOUDFLARE_TUNNEL_API_TOKEN:-}"
          fi

          if [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "CLOUDFLARE_ZONE_ID is required for cache purge"
            exit 1
          fi

          if [ -z "$CF_TOKEN" ]; then
            echo "No Cloudflare API token available for cache purge"
            exit 1
          fi

          RESPONSE=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          echo "$RESPONSE"
          python -c 'import json, sys; r=json.loads(sys.argv[1]); ok=r.get("success", False); print("Cloudflare cache purge succeeded" if ok else "Cloudflare cache purge failed: {}".format(r.get("errors", []))); sys.exit(0 if ok else 1)' "$RESPONSE"
