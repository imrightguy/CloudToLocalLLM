name: "🚀 Deployment"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build of all containers'
        required: false
        default: false
        type: boolean
  # repository_dispatch disabled to prevent redundant builds
  # repository_dispatch:
  #   types: [orchestrator-build]

env:
  GEMINI_CLI_IMAGE: kiloai/cli:latest
  GEMINI_CLI_MODEL: google/gemini-2.5-flash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  ai_change_analysis:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.analyze.outputs.components }}
      new_version: ${{ steps.analyze.outputs.new_version }}
      bump_needed: ${{ steps.analyze.outputs.bump_needed }}
      base_changed: ${{ steps.analyze.outputs.base_changed }}
      api_changed: ${{ steps.analyze.outputs.api_changed }}
      web_changed: ${{ steps.analyze.outputs.web_changed }}
      postgres_changed: ${{ steps.analyze.outputs.postgres_changed }}
      streaming_changed: ${{ steps.analyze.outputs.streaming_changed }}
      base_needs_build: ${{ steps.analyze.outputs.base_needs_build }}
      api_needs_build: ${{ steps.analyze.outputs.api_needs_build }}
      web_needs_build: ${{ steps.analyze.outputs.web_needs_build }}
      postgres_needs_build: ${{ steps.analyze.outputs.postgres_needs_build }}
      streaming_needs_build: ${{ steps.analyze.outputs.streaming_needs_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Orchestrator: Forensic Analysis"
        id: analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Executing git-based analysis of changes..."
          if [ "${{ github.event_name }}" == "push" ]; then
            DIFF_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} || git diff --name-only HEAD^ HEAD)
          else
            DIFF_FILES=$(git diff --name-only HEAD^ HEAD || git diff --name-only HEAD)
          fi

          echo "Changed files:"
          echo "$DIFF_FILES"

          COMPONENTS=""

          # Check for changes in specific paths
          if echo "$DIFF_FILES" | grep -qE "services/api-backend/|config/docker/Dockerfile.api-backend"; then COMPONENTS="$COMPONENTS,api"; fi
          if echo "$DIFF_FILES" | grep -qE "web/|build/web/|config/docker/Dockerfile.web"; then COMPONENTS="$COMPONENTS,web"; fi
          if echo "$DIFF_FILES" | grep -qE "config/docker/Dockerfile.postgres|config/docker/postgres-|config/docker/init.sql|services/postgres/"; then COMPONENTS="$COMPONENTS,postgres"; fi
          if echo "$DIFF_FILES" | grep -qE "config/docker/Dockerfile.streaming-proxy|services/streaming-proxy/"; then COMPONENTS="$COMPONENTS,streaming"; fi
 
          # Infrastructure or global changes trigger all
          if echo "$DIFF_FILES" | grep -qE "k8s/|infra/|scripts/|.github/|config/docker/Dockerfile.base|config/docker/Dockerfile.build"; then 
            COMPONENTS="api,web,postgres,streaming,linux,windows"
            BASE_CHANGED="true"
            API_CHANGED="true"
            WEB_CHANGED="true"
            POSTGRES_CHANGED="true"
            STREAMING_CHANGED="true"
          fi

          # Manual Force Build Override
          if [ "${{ inputs.force_build }}" == "true" ]; then
            echo "MANUAL FORCE BUILD DETECTED"
            COMPONENTS="api,web,postgres,streaming,linux,windows"
            BASE_CHANGED="true"
            API_CHANGED="true"
            WEB_CHANGED="true"
            POSTGRES_CHANGED="true"
            STREAMING_CHANGED="true"
          fi
 
          # Granular Change Detection
          # BASE_CHANGED handled above or initialized
          if [ -z "$BASE_CHANGED" ]; then BASE_CHANGED="false"; fi
          if echo "$DIFF_FILES" | grep -qE "config/docker/Dockerfile.base|config/docker/Dockerfile.build"; then BASE_CHANGED="true"; fi
 
          if [ -z "$API_CHANGED" ]; then API_CHANGED="false"; fi
          if echo "$DIFF_FILES" | grep -qE "services/api-backend/|config/docker/Dockerfile.api-backend"; then API_CHANGED="true"; fi
 
          if [ -z "$WEB_CHANGED" ]; then WEB_CHANGED="false"; fi
          if echo "$DIFF_FILES" | grep -qE "web/|build/web/|config/docker/Dockerfile.web"; then WEB_CHANGED="true"; fi
 
          if [ -z "$POSTGRES_CHANGED" ]; then POSTGRES_CHANGED="false"; fi
          if echo "$DIFF_FILES" | grep -qE "config/docker/Dockerfile.postgres|config/docker/postgres-|config/docker/init.sql|services/postgres/"; then POSTGRES_CHANGED="true"; fi
          if [ "$BASE_CHANGED" == "true" ]; then POSTGRES_CHANGED="true"; fi
 
          if [ -z "$STREAMING_CHANGED" ]; then STREAMING_CHANGED="false"; fi
          if echo "$DIFF_FILES" | grep -qE "config/docker/Dockerfile.streaming-proxy|services/streaming-proxy/"; then STREAMING_CHANGED="true"; fi


          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          REPO_NAME_LOWER="${REPO_NAME,,}"

          check_ghcr_tag() {
            local package="$1"
            local tag="$2"
            local package_path="${REPO_NAME_LOWER}/${package}"
            local encoded="${package_path//\//%2F}"

            for scope in orgs users; do
              if gh api "/${scope}/${OWNER}/packages/container/${encoded}/versions?per_page=100" > /tmp/ghcr_versions.json 2>/dev/null; then
                if jq -e --arg tag "$tag" '.[] | select(.metadata.container.tags[]? == $tag)' /tmp/ghcr_versions.json >/dev/null; then
                  return 0
                fi
                return 1
              fi
            done

            return 1
          }

          BASE_NEEDS_BUILD="$BASE_CHANGED"
          if [ "$BASE_CHANGED" == "true" ] && [ "${{ inputs.force_build }}" != "true" ]; then
            if check_ghcr_tag "base" "$GITHUB_SHA" && check_ghcr_tag "build" "$GITHUB_SHA"; then
              BASE_NEEDS_BUILD="false"
            fi
          fi
 
          API_NEEDS_BUILD="$API_CHANGED"
          if [ "$API_CHANGED" == "true" ] && [ "${{ inputs.force_build }}" != "true" ] && check_ghcr_tag "api" "$GITHUB_SHA"; then
            API_NEEDS_BUILD="false"
          fi
 
          WEB_NEEDS_BUILD="$WEB_CHANGED"
          if [ "$WEB_CHANGED" == "true" ] && [ "${{ inputs.force_build }}" != "true" ] && check_ghcr_tag "web" "$GITHUB_SHA"; then
            WEB_NEEDS_BUILD="false"
          fi
 
          POSTGRES_NEEDS_BUILD="$POSTGRES_CHANGED"
          if [ "$POSTGRES_CHANGED" == "true" ] && [ "${{ inputs.force_build }}" != "true" ] && check_ghcr_tag "postgres" "$GITHUB_SHA"; then
            POSTGRES_NEEDS_BUILD="false"
          fi
 
          STREAMING_NEEDS_BUILD="$STREAMING_CHANGED"
          if [ "$STREAMING_CHANGED" == "true" ] && [ "${{ inputs.force_build }}" != "true" ] && check_ghcr_tag "streaming" "$GITHUB_SHA"; then
            STREAMING_NEEDS_BUILD="false"
          fi
 
          # Clean up leading comma
          COMPONENTS=$(echo "$COMPONENTS" | sed 's/^,//')

          # Calculate Version Bump (Simple Auto-Patch)
          if [ -n "$COMPONENTS" ]; then
            BUMP="true"
            CURRENT_VERSION=$(jq -r '.version' assets/version.json || echo "0.0.0")
            # Split version into array
            IFS='.' read -r -a v <<< "$CURRENT_VERSION"
            # Increment patch
            v[2]=$((v[2] + 1))
            NEW_VERSION="${v[0]}.${v[1]}.${v[2]}"
            REASON="Automated patch bump for changed components: $COMPONENTS"
          else
            BUMP="false"
            NEW_VERSION=""
            REASON="No buildable components changed"
          fi

          echo "Orchestrator Decision: $REASON"
          echo "components=$COMPONENTS" >> $GITHUB_OUTPUT
          echo "bump_needed=$BUMP" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "base_changed=$BASE_CHANGED" >> $GITHUB_OUTPUT
          echo "api_changed=$API_CHANGED" >> $GITHUB_OUTPUT
          echo "web_changed=$WEB_CHANGED" >> $GITHUB_OUTPUT
          echo "postgres_changed=$POSTGRES_CHANGED" >> $GITHUB_OUTPUT
          echo "streaming_changed=$STREAMING_CHANGED" >> $GITHUB_OUTPUT
          echo "base_needs_build=$BASE_NEEDS_BUILD" >> $GITHUB_OUTPUT
          echo "api_needs_build=$API_NEEDS_BUILD" >> $GITHUB_OUTPUT
          echo "web_needs_build=$WEB_NEEDS_BUILD" >> $GITHUB_OUTPUT
          echo "postgres_needs_build=$POSTGRES_NEEDS_BUILD" >> $GITHUB_OUTPUT
          echo "streaming_needs_build=$STREAMING_NEEDS_BUILD" >> $GITHUB_OUTPUT
 
      - name: "Orchestrator: Commit Version Bump"
        if: steps.analyze.outputs.bump_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.analyze.outputs.new_version }}"
          echo "Executing automated version bump to $NEW_VERSION"

          # Setup git with GH_TOKEN permissions
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Update version
          jq --arg v "$NEW_VERSION" '.version = $v' assets/version.json > tmp.json && mv tmp.json assets/version.json

           if git diff --quiet assets/version.json; then
             echo "No changes in version file. Skipping commit."
           else
             git add assets/version.json
             git commit -m "chore: automated version bump to $NEW_VERSION [skip ci]"

             # Using authenticated remote URL for the push
             git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
           fi

  build_base:
    needs: ai_change_analysis
    if: needs.ai_change_analysis.outputs.components != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.ai_change_analysis.outputs.base_needs_build == 'true'

      - name: Build Base Images
        if: needs.ai_change_analysis.outputs.base_needs_build == 'true'
        run: |
          docker build -t cloudtolocalllm/base:latest -f config/docker/Dockerfile.base .
          docker build -t cloudtolocalllm-build:latest -f config/docker/Dockerfile.build .

      - name: Downcase Repo Name
        if: needs.ai_change_analysis.outputs.base_needs_build == 'true'
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        if: needs.ai_change_analysis.outputs.base_needs_build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Base Image
        if: needs.ai_change_analysis.outputs.base_needs_build == 'true'
        run: |
          docker tag cloudtolocalllm/base:latest ghcr.io/${{ env.REPO_LOWER }}/base:latest
          docker tag cloudtolocalllm/base:latest ghcr.io/${{ env.REPO_LOWER }}/base:${GITHUB_SHA}
          docker tag cloudtolocalllm-build:latest ghcr.io/${{ env.REPO_LOWER }}/build:latest
          docker tag cloudtolocalllm-build:latest ghcr.io/${{ env.REPO_LOWER }}/build:${GITHUB_SHA}
          docker push ghcr.io/${{ env.REPO_LOWER }}/base:latest
          docker push ghcr.io/${{ env.REPO_LOWER }}/base:${GITHUB_SHA}
          docker push ghcr.io/${{ env.REPO_LOWER }}/build:latest
          docker push ghcr.io/${{ env.REPO_LOWER }}/build:${GITHUB_SHA}

  build_api:
    needs: build_base
    if: needs.ai_change_analysis.outputs.api_needs_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.ai_change_analysis.outputs.api_needs_build == 'true'
      - name: Build API Backend
        if: needs.ai_change_analysis.outputs.api_needs_build == 'true'
        run: |
          cd services/api-backend
          docker build -t cloudtolocalllm-api:latest --build-arg BASE_REGISTRY=ghcr.io/${{ env.REPO_LOWER }} .

      - name: Downcase Repo Name
        if: needs.ai_change_analysis.outputs.api_needs_build == 'true'
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        if: needs.ai_change_analysis.outputs.api_needs_build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API Image
        if: needs.ai_change_analysis.outputs.api_needs_build == 'true'
        run: |
          docker tag cloudtolocalllm-api:latest ghcr.io/${{ env.REPO_LOWER }}/api:latest
          docker tag cloudtolocalllm-api:latest ghcr.io/${{ env.REPO_LOWER }}/api:${GITHUB_SHA}
          docker push ghcr.io/${{ env.REPO_LOWER }}/api:latest
          docker push ghcr.io/${{ env.REPO_LOWER }}/api:${GITHUB_SHA}

  build_web:
    needs: build_base
    if: needs.ai_change_analysis.outputs.web_needs_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.ai_change_analysis.outputs.web_needs_build == 'true'
      
      - name: Setup Flutter
        if: needs.ai_change_analysis.outputs.web_needs_build == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Build Flutter Web
        if: needs.ai_change_analysis.outputs.web_needs_build == 'true'
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build web --release --no-tree-shake-icons
      
      - name: Build Web Container
        if: needs.ai_change_analysis.outputs.web_needs_build == 'true'
        run: |
          docker build -t cloudtolocalllm-web:latest --build-arg BASE_REGISTRY=ghcr.io/${{ env.REPO_LOWER }} -f config/docker/Dockerfile.web .

      - name: Downcase Repo Name
        if: needs.ai_change_analysis.outputs.web_needs_build == 'true'
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        if: needs.ai_change_analysis.outputs.web_needs_build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Web Image
        if: needs.ai_change_analysis.outputs.web_needs_build == 'true'
        run: |
          docker tag cloudtolocalllm-web:latest ghcr.io/${{ env.REPO_LOWER }}/web:latest
          docker tag cloudtolocalllm-web:latest ghcr.io/${{ env.REPO_LOWER }}/web:${GITHUB_SHA}
          docker push ghcr.io/${{ env.REPO_LOWER }}/web:latest
          docker push ghcr.io/${{ env.REPO_LOWER }}/web:${GITHUB_SHA}

  build_postgres:
    needs: build_base
    if: needs.ai_change_analysis.outputs.postgres_needs_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.ai_change_analysis.outputs.postgres_needs_build == 'true'

      - name: Downcase Repo Name
        if: needs.ai_change_analysis.outputs.postgres_needs_build == 'true'
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        if: needs.ai_change_analysis.outputs.postgres_needs_build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Postgres Service
        if: needs.ai_change_analysis.outputs.postgres_needs_build == 'true'
        run: |
          docker build -t cloudtolocalllm-postgres:latest --build-arg BASE_REGISTRY=ghcr.io/${{ env.REPO_LOWER }} -f config/docker/Dockerfile.postgres .

      - name: Push Postgres Image
        if: needs.ai_change_analysis.outputs.postgres_needs_build == 'true'
        run: |
          docker tag cloudtolocalllm-postgres:latest ghcr.io/${{ env.REPO_LOWER }}/postgres:latest
          docker tag cloudtolocalllm-postgres:latest ghcr.io/${{ env.REPO_LOWER }}/postgres:${GITHUB_SHA}
          docker push ghcr.io/${{ env.REPO_LOWER }}/postgres:latest
          docker push ghcr.io/${{ env.REPO_LOWER }}/postgres:${GITHUB_SHA}

  build_streaming:
    needs: build_base
    if: needs.ai_change_analysis.outputs.streaming_needs_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.ai_change_analysis.outputs.streaming_needs_build == 'true'
      - name: Build Streaming Proxy
        if: needs.ai_change_analysis.outputs.streaming_needs_build == 'true'
        run: |
          docker build -t cloudtolocalllm-streaming:latest --build-arg BASE_REGISTRY=ghcr.io/${{ env.REPO_LOWER }} -f config/docker/Dockerfile.streaming-proxy .

      - name: Downcase Repo Name
        if: needs.ai_change_analysis.outputs.streaming_needs_build == 'true'
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        if: needs.ai_change_analysis.outputs.streaming_needs_build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Streaming Image
        if: needs.ai_change_analysis.outputs.streaming_needs_build == 'true'
        run: |
          docker tag cloudtolocalllm-streaming:latest ghcr.io/${{ env.REPO_LOWER }}/streaming:latest
          docker tag cloudtolocalllm-streaming:latest ghcr.io/${{ env.REPO_LOWER }}/streaming:${GITHUB_SHA}
          docker push ghcr.io/${{ env.REPO_LOWER }}/streaming:latest
          docker push ghcr.io/${{ env.REPO_LOWER }}/streaming:${GITHUB_SHA}

  deploy_application:
    needs:
      [
        build_api,
        build_web,
        build_postgres,
        build_streaming,
      ]
    if: always() && needs.ai_change_analysis.outputs.components != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::422017356244:role/github-actions-role' }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.EKS_CLUSTER_NAME || 'cloudtolocalllm-eks' }} \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Create Cloudflare Tunnel Credentials Secret
        run: |
          # Use GitHub Secret directly
          TUNNEL_TOKEN="${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}"
          if [ -z "$TUNNEL_TOKEN" ]; then
             echo "Error: CLOUDFLARE_TUNNEL_TOKEN GitHub secret is not set"
             exit 1
          fi
          kubectl create secret generic tunnel-credentials \
            --from-literal=token="$TUNNEL_TOKEN" \
            --namespace=cloudtolocalllm \
            --dry-run=client -o yaml | kubectl apply -f - --validate=false

      - name: Downcase Repo Name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Deploy to Cluster (Clean & Direct)
        env:
          ENVIRONMENT: managed
          NAMESPACE: cloudtolocalllm
          WEB_IMAGE: ghcr.io/${{ env.REPO_LOWER }}/web:latest
          API_IMAGE: ghcr.io/${{ env.REPO_LOWER }}/api:latest
          STREAMING_IMAGE: ghcr.io/${{ env.REPO_LOWER }}/streaming:latest
          POSTGRES_IMAGE: ghcr.io/${{ env.REPO_LOWER }}/postgres:latest
        run: |
          echo "Generating manifests for $ENVIRONMENT..."
          
          # Setup Kustomize
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          
          # Build Manifests
          kustomize build --load-restrictor LoadRestrictionsNone k8s/deployments/overlays/$ENVIRONMENT > full-manifest.yaml
          
          # Inject Images & Config
          sed -i "s|cloudtolocalllm/web:latest|$WEB_IMAGE|g" full-manifest.yaml
          sed -i "s|cloudtolocalllm/api-backend:latest|$API_IMAGE|g" full-manifest.yaml
          sed -i "s|cloudtolocalllm/streaming-proxy:latest|$STREAMING_IMAGE|g" full-manifest.yaml
          sed -i "s|cloudtolocalllm/postgres:latest|$POSTGRES_IMAGE|g" full-manifest.yaml
          
          TUNNEL_ID="62da6c19-947b-4bf6-acad-100a73de4e0d"
          CONFIG_SHA="sha-$(date +%s)"
          sed -i "s|\${CLOUDFLARE_TUNNEL_ID}|$TUNNEL_ID|g" full-manifest.yaml
          sed -i "s|\${CLOUDFLARED_CONFIG_SHA}|$CONFIG_SHA|g" full-manifest.yaml
          
          echo "Applying manifests..."

          # Clean up stateful resources to ensure PVC resizing and resource limits
          echo "Cleaning up stateful resources..."
          # Explicitly delete postgres-auth (zombie) and others
          kubectl delete statefulset postgres postgres-auth redis-tunnel-state -n $NAMESPACE --ignore-not-found=true --wait=true
          kubectl delete deployment cloudflared api-backend web streaming-proxy -n $NAMESPACE --ignore-not-found=true --wait=true
          
          # Force delete any stuck pods to clear the node
          kubectl delete pods --all -n $NAMESPACE --force --grace-period=0 --ignore-not-found=true
          
          # Delete PVCs to allow resizing to 1Gi (User confirmed no data retention)
          kubectl delete pvc -l app=postgres -n $NAMESPACE --ignore-not-found=true
          kubectl delete pvc -l app=postgres-auth -n $NAMESPACE --ignore-not-found=true
          kubectl delete pvc -l app=redis-tunnel-state -n $NAMESPACE --ignore-not-found=true
          
          # Apply Postgres Statefully first
          kubectl apply -f full-manifest.yaml -l app=postgres -n $NAMESPACE
          
          echo "Waiting for Postgres..."
          # Increased timeout to 10m to allow image pull and initialization
          if ! kubectl rollout status statefulset/postgres -n $NAMESPACE --timeout=10m; then
            echo "❌ Postgres rollout failed! Aborting deployment."
            echo "=== POSTGRES STATUS ==="
            kubectl get statefulset postgres -n $NAMESPACE -o yaml
            kubectl describe statefulset postgres -n $NAMESPACE
            echo "=== PODS ==="
            kubectl get pods -n $NAMESPACE
            echo "=== EVENTS ==="
            kubectl get events -n $NAMESPACE --sort-by='.metadata.creationTimestamp'
            exit 1
          fi
          
          # Apply everything else
          kubectl apply -f full-manifest.yaml -n $NAMESPACE
          
          echo "Waiting for deployments to roll out..."
          kubectl rollout status deployment/web -n $NAMESPACE --timeout=10m
          kubectl rollout status deployment/api-backend -n $NAMESPACE --timeout=10m
          kubectl rollout status deployment/streaming-proxy -n $NAMESPACE --timeout=10m
          kubectl rollout status deployment/cloudflared -n $NAMESPACE --timeout=10m
          
          echo "Deployment submitted and verified."

  validate_tunnel_connectivity:
    needs: deploy_application
    if: always() && needs.ai_change_analysis.outputs.components != ''
    runs-on: ubuntu-latest
    steps:
      - name: Test Cloudflared Tunnel Endpoints
        run: |
          endpoints=(
            "https://app.cloudtolocalllm.online/health"
            "https://api.cloudtolocalllm.online/health"
            "https://argocd.cloudtolocalllm.online"
            "https://grafana.cloudtolocalllm.online"
            "https://cloudtolocalllm.online"
          )
          for endpoint in "${endpoints[@]}"; do
            echo "Testing $endpoint..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$endpoint" || echo "Failed")
            echo "Status: $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "❌ Endpoint $endpoint failed with status $STATUS"
              exit 1
            fi
          done

  debug_cluster_state:
    needs: deploy_application
    if: always() && needs.ai_change_analysis.outputs.components != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::422017356244:role/github-actions-role' }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com
      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME || 'cloudtolocalllm-eks' }} --region ${{ secrets.AWS_REGION || 'us-east-1' }}
      - name: Get Pods and Logs
        run: |
          echo "=== NODES ==="
          kubectl describe nodes
          
          echo "=== PODS ==="
          kubectl get pods -n cloudtolocalllm
          
          echo "=== WEB LOGS ==="
          kubectl logs -n cloudtolocalllm -l app=web --tail=50 --all-containers=true || true
          
          echo "=== API LOGS ==="
          kubectl logs -n cloudtolocalllm -l app=api-backend --tail=50 || true
          
          echo "=== TUNNEL LOGS ==="
          kubectl logs -n cloudtolocalllm -l app=cloudflared --tail=50 || true
          
          echo "=== NETWORK POLICIES ==="
          kubectl get networkpolicies -n cloudtolocalllm

  rollback_on_failure:
    needs: deploy_application
    if: failure() && needs.deploy_application.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::422017356244:role/github-actions-role' }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com
      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME || 'cloudtolocalllm-eks' }} --region ${{ secrets.AWS_REGION || 'us-east-1' }}
      - name: Rollback Failed Deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENTS: ${{ needs.ai_change_analysis.outputs.components }}
        run: |
          echo "Deployment failed, initiating rollback..."
          echo "Components to rollback: $COMPONENTS"

          # Parse components and rollback each
          IFS=',' read -ra COMPONENT_ARRAY <<< "$COMPONENTS"
          for component in "${COMPONENT_ARRAY[@]}"; do
            case $component in
              api)
                echo "Rolling back API backend..."
                kubectl rollout undo deployment/api-backend -n cloudtolocalllm || echo "API rollback failed"
                ;;
              web)
                echo "Rolling back Web frontend..."
                kubectl rollout undo deployment/web -n cloudtolocalllm || echo "Web rollback failed"
                ;;
              streaming)
                echo "Rolling back Streaming proxy..."
                kubectl rollout undo deployment/streaming-proxy -n cloudtolocalllm || echo "Streaming rollback failed"
                ;;
              postgres)
                echo "Rolling back Postgres..."
                kubectl rollout undo statefulset/postgres -n cloudtolocalllm || echo "Postgres rollback failed"
                ;;
            esac
          done

          echo "Rollback completed"

  cloudflared_health_check:
    needs: deploy_application
    if: always() && needs.ai_change_analysis.outputs.components != ''
    runs-on: ubuntu-latest
    steps:
      - name: Cloudflare Tunnel Health Validation
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: |
          echo "🔍 Performing comprehensive Cloudflare tunnel health check..."

          if [ -z "$CLOUDFLARE_API_KEY" ]; then
            echo "⚠️  CLOUDFLARE_API_KEY not configured - skipping Cloudflare API checks"
            exit 0
          fi

          # Account ID
          ACCOUNT_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts" \
            -H "X-Auth-Email: cmaltais@cloudtolocalllm.online" \
            -H "X-Auth-Key: $CLOUDFLARE_API_KEY" | jq -r '.result[0].id')

          if [ -z "$ACCOUNT_ID" ] || [ "$ACCOUNT_ID" == "null" ]; then
            echo "❌ Failed to retrieve Cloudflare account ID"
            exit 1
          fi

          # Tunnel Status
          TUNNEL_STATUS=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/cfd_tunnel/62da6c19-947b-4bf6-acad-100a73de4e0d" \
            -H "X-Auth-Email: cmaltais@cloudtolocalllm.online" \
            -H "X-Auth-Key: $CLOUDFLARE_API_KEY" | jq -r '.result.status')

          echo "Tunnel Status: $TUNNEL_STATUS"
          if [ "$TUNNEL_STATUS" != "healthy" ]; then
            echo "⚠️  Cloudflare tunnel is not healthy: $TUNNEL_STATUS"
            exit 0
          fi

          echo "🎉 Cloudflare tunnel health check PASSED"

  pipeline_metrics:
    needs:
      [
        ai_change_analysis,
        deploy_application,
        validate_tunnel_connectivity,
        cloudflared_health_check,
      ]
    if: always() && needs.ai_change_analysis.outputs.components != ''
    runs-on: ubuntu-latest
    steps:
      - name: Generate Pipeline Metrics
        run: |
          echo "📊 Pipeline Execution Summary"
          echo "=============================="

          orchestrator_status="${{ needs.ai_change_analysis.result }}"
          deploy_status="${{ needs.deploy_application.result }}"
          tunnel_status="${{ needs.validate_tunnel_connectivity.result }}"
          cloudflare_status="${{ needs.cloudflared_health_check.result }}"

          echo "Analysis: $orchestrator_status"
          echo "Deployment: $deploy_status"
          echo "Tunnel: $tunnel_status"
          echo "Cloudflare: $cloudflare_status"

          # Simple Success Logic
          if [ "$deploy_status" = "success" ]; then
            echo "🎉 Pipeline completed successfully!"
          else
            echo "❌ Deployment failed"
            exit 1
          fi
