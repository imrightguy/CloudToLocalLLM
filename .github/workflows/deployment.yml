name: "🚀 Deployment"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build of all containers'
        required: false
        default: false
        type: boolean
      deep_reset:
        description: 'Perform Nuclear Reset (Stop stack and prune everything)'
        required: false
        default: false
        type: boolean
  # repository_dispatch disabled to prevent redundant builds
  # repository_dispatch:
  #   types: [orchestrator-build]

env:
  GEMINI_CLI_IMAGE: kiloai/cli:latest
  GEMINI_CLI_MODEL: google/gemini-2.5-flash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  ai_change_analysis:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.analyze.outputs.components }}
      new_version: ${{ steps.analyze.outputs.new_version }}
      bump_needed: ${{ steps.analyze.outputs.bump_needed }}
      api_changed: ${{ steps.analyze.outputs.api_changed }}
      web_changed: ${{ steps.analyze.outputs.web_changed }}
      postgres_changed: ${{ steps.analyze.outputs.postgres_changed }}
      streaming_changed: ${{ steps.analyze.outputs.streaming_changed }}
      api_needs_build: ${{ steps.analyze.outputs.api_needs_build }}
      web_needs_build: ${{ steps.analyze.outputs.web_needs_build }}
      postgres_needs_build: ${{ steps.analyze.outputs.postgres_needs_build }}
      streaming_needs_build: ${{ steps.analyze.outputs.streaming_needs_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Orchestrator: Forensic Analysis"
        id: analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Executing git-based analysis of changes..."
          if [ "${{ github.event_name }}" == "push" ]; then
            DIFF_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} || git diff --name-only HEAD^ HEAD)
          else
            DIFF_FILES=$(git diff --name-only HEAD^ HEAD || git diff --name-only HEAD)
          fi

          echo "Changed files:"
          echo "$DIFF_FILES"

          COMPONENTS=""

          # Check for changes in specific paths
          if echo "$DIFF_FILES" | grep -qE "services/api-backend/|config/docker/Dockerfile.api-backend"; then COMPONENTS="$COMPONENTS,api"; fi
          if echo "$DIFF_FILES" | grep -qE "web/|build/web/|config/docker/Dockerfile.web"; then COMPONENTS="$COMPONENTS,web"; fi
          if echo "$DIFF_FILES" | grep -qE "config/docker/Dockerfile.postgres|config/docker/postgres-|config/docker/init.sql|services/postgres/"; then COMPONENTS="$COMPONENTS,postgres"; fi
          if echo "$DIFF_FILES" | grep -qE "config/docker/Dockerfile.streaming-proxy|services/streaming-proxy/"; then COMPONENTS="$COMPONENTS,streaming"; fi
 
          # Infrastructure or global changes trigger all
          if echo "$DIFF_FILES" | grep -qE "k8s/|infra/|scripts/|.github/|docker-stack.yml|assets/|package.json"; then 
            COMPONENTS="api,web,postgres,streaming,linux,windows"
            API_CHANGED="true"
            WEB_CHANGED="true"
            POSTGRES_CHANGED="true"
            STREAMING_CHANGED="true"
          fi

          # Manual Force Build Override
          if [ "${{ inputs.force_build }}" == "true" ]; then
            echo "MANUAL FORCE BUILD DETECTED"
            COMPONENTS="api,web,postgres,streaming,linux,windows"
            API_CHANGED="true"
            WEB_CHANGED="true"
            POSTGRES_CHANGED="true"
            STREAMING_CHANGED="true"
            BUMP_NEEDED="true"
          fi
 
          # Granular Change Detection
          if [ -z "$API_CHANGED" ]; then API_CHANGED="false"; fi
          if echo "$DIFF_FILES" | grep -qE "services/api-backend/|config/docker/Dockerfile.api-backend"; then API_CHANGED="true"; fi
 
          if [ -z "$WEB_CHANGED" ]; then WEB_CHANGED="false"; fi
          if echo "$DIFF_FILES" | grep -qE "web/|build/web/|config/docker/Dockerfile.web"; then WEB_CHANGED="true"; fi
 
          if [ -z "$POSTGRES_CHANGED" ]; then POSTGRES_CHANGED="false"; fi
          if echo "$DIFF_FILES" | grep -qE "config/docker/Dockerfile.postgres|config/docker/postgres-|config/docker/init.sql|services/postgres/"; then POSTGRES_CHANGED="true"; fi
 
          if [ -z "$STREAMING_CHANGED" ]; then STREAMING_CHANGED="false"; fi
          if echo "$DIFF_FILES" | grep -qE "config/docker/Dockerfile.streaming-proxy|services/streaming-proxy/"; then STREAMING_CHANGED="true"; fi


          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          REPO_NAME_LOWER="${REPO_NAME,,}"

          check_ghcr_tag() {
            local package="$1"
            local tag="$2"
            local package_path="${REPO_NAME_LOWER}/${package}"
            local encoded="${package_path//\//%2F}"

            for scope in orgs users; do
              if gh api "/${scope}/${OWNER}/packages/container/${encoded}/versions?per_page=100" > /tmp/ghcr_versions.json 2>/dev/null; then
                if jq -e --arg tag "$tag" '.[] | select(.metadata.container.tags[]? == $tag)' /tmp/ghcr_versions.json >/dev/null; then
                  return 0
                fi
                return 1
              fi
            done

            return 1
          }

          API_NEEDS_BUILD="$API_CHANGED"
          WEB_NEEDS_BUILD="$WEB_CHANGED"
          POSTGRES_NEEDS_BUILD="$POSTGRES_CHANGED"
          STREAMING_NEEDS_BUILD="$STREAMING_CHANGED"

          # Clean up leading comma
          COMPONENTS=$(echo "$COMPONENTS" | sed 's/^,//')

          # Calculate Version Bump (Simple Auto-Patch)
          if [ -n "$COMPONENTS" ] || [ "${{ inputs.force_build }}" == "true" ]; then
            BUMP="true"
            CURRENT_VERSION=$(jq -r '.version' assets/version.json || echo "0.0.0")
            # Split version into array
            IFS='.' read -r -a v <<< "$CURRENT_VERSION"
            # Increment patch
            v[2]=$((v[2] + 1))
            NEW_VERSION="${v[0]}.${v[1]}.${v[2]}"
            REASON="Automated patch bump for changed components: $COMPONENTS"
          else
            BUMP="false"
            NEW_VERSION=""
            REASON="No buildable components changed"
          fi

          echo "Orchestrator Decision: $REASON"
          echo "components=$COMPONENTS" >> $GITHUB_OUTPUT
          echo "bump_needed=$BUMP" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "api_changed=$API_CHANGED" >> $GITHUB_OUTPUT
          echo "web_changed=$WEB_CHANGED" >> $GITHUB_OUTPUT
          echo "postgres_changed=$POSTGRES_CHANGED" >> $GITHUB_OUTPUT
          echo "streaming_changed=$STREAMING_CHANGED" >> $GITHUB_OUTPUT
          echo "api_needs_build=$API_NEEDS_BUILD" >> $GITHUB_OUTPUT
          echo "web_needs_build=$WEB_NEEDS_BUILD" >> $GITHUB_OUTPUT
          echo "postgres_needs_build=$POSTGRES_NEEDS_BUILD" >> $GITHUB_OUTPUT
          echo "streaming_needs_build=$STREAMING_NEEDS_BUILD" >> $GITHUB_OUTPUT
 
      - name: "Orchestrator: Commit Version Bump"
        if: steps.analyze.outputs.bump_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.analyze.outputs.new_version }}"
          echo "Executing automated version bump to $NEW_VERSION"

          # Setup git with GH_TOKEN permissions
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Synchronize all version references across the project
          chmod +x scripts/update-all-versions.sh scripts/generate-changelog.sh
          ./scripts/update-all-versions.sh "$NEW_VERSION" "${{ github.sha }}"

          # Check if there are any changes to commit
          # (Excluding files that might have changed but aren't related to versioning)
          if git diff --quiet; then
            echo "No changes detected. Skipping commit."
          else
            # Stage all changes made by the version script
            # This includes pubspec.yaml, package.jsons, main.dart, app_config.dart, etc.
            git add .
            git commit -m "chore: automated version bump to $NEW_VERSION [skip ci]"

            # Using authenticated remote URL for the push
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
          fi

  # Pre-build testing - catch issues before building containers
  run_tests:
    needs: ai_change_analysis
    if: needs.ai_change_analysis.outputs.bump_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            services/api-backend/package-lock.json
            services/streaming-proxy/package-lock.json
      
      - name: Run API Backend Tests
        if: needs.ai_change_analysis.outputs.api_changed == 'true'
        working-directory: services/api-backend
        env:
          CI: true
        run: |
          echo "🧪 Running API Backend tests..."
          npm ci
          npm run lint || echo "⚠️ Lint warnings detected (non-blocking)"
          npm run test:unit
          echo "✅ API Backend tests passed"
      
      - name: Run Streaming Proxy Tests
        if: needs.ai_change_analysis.outputs.streaming_changed == 'true'
        working-directory: services/streaming-proxy
        run: |
          echo "🧪 Running Streaming Proxy tests..."
          npm ci
          npm run lint || echo "⚠️ Lint warnings detected (non-blocking)"
          npm test || echo "⚠️ Tests skipped or failed (non-blocking for now)"
          echo "✅ Streaming Proxy checks completed"
      
      - name: Setup Flutter
        if: needs.ai_change_analysis.outputs.web_changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Run Flutter Analyze
        if: needs.ai_change_analysis.outputs.web_changed == 'true'
        run: |
          echo "🧪 Running Flutter analyze..."
          flutter config --no-analytics
          flutter pub get
          flutter analyze --no-fatal-warnings || echo "⚠️ Analysis warnings detected (non-blocking)"
          echo "✅ Flutter analysis completed"
      
      - name: Test Summary
        run: |
          echo "🎉 Pre-build testing completed!"
          echo "   API Changed: ${{ needs.ai_change_analysis.outputs.api_changed }}"
          echo "   Web Changed: ${{ needs.ai_change_analysis.outputs.web_changed }}"
          echo "   Streaming Changed: ${{ needs.ai_change_analysis.outputs.streaming_changed }}"

  build_api:
    needs: [ai_change_analysis, run_tests]
    if: needs.ai_change_analysis.outputs.bump_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.ai_change_analysis.outputs.api_needs_build == 'true'
      - name: Build API Backend
        if: needs.ai_change_analysis.outputs.api_needs_build == 'true'
        run: |
          cd services/api-backend
          docker build -t cloudtolocalllm-api:latest .

      - name: Downcase Repo Name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API Image (Build)
        if: needs.ai_change_analysis.outputs.api_needs_build == 'true'
        run: |
          docker tag cloudtolocalllm-api:latest ghcr.io/${{ env.REPO_LOWER }}/api:latest
          docker tag cloudtolocalllm-api:latest ghcr.io/${{ env.REPO_LOWER }}/api:${GITHUB_SHA}
          docker tag cloudtolocalllm-api:latest ghcr.io/${{ env.REPO_LOWER }}/api:${{ needs.ai_change_analysis.outputs.new_version }}
          docker push ghcr.io/${{ env.REPO_LOWER }}/api:latest
          docker push ghcr.io/${{ env.REPO_LOWER }}/api:${GITHUB_SHA}
          docker push ghcr.io/${{ env.REPO_LOWER }}/api:${{ needs.ai_change_analysis.outputs.new_version }}

      - name: Retag API Image (Skip Build)
        if: needs.ai_change_analysis.outputs.api_needs_build != 'true'
        run: |
          echo "Skipping build, retagging existing latest image..."
          docker buildx imagetools create \
            ghcr.io/${{ env.REPO_LOWER }}/api:latest \
            --tag ghcr.io/${{ env.REPO_LOWER }}/api:${{ needs.ai_change_analysis.outputs.new_version }}

  build_web:
    needs: [ai_change_analysis, run_tests]
    if: needs.ai_change_analysis.outputs.bump_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.ai_change_analysis.outputs.web_needs_build == 'true'
      
      - name: Setup Flutter
        if: needs.ai_change_analysis.outputs.web_needs_build == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Build Flutter Web
        if: needs.ai_change_analysis.outputs.web_needs_build == 'true'
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build web --release --no-tree-shake-icons
      
      - name: Build Web Container
        if: needs.ai_change_analysis.outputs.web_needs_build == 'true'
        run: |
          docker build -t cloudtolocalllm-web:latest -f config/docker/Dockerfile.web .

      - name: Downcase Repo Name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Web Image (Build)
        if: needs.ai_change_analysis.outputs.web_needs_build == 'true'
        run: |
          docker tag cloudtolocalllm-web:latest ghcr.io/${{ env.REPO_LOWER }}/web:latest
          docker tag cloudtolocalllm-web:latest ghcr.io/${{ env.REPO_LOWER }}/web:${GITHUB_SHA}
          docker tag cloudtolocalllm-web:latest ghcr.io/${{ env.REPO_LOWER }}/web:${{ needs.ai_change_analysis.outputs.new_version }}
          docker push ghcr.io/${{ env.REPO_LOWER }}/web:latest
          docker push ghcr.io/${{ env.REPO_LOWER }}/web:${GITHUB_SHA}
          docker push ghcr.io/${{ env.REPO_LOWER }}/web:${{ needs.ai_change_analysis.outputs.new_version }}

      - name: Retag Web Image (Skip Build)
        if: needs.ai_change_analysis.outputs.web_needs_build != 'true'
        run: |
          echo "Skipping build, retagging existing latest image..."
          docker buildx imagetools create \
            ghcr.io/${{ env.REPO_LOWER }}/web:latest \
            --tag ghcr.io/${{ env.REPO_LOWER }}/web:${{ needs.ai_change_analysis.outputs.new_version }}

  build_postgres:
    needs: [ai_change_analysis, run_tests]
    if: needs.ai_change_analysis.outputs.bump_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.ai_change_analysis.outputs.postgres_needs_build == 'true'

      - name: Downcase Repo Name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Postgres Service
        if: needs.ai_change_analysis.outputs.postgres_needs_build == 'true'
        run: |
          docker build -t cloudtolocalllm-postgres:latest -f config/docker/Dockerfile.postgres .

      - name: Push Postgres Image (Build)
        if: needs.ai_change_analysis.outputs.postgres_needs_build == 'true'
        run: |
          docker tag cloudtolocalllm-postgres:latest ghcr.io/${{ env.REPO_LOWER }}/postgres:latest
          docker tag cloudtolocalllm-postgres:latest ghcr.io/${{ env.REPO_LOWER }}/postgres:${GITHUB_SHA}
          docker tag cloudtolocalllm-postgres:latest ghcr.io/${{ env.REPO_LOWER }}/postgres:${{ needs.ai_change_analysis.outputs.new_version }}
          docker push ghcr.io/${{ env.REPO_LOWER }}/postgres:latest
          docker push ghcr.io/${{ env.REPO_LOWER }}/postgres:${GITHUB_SHA}
          docker push ghcr.io/${{ env.REPO_LOWER }}/postgres:${{ needs.ai_change_analysis.outputs.new_version }}

      - name: Retag Postgres Image (Skip Build)
        if: needs.ai_change_analysis.outputs.postgres_needs_build != 'true'
        run: |
          echo "Skipping build, retagging existing latest image..."
          docker buildx imagetools create \
            ghcr.io/${{ env.REPO_LOWER }}/postgres:latest \
            --tag ghcr.io/${{ env.REPO_LOWER }}/postgres:${{ needs.ai_change_analysis.outputs.new_version }}

  build_streaming:
    needs: [ai_change_analysis, run_tests]
    if: needs.ai_change_analysis.outputs.bump_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.ai_change_analysis.outputs.streaming_needs_build == 'true'
      - name: Build Streaming Proxy
        if: needs.ai_change_analysis.outputs.streaming_needs_build == 'true'
        run: |
          docker build -t cloudtolocalllm-streaming:latest -f config/docker/Dockerfile.streaming-proxy .

      - name: Downcase Repo Name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Streaming Image (Build)
        if: needs.ai_change_analysis.outputs.streaming_needs_build == 'true'
        run: |
          docker tag cloudtolocalllm-streaming:latest ghcr.io/${{ env.REPO_LOWER }}/streaming:latest
          docker tag cloudtolocalllm-streaming:latest ghcr.io/${{ env.REPO_LOWER }}/streaming:${GITHUB_SHA}
          docker tag cloudtolocalllm-streaming:latest ghcr.io/${{ env.REPO_LOWER }}/streaming:${{ needs.ai_change_analysis.outputs.new_version }}
          docker push ghcr.io/${{ env.REPO_LOWER }}/streaming:latest
          docker push ghcr.io/${{ env.REPO_LOWER }}/streaming:${GITHUB_SHA}
          docker push ghcr.io/${{ env.REPO_LOWER }}/streaming:${{ needs.ai_change_analysis.outputs.new_version }}

      - name: Retag Streaming Image (Skip Build)
        if: needs.ai_change_analysis.outputs.streaming_needs_build != 'true'
        run: |
          echo "Skipping build, retagging existing latest image..."
          docker buildx imagetools create \
            ghcr.io/${{ env.REPO_LOWER }}/streaming:latest \
            --tag ghcr.io/${{ env.REPO_LOWER }}/streaming:${{ needs.ai_change_analysis.outputs.new_version }}

  deploy_application:
    needs:
      [
        ai_change_analysis,
        build_api,
        build_web,
        build_postgres,
        build_streaming,
      ]
    if: needs.ai_change_analysis.outputs.components != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Provision Azure VM
        if: needs.ai_change_analysis.outputs.components != ''
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
        run: |
          # Setup SSH keys for provisioning
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa > ~/.ssh/id_rsa.pub

          # Login using the JSON credential
          echo "$AZURE_CREDENTIALS" > azure_creds.json
          az login --service-principal \
            -u $(jq -r .clientId azure_creds.json) \
            -p $(jq -r .clientSecret azure_creds.json) \
            --tenant $(jq -r .tenantId azure_creds.json)
          rm azure_creds.json

          # Run provisioning script
          chmod +x infra/azure/create-swarm-vm.sh
          ./infra/azure/create-swarm-vm.sh

      - name: Deploy to Swarm
        if: needs.ai_change_analysis.outputs.components != ''
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
          POSTGRES_AUTH_PASSWORD: ${{ secrets.POSTGRES_AUTH_PASSWORD || 'postgres' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'default-jwt-secret' }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN || '' }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE || '' }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID || '' }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET || '' }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY || '' }}
          STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY || '' }}
          STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET || '' }}
          STRIPE_LIVE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY || '' }}
          STRIPE_LIVE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_LIVE_PUBLISHABLE_KEY || '' }}
          STRIPE_LIVE_WEBHOOK_SECRET: ${{ secrets.STRIPE_LIVE_WEBHOOK_SECRET || '' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN || '' }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          DOCKER_TAG: ${{ needs.ai_change_analysis.outputs.new_version }}
        run: |
          # Get VM IP
          IP=$(az vm show -d -g cloudtolocalllm-rg -n cloudtolocalllm-swarm --query publicIps -o tsv)
          echo "Deploying to $IP..."

          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $IP >> ~/.ssh/known_hosts

          # Generate safe env file for remote execution
          {
            vars=(
              POSTGRES_USER POSTGRES_PASSWORD POSTGRES_AUTH_PASSWORD 
              JWT_SECRET AUTH0_DOMAIN AUTH0_AUDIENCE AUTH0_CLIENT_ID 
              AUTH0_CLIENT_SECRET STRIPE_TEST_SECRET_KEY STRIPE_TEST_PUBLISHABLE_KEY 
              STRIPE_TEST_WEBHOOK_SECRET STRIPE_LIVE_SECRET_KEY STRIPE_LIVE_PUBLISHABLE_KEY 
              STRIPE_LIVE_WEBHOOK_SECRET SENTRY_DSN CLOUDFLARE_TUNNEL_TOKEN DOCKER_TAG
              GH_TOKEN GITHUB_ACTOR
            )
            for var in "${vars[@]}"; do
              printf "export %s=%q\n" "$var" "${!var}"
            done
          } > .env.remote

          # Copy Stack, Config, and Env Files
          scp -r docker-stack.yml config/ .env.remote azureuser@$IP:~/

          # Deploy via SSH
          ssh azureuser@$IP <<'EOF'
            # Load environment
            source .env.remote
            rm .env.remote

            # DEEP RESET (Manual Only): Stop stack and clear everything
            if [ "${{ inputs.deep_reset }}" == "true" ]; then
              echo "☢️ Performing Deep Reset..."
              sudo docker stack rm cloudtolocalllm || true
              echo "⏳ Waiting for cleanup..."
              sleep 20
              sudo docker system prune -af --volumes || true
            fi

            # Login to GHCR
            echo "${GH_TOKEN}" | sudo docker login ghcr.io -u ${GITHUB_ACTOR} --password-stdin
            
            # Pull latest images sequentially
            # This ensures they are local before Swarm tries to update
            sudo docker pull ghcr.io/cloudtolocalllm-online/cloudtolocalllm/api:$DOCKER_TAG
            sudo docker pull ghcr.io/cloudtolocalllm-online/cloudtolocalllm/web:$DOCKER_TAG
            sudo docker pull ghcr.io/cloudtolocalllm-online/cloudtolocalllm/streaming:$DOCKER_TAG
            sudo docker pull ghcr.io/cloudtolocalllm-online/cloudtolocalllm/postgres:$DOCKER_TAG
            sudo docker pull cloudflare/cloudflared:2024.12.2
            sudo docker pull redis:7-alpine
            
            # Standard Rolling Deploy (Zero Downtime)
            sudo -E docker stack deploy -c docker-stack.yml cloudtolocalllm --with-registry-auth
            
            # Wait for services to stabilize
            echo "Waiting for services to stabilize..."
            sleep 45
            sudo docker stack services cloudtolocalllm
            sudo docker stack ps cloudtolocalllm
            
            echo "=== LOGS: api-backend ==="
            sudo docker service logs cloudtolocalllm_api-backend --tail 50
            echo "=== LOGS: web ==="
            sudo docker service logs cloudtolocalllm_web --tail 50
            echo "=== LOGS: cloudflared ==="
            sudo docker service logs cloudtolocalllm_cloudflared --tail 50
            
            # Cleanup old images (Safe)
            sudo docker image prune -f
          EOF


  # Verify container health BEFORE running validation tests
  verify_container_health:
    needs: [ai_change_analysis, deploy_application]
    if: always() && needs.ai_change_analysis.outputs.components != '' && needs.deploy_application.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      all_healthy: ${{ steps.health_check.outputs.all_healthy }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Wait for Container Health
        id: health_check
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
        run: |
          # Login to Azure
          echo "$AZURE_CREDENTIALS" > azure_creds.json
          az login --service-principal \
            -u $(jq -r .clientId azure_creds.json) \
            -p $(jq -r .clientSecret azure_creds.json) \
            --tenant $(jq -r .tenantId azure_creds.json)
          rm azure_creds.json

          # Get VM IP
          IP=$(az vm show -d -g cloudtolocalllm-rg -n cloudtolocalllm-swarm --query publicIps -o tsv)
          
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $IP >> ~/.ssh/known_hosts 2>/dev/null

          echo "🏥 Waiting for all containers to become healthy..."
          echo "   Max wait time: 3 minutes (18 attempts @ 10s intervals)"
          echo ""
          
          # Copy and run health check script on remote VM
          scp scripts/ci/wait-for-swarm-health.sh azureuser@$IP:~/wait-for-swarm-health.sh
          
          # Run health check with sudo (Docker requires it)
          if ssh azureuser@$IP 'chmod +x ~/wait-for-swarm-health.sh && sudo MAX_ATTEMPTS=18 POLL_INTERVAL=10 ~/wait-for-swarm-health.sh'; then
            echo "all_healthy=true" >> $GITHUB_OUTPUT
            echo "✅ All containers are healthy!"
          else
            echo "all_healthy=false" >> $GITHUB_OUTPUT
            echo "❌ Container health check failed!"
            exit 1
          fi

  validate_tunnel_connectivity:
    needs: [ai_change_analysis, deploy_application, verify_container_health]
    if: always() && needs.ai_change_analysis.outputs.components != '' && needs.verify_container_health.outputs.all_healthy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Test Cloudflared Tunnel Endpoints
        run: |
          echo "🔍 Running external endpoint validation..."
          echo "   (Containers are confirmed healthy from previous job)"
          echo ""
          
          endpoints=(
            "https://cloudtolocalllm.online/health"
            "https://app.cloudtolocalllm.online/health"
            "https://api.cloudtolocalllm.online/health"
          )
          
          max_retries=6
          delay=10
          
          for endpoint in "${endpoints[@]}"; do
            echo "🔍 Checking $endpoint..."
            success=0
            for ((i=1; i<=max_retries; i++)); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -L "$endpoint" || echo "Failed")
              echo "  Attempt $i: $STATUS"
              if [[ "$STATUS" == "200" ]]; then
                echo "  ✅ $endpoint is healthy"
                success=1
                break
              fi
              echo "  ⚠️  Wait $delay seconds..."
              sleep $delay
            done
            
            if [ $success -eq 0 ]; then
              echo "❌ $endpoint failed after $max_retries attempts"
              exit 1
            fi
          done
          echo "🎉 All endpoints are healthy"

  debug_swarm_state:
    needs: [ai_change_analysis, deploy_application]
    if: always() && needs.ai_change_analysis.outputs.components != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get Swarm Status
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
        run: |
          # Login to Azure
          echo "$AZURE_CREDENTIALS" > azure_creds.json
          az login --service-principal \
            -u $(jq -r .clientId azure_creds.json) \
            -p $(jq -r .clientSecret azure_creds.json) \
            --tenant $(jq -r .tenantId azure_creds.json)
          rm azure_creds.json

          # Get VM IP
          IP=$(az vm show -d -g cloudtolocalllm-rg -n cloudtolocalllm-swarm --query publicIps -o tsv)
          
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $IP >> ~/.ssh/known_hosts 2>/dev/null

          # Get Swarm info
          ssh azureuser@$IP <<'EOF'
            echo "=== DOCKER INFO ==="
            sudo docker info | grep -E "(Swarm|Nodes|Managers)"
            
            echo ""
            echo "=== STACK SERVICES ==="
            sudo docker stack services cloudtolocalllm || echo "Stack not deployed"
            
            echo ""
            echo "=== RUNNING CONTAINERS ==="
            sudo docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
            echo ""
            echo "=== API LOGS (last 30 lines) ==="
            sudo docker service logs cloudtolocalllm_api-backend --tail 30 2>/dev/null || echo "No API logs"
            
            echo ""
            echo "=== WEB LOGS (last 30 lines) ==="
            sudo docker service logs cloudtolocalllm_web --tail 30 2>/dev/null || echo "No web logs"
            
            echo ""
            echo "=== TUNNEL LOGS (last 30 lines) ==="
            sudo docker service logs cloudtolocalllm_cloudflared --tail 30 2>/dev/null || echo "No tunnel logs"
          EOF

  rollback_on_failure:
    needs: deploy_application
    if: failure() && needs.deploy_application.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rollback Swarm Deployment
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
        run: |
          echo "Deployment failed, initiating rollback..."
          
          # Login to Azure
          echo "$AZURE_CREDENTIALS" > azure_creds.json
          az login --service-principal \
            -u $(jq -r .clientId azure_creds.json) \
            -p $(jq -r .clientSecret azure_creds.json) \
            --tenant $(jq -r .tenantId azure_creds.json)
          rm azure_creds.json

          # Get VM IP
          IP=$(az vm show -d -g cloudtolocalllm-rg -n cloudtolocalllm-swarm --query publicIps -o tsv)
          
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $IP >> ~/.ssh/known_hosts 2>/dev/null

          # Rollback services via SSH
          ssh azureuser@$IP <<'EOF'
            echo "Rolling back Docker Swarm services..."
            
            # Docker Swarm has built-in rollback for services
            sudo docker service update --rollback cloudtolocalllm_api-backend || echo "API rollback failed or no previous version"
            sudo docker service update --rollback cloudtolocalllm_web || echo "Web rollback failed or no previous version"
            sudo docker service update --rollback cloudtolocalllm_streaming-proxy || echo "Streaming rollback failed or no previous version"
            
            echo "Rollback completed"
            sudo docker stack services cloudtolocalllm
          EOF

  cloudflared_health_check:
    needs: [ai_change_analysis, deploy_application]
    if: always() && needs.ai_change_analysis.outputs.components != ''
    runs-on: ubuntu-latest
    steps:
      - name: Cloudflare Tunnel Health Validation
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: |
          echo "🔍 Performing comprehensive Cloudflare tunnel health check..."

          if [ -z "$CLOUDFLARE_API_KEY" ]; then
            echo "⚠️  CLOUDFLARE_API_KEY not configured - skipping Cloudflare API checks"
            exit 0
          fi

          # Account ID
          ACCOUNT_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts" \
            -H "X-Auth-Email: cmaltais@cloudtolocalllm.online" \
            -H "X-Auth-Key: $CLOUDFLARE_API_KEY" | jq -r '.result[0].id')

          if [ -z "$ACCOUNT_ID" ] || [ "$ACCOUNT_ID" == "null" ]; then
            echo "❌ Failed to retrieve Cloudflare account ID"
            exit 1
          fi

          # Tunnel Status
          TUNNEL_STATUS=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/cfd_tunnel/62da6c19-947b-4bf6-acad-100a73de4e0d" \
            -H "X-Auth-Email: cmaltais@cloudtolocalllm.online" \
            -H "X-Auth-Key: $CLOUDFLARE_API_KEY" | jq -r '.result.status')

          echo "Tunnel Status: $TUNNEL_STATUS"
          if [ "$TUNNEL_STATUS" != "healthy" ]; then
            echo "⚠️  Cloudflare tunnel is not healthy: $TUNNEL_STATUS"
            exit 0
          fi

          echo "🎉 Cloudflare tunnel health check PASSED"

  pipeline_metrics:
    needs:
      [
        ai_change_analysis,
        deploy_application,
        verify_container_health,
        validate_tunnel_connectivity,
        cloudflared_health_check,
      ]
    if: always() && needs.ai_change_analysis.outputs.components != ''
    runs-on: ubuntu-latest
    steps:
      - name: Generate Pipeline Metrics
        run: |
          echo "📊 Pipeline Execution Summary"
          echo "=============================="

          orchestrator_status="${{ needs.ai_change_analysis.result }}"
          deploy_status="${{ needs.deploy_application.result }}"
          health_status="${{ needs.verify_container_health.result }}"
          tunnel_status="${{ needs.validate_tunnel_connectivity.result }}"
          cloudflare_status="${{ needs.cloudflared_health_check.result }}"

          echo "Analysis: $orchestrator_status"
          echo "Deployment: $deploy_status"
          echo "Container Health: $health_status"
          echo "Tunnel Validation: $tunnel_status"
          echo "Cloudflare: $cloudflare_status"

          # Success requires deploy + health checks to pass
          if [ "$deploy_status" = "success" ] && [ "$health_status" = "success" ]; then
            echo "🎉 Pipeline completed successfully!"
          else
            echo "❌ Pipeline failed"
            echo "   Deploy: $deploy_status"
            echo "   Health: $health_status"
            exit 1
          fi
