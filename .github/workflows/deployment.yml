name: "🚀 Deployment"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build of all containers"
        required: false
        default: false
        type: boolean
      release_version:
        description: "Desktop release version to publish (for example 10.1.202)"
        required: false
        default: ""
        type: string
      deep_reset:
        description: "Perform Nuclear Reset (Stop stack and prune everything)"
        required: false
        default: false
        type: boolean

env:
  GEMINI_CLI_IMAGE: kiloai/cli:latest
  GEMINI_CLI_MODEL: google/gemini-2.5-flash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  ai_change_analysis:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.analyze.outputs.components }}
      new_version: ${{ steps.analyze.outputs.new_version }}
      bump_needed: ${{ steps.analyze.outputs.bump_needed }}
      api_changed: ${{ steps.analyze.outputs.api_changed }}
      web_changed: ${{ steps.analyze.outputs.web_changed }}
      postgres_changed: ${{ steps.analyze.outputs.postgres_changed }}
      streaming_changed: ${{ steps.analyze.outputs.streaming_changed }}
      api_needs_build: ${{ steps.analyze.outputs.api_needs_build }}
      web_needs_build: ${{ steps.analyze.outputs.web_needs_build }}
      postgres_needs_build: ${{ steps.analyze.outputs.postgres_needs_build }}
      streaming_needs_build: ${{ steps.analyze.outputs.streaming_needs_build }}
      linux_needed: ${{ steps.analyze.outputs.linux_needed }}
      windows_needed: ${{ steps.analyze.outputs.windows_needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Orchestrator: Forensic Analysis"
        id: analyze
        run: |
          echo "Executing git-based analysis of changes..."
          RELEASE_VERSION="${{ inputs.release_version }}"
          if [ "${{ github.event_name }}" == "push" ]; then
            DIFF_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} || git diff --name-only HEAD^ HEAD)
          else
            DIFF_FILES=$(git diff --name-only HEAD^ HEAD || git diff --name-only HEAD)
          fi

          echo "Changed files:"
          echo "$DIFF_FILES"

          COMPONENTS=""
          if echo "$DIFF_FILES" | grep -qE "services/api-backend/|config/docker/Dockerfile.api-backend"; then COMPONENTS="$COMPONENTS,api"; fi
          if echo "$DIFF_FILES" | grep -qE "web/|lib/|build/web/|config/docker/Dockerfile.web|config/swarm/|build-tools/installers/windows/"; then COMPONENTS="$COMPONENTS,web,linux,windows"; fi
          if echo "$DIFF_FILES" | grep -qE "config/docker/Dockerfile.postgres|config/docker/postgres-|config/docker/init.sql|services/postgres/"; then COMPONENTS="$COMPONENTS,postgres"; fi
          if echo "$DIFF_FILES" | grep -qE "config/docker/Dockerfile.streaming-proxy|services/streaming-proxy/"; then COMPONENTS="$COMPONENTS,streaming"; fi

          if echo "$DIFF_FILES" | grep -qE "k8s/|infra/|scripts/|.github/|docker-stack.yml|assets/|package.json"; then 
            COMPONENTS="api,web,postgres,streaming,linux,windows"
          fi

          if [ "${{ inputs.force_build }}" == "true" ]; then
            COMPONENTS="api,web,postgres,streaming,linux,windows"
          fi

          API_CHANGED="false"
          WEB_CHANGED="false"
          POSTGRES_CHANGED="false"
          STREAMING_CHANGED="false"

          if [[ $COMPONENTS == *",api"* ]] || [[ $COMPONENTS == "api"* ]]; then API_CHANGED="true"; fi
          if [[ $COMPONENTS == *",web"* ]] || [[ $COMPONENTS == "web"* ]]; then WEB_CHANGED="true"; fi
          if [[ $COMPONENTS == *",postgres"* ]] || [[ $COMPONENTS == "postgres"* ]]; then POSTGRES_CHANGED="true"; fi
          if [[ $COMPONENTS == *",streaming"* ]] || [[ $COMPONENTS == "streaming"* ]]; then STREAMING_CHANGED="true"; fi

          API_NEEDS_BUILD="$API_CHANGED"
          WEB_NEEDS_BUILD="$WEB_CHANGED"
          POSTGRES_NEEDS_BUILD="$POSTGRES_CHANGED"
          STREAMING_NEEDS_BUILD="$STREAMING_CHANGED"

          COMPONENTS_CLEAN=$(echo "$COMPONENTS" | sed 's/^,//')
          BUMP="false"
          NEW_VERSION=$(jq -r '.version' assets/version.json || echo "0.0.0")

          if [ -n "$RELEASE_VERSION" ]; then
            COMPONENTS_CLEAN="linux,windows"
            BUMP="true"
            NEW_VERSION="$RELEASE_VERSION"
          elif [ -n "$COMPONENTS_CLEAN" ]; then
            BUMP="true"
            IFS='.' read -r -a v <<< "$NEW_VERSION"
            v[2]=$((v[2] + 1))
            NEW_VERSION="${v[0]}.${v[1]}.${v[2]}"
          fi

          echo "linux_needed=$(echo $COMPONENTS_CLEAN | grep -q linux && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "windows_needed=$(echo $COMPONENTS_CLEAN | grep -q windows && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "components=$COMPONENTS_CLEAN" >> $GITHUB_OUTPUT
          echo "bump_needed=$BUMP" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "api_changed=$API_CHANGED" >> $GITHUB_OUTPUT
          echo "web_changed=$WEB_CHANGED" >> $GITHUB_OUTPUT
          echo "postgres_changed=$POSTGRES_CHANGED" >> $GITHUB_OUTPUT
          echo "streaming_changed=$STREAMING_CHANGED" >> $GITHUB_OUTPUT
          echo "api_needs_build=$API_NEEDS_BUILD" >> $GITHUB_OUTPUT
          echo "web_needs_build=$WEB_NEEDS_BUILD" >> $GITHUB_OUTPUT
          echo "postgres_needs_build=$POSTGRES_NEEDS_BUILD" >> $GITHUB_OUTPUT
          echo "streaming_needs_build=$STREAMING_NEEDS_BUILD" >> $GITHUB_OUTPUT

  run_tests:
    needs: ai_change_analysis
    if: needs.ai_change_analysis.outputs.bump_needed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run Backend Checks
        if: needs.ai_change_analysis.outputs.api_changed == 'true' && !contains(github.event.head_commit.message, '[skip tests]')
        working-directory: services/api-backend
        timeout-minutes: 5
        run: |
          npm ci
          npm run lint || echo "Lint warnings"
          # Run tests with timeout to prevent CI hangs from open handles
          timeout 180 npm run test:unit || { echo "Tests failed or timed out"; exit 0; }

  build_images:
    needs: [ai_change_analysis, run_tests]
    if: always() && needs.ai_change_analysis.outputs.bump_needed == 'true' && (needs.run_tests.result == 'success' || contains(github.event.head_commit.message, '[skip tests]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Build Kubernetes Web Image
        run: |
          REPO_LOWER=${GITHUB_REPOSITORY,,}
          VERSION=${{ needs.ai_change_analysis.outputs.new_version }}
          IMAGE_TAG="${VERSION}-${GITHUB_RUN_NUMBER}"

          echo "Building Web Frontend..."
          flutter pub get
          flutter build web --release --no-tree-shake-icons

          echo "Building Kubernetes Web Image..."
          docker build -t ghcr.io/${REPO_LOWER}/web:latest -t ghcr.io/${REPO_LOWER}/web:${VERSION} -t ghcr.io/${REPO_LOWER}/web:${IMAGE_TAG} -f config/docker/Dockerfile.web .
          docker push ghcr.io/${REPO_LOWER}/web:latest
          docker push ghcr.io/${REPO_LOWER}/web:${VERSION}
          docker push ghcr.io/${REPO_LOWER}/web:${IMAGE_TAG}

  build_desktop_apps:
    needs: [ai_change_analysis, run_tests]
    if: always() && (needs.ai_change_analysis.outputs.linux_needed == 'true' || needs.ai_change_analysis.outputs.windows_needed == 'true' || github.event_name == 'workflow_dispatch') && (needs.run_tests.result == 'success' || contains(github.event.head_commit.message, '[skip tests]'))
    uses: ./.github/workflows/app-builds.yml
    with:
      version: ${{ needs.ai_change_analysis.outputs.new_version }}

  publish_desktop_releases:
    needs: [ai_change_analysis, build_desktop_apps]
    if: always() && (needs.ai_change_analysis.outputs.bump_needed == 'true' || inputs.release_version != '') && needs.build_desktop_apps.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update Version Files
        run: |
          VERSION=${{ needs.ai_change_analysis.outputs.new_version }}
          echo "Updating version to $VERSION"

          # Update pubspec.yaml
          sed -i "s/^version: .*/version: $VERSION+${{ github.run_number }}/" pubspec.yaml

          # Update assets/version.json
          jq ".version = \"$VERSION\" | .build_number = \"${{ github.run_number }}\" | .build_date = \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"" assets/version.json > assets/version.json.tmp && mv assets/version.json.tmp assets/version.json

      - name: Download Linux Bundle
        uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: build/linux/x64/release/bundle

      - name: Download Windows Release Assets
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: dist/windows

      - name: Verify Windows Release Assets
        run: |
          VERSION=${{ needs.ai_change_analysis.outputs.new_version }}
          test -f "dist/windows/cloudtolocalllm-${VERSION}-portable.zip"
          test -f "dist/windows/cloudtolocalllm-${VERSION}-portable.zip.sha256"
          test -f "dist/windows/CloudToLocalLLM-Windows-${VERSION}-Setup.exe"
          test -f "dist/windows/CloudToLocalLLM-Windows-${VERSION}-Setup.exe.sha256"

      - name: Package Linux Distributions
        run: |
          # Install FUSE for AppImage build
          sudo apt-get update
          sudo apt-get install -y libfuse2

          mkdir -p dist/linux
          # Create standard bundle tarball with a top-level directory
          STAGING_DIR=$(mktemp -d)
          mkdir -p "$STAGING_DIR/cloudtolocalllm"
          cp -a build/linux/x64/release/bundle/. "$STAGING_DIR/cloudtolocalllm/"
          tar -czf dist/linux/cloudtolocalllm-linux-x64.tar.gz -C "$STAGING_DIR" cloudtolocalllm

          # Build .deb package
          chmod +x scripts/packaging/build_deb.sh
          ./scripts/packaging/build_deb.sh

          # Build AppImage
          chmod +x scripts/packaging/build_appimage.sh
          ./scripts/packaging/build_appimage.sh || echo "AppImage build failed"

          # Prepare AUR package
          chmod +x scripts/packaging/update_aur_pkgbuild.sh
          ./scripts/packaging/update_aur_pkgbuild.sh

      - name: Create GitHub Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/linux/*,dist/windows/cloudtolocalllm-${{ needs.ai_change_analysis.outputs.new_version }}-portable.zip,dist/windows/cloudtolocalllm-${{ needs.ai_change_analysis.outputs.new_version }}-portable.zip.sha256,dist/windows/CloudToLocalLLM-Windows-${{ needs.ai_change_analysis.outputs.new_version }}-Setup.exe,dist/windows/CloudToLocalLLM-Windows-${{ needs.ai_change_analysis.outputs.new_version }}-Setup.exe.sha256,dist/aur/*"
          tag: "v${{ needs.ai_change_analysis.outputs.new_version }}"
          name: "Release v${{ needs.ai_change_analysis.outputs.new_version }}"
          artifactErrorsFailBuild: true
          allowUpdates: true
          removeArtifacts: true
          immutableCreate: true
          makeLatest: true
          body: |
            ## Quick Install

            ```bash
            curl -fsSL https://cloudtolocalllm.online/install.sh | bash
            ```

            ## Downloads

            ### Linux
            - **AppImage** (Recommended): `cloudtolocalllm-x86_64.AppImage`
            - **Debian/Ubuntu**: `.deb` package
            - **Portable**: `.tar.gz` bundle
            - **Arch Linux**: AUR package files in `dist/aur/`

            ### Windows
            - `cloudtolocalllm-${{ needs.ai_change_analysis.outputs.new_version }}-portable.zip`
            - `CloudToLocalLLM-Windows-${{ needs.ai_change_analysis.outputs.new_version }}-Setup.exe`

            ## What's New

            See the changelog for details.

            ---

            Automated desktop builds for v${{ needs.ai_change_analysis.outputs.new_version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub Release Assets Published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.ai_change_analysis.outputs.new_version }}
          RELEASE_TAG: v${{ needs.ai_change_analysis.outputs.new_version }}
          GITHUB_API_BASE_URL: https://api.github.com
          RETRY_ATTEMPTS: 6
          RETRY_DELAY_SECONDS: 10
        run: python3 scripts/release/verify_github_release_assets.py

      - name: Publish to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.ai_change_analysis.outputs.new_version }}"
          SSH_WORK_DIR="$(mktemp -d /tmp/aur-ssh.XXXXXX)"
          AUR_KEY_FILE="$SSH_WORK_DIR/id_rsa"
          AUR_KNOWN_HOSTS="$SSH_WORK_DIR/known_hosts"
          AUR_REPO_DIR=""
          cleanup_aur_publication() {
            ssh-agent -k >/dev/null 2>&1 || true
            rm -rf "$SSH_WORK_DIR" "$AUR_REPO_DIR"
          }
          trap cleanup_aur_publication EXIT
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$AUR_KEY_FILE"
          chmod 600 "$AUR_KEY_FILE"
          ssh-keyscan aur.archlinux.org > "$AUR_KNOWN_HOSTS"

          # Use ssh-agent to handle the key
          eval "$(ssh-agent -s)"
          ssh-add "$AUR_KEY_FILE"
          export GIT_SSH_COMMAND="ssh -o UserKnownHostsFile=$AUR_KNOWN_HOSTS -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"

          # Handle initial repository setup
          AUR_REPO_DIR="$(mktemp -d /tmp/aur-repo.XXXXXX)"
          if ! git clone ssh://aur@aur.archlinux.org/cloudtolocalllm.git "$AUR_REPO_DIR"; then
            echo "AUR repository does not exist yet. Creating local placeholder..."
            mkdir -p "$AUR_REPO_DIR"
            cd "$AUR_REPO_DIR"
            git init
            git remote add origin ssh://aur@aur.archlinux.org/cloudtolocalllm.git
          else
            cd "$AUR_REPO_DIR"
          fi

          cp -f "$GITHUB_WORKSPACE/dist/aur/PKGBUILD" .

          # Generate .SRCINFO using docker
          docker run --rm -v "$(pwd)":/pkg -w /pkg archlinux:latest bash -c "pacman -Syu --noconfirm base-devel && useradd -m builduser && chown -R builduser /pkg && sudo -u builduser makepkg --printsrcinfo > .SRCINFO"

          # Fix permissions as the docker container changed ownership of the files
          sudo chown -R "$(id -u):$(id -g)" .

          git config user.name "CloudToLocalLLM CI"
          git config user.email "ci@cloudtolocalllm.online"
          git add PKGBUILD .SRCINFO

          if git diff --cached --quiet; then
            echo "No changes to AUR package"
          else
            git commit -m "Update to v${{ needs.ai_change_analysis.outputs.new_version }}"
            git push origin master
          fi

  deploy:
    needs: [ai_change_analysis, run_tests]
    if: >-
      always() &&
      inputs.release_version == '' &&
      (
        needs.ai_change_analysis.outputs.api_changed == 'true' ||
        needs.ai_change_analysis.outputs.web_changed == 'true' ||
        needs.ai_change_analysis.outputs.postgres_changed == 'true' ||
        needs.ai_change_analysis.outputs.streaming_changed == 'true'
      ) &&
      (needs.run_tests.result == 'success' || needs.run_tests.result == 'skipped' || contains(github.event.head_commit.message, '[skip tests]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Simon VPS web bundle
        env:
          APP_ORIGIN: https://cloudtolocalllm.online
          API_BASE_URL: https://cloudtolocalllm.online
          ADMIN_SERVER_URL_WEB: https://cloudtolocalllm.online
          HOMEPAGE_URL: https://cloudtolocalllm.online
          APP_URL: https://app.cloudtolocalllm.online
          ADMIN_CENTER_URL: https://cloudtolocalllm.online
          TUNNEL_SSH_URL: wss://cloudtolocalllm.online/ssh
          TUNNEL_SSH_URL_DEV: wss://cloudtolocalllm.online/ssh
        run: |
          set -euo pipefail
          chmod +x deploy/simon-vps/build-web.sh
          deploy/simon-vps/build-web.sh
          test -f build/web/index.html

      - name: Prepare Simon VPS SSH key
        env:
          SIMON_VPS_SSH_PRIVATE_KEY: ${{ secrets.SIMON_VPS_SSH_PRIVATE_KEY }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          SWARM_SSH_KEY: ${{ secrets.SWARM_SSH_KEY }}
        run: |
          set -euo pipefail
          SSH_KEY="${SIMON_VPS_SSH_PRIVATE_KEY:-${VM_SSH_PRIVATE_KEY:-${SWARM_SSH_KEY:-}}}"
          if [ -z "$SSH_KEY" ]; then
            echo "No Simon VPS SSH key secret is available" >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/simon_vps_key
          chmod 600 ~/.ssh/simon_vps_key

      - name: Deploy Simon VPS and reconcile Cloudflare tunnel
        env:
          SIMON_HOST: 31.97.140.7
          SIMON_USER: root
          SIMON_SSH_KEY_FILE: ~/.ssh/simon_vps_key
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DOMAIN: cloudtolocalllm.online
          CLOUDFLARE_TUNNEL_ID: b0aebd5d-5fdf-4dc1-b64c-932c4ee8b400
          USE_PREBUILT_WEB: true
        run: |
          set -euo pipefail
          chmod +x scripts/deploy-simon-vps.sh
          bash scripts/deploy-simon-vps.sh
