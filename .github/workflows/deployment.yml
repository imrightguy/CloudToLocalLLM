name: "🚀 Deployment"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build of all containers'
        required: false
        default: false
        type: boolean
      deep_reset:
        description: 'Perform Nuclear Reset (Stop stack and prune everything)'
        required: false
        default: false
        type: boolean

env:
  GEMINI_CLI_IMAGE: kiloai/cli:latest
  GEMINI_CLI_MODEL: google/gemini-2.5-flash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  ai_change_analysis:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.analyze.outputs.components }}
      new_version: ${{ steps.analyze.outputs.new_version }}
      bump_needed: ${{ steps.analyze.outputs.bump_needed }}
      api_changed: ${{ steps.analyze.outputs.api_changed }}
      web_changed: ${{ steps.analyze.outputs.web_changed }}
      postgres_changed: ${{ steps.analyze.outputs.postgres_changed }}
      streaming_changed: ${{ steps.analyze.outputs.streaming_changed }}
      api_needs_build: ${{ steps.analyze.outputs.api_needs_build }}
      web_needs_build: ${{ steps.analyze.outputs.web_needs_build }}
      postgres_needs_build: ${{ steps.analyze.outputs.postgres_needs_build }}
      streaming_needs_build: ${{ steps.analyze.outputs.streaming_needs_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Orchestrator: Forensic Analysis"
        id: analyze
        run: |
          echo "Executing git-based analysis of changes..."
          if [ "${{ github.event_name }}" == "push" ]; then
            DIFF_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} || git diff --name-only HEAD^ HEAD)
          else
            DIFF_FILES=$(git diff --name-only HEAD^ HEAD || git diff --name-only HEAD)
          fi

          COMPONENTS=""
          if echo "$DIFF_FILES" | grep -qE "services/api-backend/|config/docker/Dockerfile.api-backend"; then COMPONENTS="$COMPONENTS,api"; fi
          if echo "$DIFF_FILES" | grep -qE "web/|build/web/|config/docker/Dockerfile.web"; then COMPONENTS="$COMPONENTS,web"; fi
          if echo "$DIFF_FILES" | grep -qE "config/docker/Dockerfile.postgres|config/docker/postgres-|config/docker/init.sql|services/postgres/"; then COMPONENTS="$COMPONENTS,postgres"; fi
          if echo "$DIFF_FILES" | grep -qE "config/docker/Dockerfile.streaming-proxy|services/streaming-proxy/"; then COMPONENTS="$COMPONENTS,streaming"; fi
 
          if echo "$DIFF_FILES" | grep -qE "k8s/|infra/|scripts/|.github/|docker-stack.yml|assets/|package.json"; then 
            COMPONENTS="api,web,postgres,streaming,linux,windows"
          fi

          if [ "${{ inputs.force_build }}" == "true" ]; then
            COMPONENTS="api,web,postgres,streaming,linux,windows"
          fi
 
          API_CHANGED="false"
          WEB_CHANGED="false"
          POSTGRES_CHANGED="false"
          STREAMING_CHANGED="false"

          if [[ $COMPONENTS == *",api"* ]] || [[ $COMPONENTS == "api"* ]]; then API_CHANGED="true"; fi
          if [[ $COMPONENTS == *",web"* ]] || [[ $COMPONENTS == "web"* ]]; then WEB_CHANGED="true"; fi
          if [[ $COMPONENTS == *",postgres"* ]] || [[ $COMPONENTS == "postgres"* ]]; then POSTGRES_CHANGED="true"; fi
          if [[ $COMPONENTS == *",streaming"* ]] || [[ $COMPONENTS == "streaming"* ]]; then STREAMING_CHANGED="true"; fi

          API_NEEDS_BUILD="$API_CHANGED"
          WEB_NEEDS_BUILD="$WEB_CHANGED"
          POSTGRES_NEEDS_BUILD="$POSTGRES_CHANGED"
          STREAMING_NEEDS_BUILD="$STREAMING_CHANGED"

          COMPONENTS_CLEAN=$(echo "$COMPONENTS" | sed 's/^,//')
          BUMP="false"
          NEW_VERSION=$(jq -r '.version' assets/version.json || echo "0.0.0")
          if [ -n "$COMPONENTS_CLEAN" ]; then
            BUMP="true"
            IFS='.' read -r -a v <<< "$NEW_VERSION"
            v[2]=$((v[2] + 1))
            NEW_VERSION="${v[0]}.${v[1]}.${v[2]}"
          fi

          echo "components=$COMPONENTS_CLEAN" >> $GITHUB_OUTPUT
          echo "bump_needed=$BUMP" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "api_changed=$API_CHANGED" >> $GITHUB_OUTPUT
          echo "web_changed=$WEB_CHANGED" >> $GITHUB_OUTPUT
          echo "postgres_changed=$POSTGRES_CHANGED" >> $GITHUB_OUTPUT
          echo "streaming_changed=$STREAMING_CHANGED" >> $GITHUB_OUTPUT
          echo "api_needs_build=$API_NEEDS_BUILD" >> $GITHUB_OUTPUT
          echo "web_needs_build=$WEB_NEEDS_BUILD" >> $GITHUB_OUTPUT
          echo "postgres_needs_build=$POSTGRES_NEEDS_BUILD" >> $GITHUB_OUTPUT
          echo "streaming_needs_build=$STREAMING_NEEDS_BUILD" >> $GITHUB_OUTPUT

  run_tests:
    needs: ai_change_analysis
    if: needs.ai_change_analysis.outputs.bump_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Backend Checks
        if: needs.ai_change_analysis.outputs.api_changed == 'true' && !contains(github.event.head_commit.message, '[skip tests]')
        working-directory: services/api-backend
        run: |
          npm ci
          npm run lint || echo "Lint warnings"
          npm run test:unit || echo "Tests failed"

  build_api:
    needs: [ai_change_analysis, run_tests]
    if: needs.ai_change_analysis.outputs.api_needs_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push API
        run: |
          REPO_LOWER=${GITHUB_REPOSITORY,,}
          VERSION=${{ needs.ai_change_analysis.outputs.new_version }}
          docker build -t ghcr.io/${REPO_LOWER}/api:latest -t ghcr.io/${REPO_LOWER}/api:${VERSION} services/api-backend
          docker push ghcr.io/${REPO_LOWER}/api:latest
          docker push ghcr.io/${REPO_LOWER}/api:${VERSION}

  build_web:
    needs: [ai_change_analysis, run_tests]
    if: needs.ai_change_analysis.outputs.web_needs_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build Flutter Web
        run: |
          flutter pub get
          flutter build web --release --no-tree-shake-icons
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Web
        run: |
          REPO_LOWER=${GITHUB_REPOSITORY,,}
          VERSION=${{ needs.ai_change_analysis.outputs.new_version }}
          docker build -t ghcr.io/${REPO_LOWER}/web:latest -t ghcr.io/${REPO_LOWER}/web:${VERSION} -f config/docker/Dockerfile.web .
          docker push ghcr.io/${REPO_LOWER}/web:latest
          docker push ghcr.io/${REPO_LOWER}/web:${VERSION}

  build_postgres:
    needs: [ai_change_analysis, run_tests]
    if: needs.ai_change_analysis.outputs.postgres_needs_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Postgres
        run: |
          REPO_LOWER=${GITHUB_REPOSITORY,,}
          VERSION=${{ needs.ai_change_analysis.outputs.new_version }}
          docker build -t ghcr.io/${REPO_LOWER}/postgres:latest -t ghcr.io/${REPO_LOWER}/postgres:${VERSION} -f config/docker/Dockerfile.postgres .
          docker push ghcr.io/${REPO_LOWER}/postgres:latest
          docker push ghcr.io/${REPO_LOWER}/postgres:${VERSION}

  build_streaming:
    needs: [ai_change_analysis, run_tests]
    if: needs.ai_change_analysis.outputs.streaming_needs_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Streaming
        run: |
          REPO_LOWER=${GITHUB_REPOSITORY,,}
          VERSION=${{ needs.ai_change_analysis.outputs.new_version }}
          docker build -t ghcr.io/${REPO_LOWER}/streaming:latest -t ghcr.io/${REPO_LOWER}/streaming:${VERSION} -f config/docker/Dockerfile.streaming-proxy .
          docker push ghcr.io/${REPO_LOWER}/streaming:latest
          docker push ghcr.io/${REPO_LOWER}/streaming:${VERSION}

  deploy:
    needs: [ai_change_analysis, build_api, build_web, build_postgres, build_streaming]
    if: always() && needs.ai_change_analysis.outputs.components != '' && 
        (needs.build_api.result == 'success' || needs.build_api.result == 'skipped') &&
        (needs.build_web.result == 'success' || needs.build_web.result == 'skipped') &&
        (needs.build_postgres.result == 'success' || needs.build_postgres.result == 'skipped') &&
        (needs.build_streaming.result == 'success' || needs.build_streaming.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          echo "$AZURE_CREDENTIALS" > azure_creds.json
          az login --service-principal -u $(jq -r .clientId azure_creds.json) -p $(jq -r .clientSecret azure_creds.json) --tenant $(jq -r .tenantId azure_creds.json)
          rm azure_creds.json
      
      - name: VM Deploy
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'secret' }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          DOCKER_TAG: ${{ needs.ai_change_analysis.outputs.new_version }}
        run: |
          # Robust VM lookup
          VM_ID=$(az vm list --query "[?contains(name, 'swarm')].id" -o tsv | head -n 1)
          if [ -z "$VM_ID" ]; then
            echo "❌ No Swarm VM found"
            exit 1
          fi
          
          RG_NAME=$(az vm show --ids $VM_ID --query resourceGroup -o tsv)
          VM_NAME=$(az vm show --ids $VM_ID --query name -o tsv)
          
          echo "✅ Target: $VM_NAME in $RG_NAME"
          az vm start --ids $VM_ID
          
          # Create deployment script
          printf "set -e\nmkdir -p ~/deploy\ncd ~/deploy\nexport DOCKER_TAG=\"\$1\"\nexport POSTGRES_USER=\"\$2\"\nexport POSTGRES_PASSWORD=\"\$3\"\nexport JWT_SECRET=\"\$4\"\nexport CLOUDFLARE_TUNNEL_TOKEN=\"\$5\"\nif [ ! -d \".git\" ]; then git clone https://github.com/${{ github.repository }}.git .; else git fetch origin main && git reset --hard origin/main; fi\necho \"\$6\" | docker login ghcr.io -u github-actions --password-stdin\ndocker stack deploy -c docker-stack.yml cloudtolocalllm --with-registry-auth\n" > ds.sh
          
          az vm run-command invoke --resource-group "$RG_NAME" --name "$VM_NAME" --command-id RunBashScript --scripts @ds.sh --parameters "$DOCKER_TAG" "$POSTGRES_USER" "$POSTGRES_PASSWORD" "$JWT_SECRET" "$CLOUDFLARE_TUNNEL_TOKEN" "${{ secrets.GITHUB_TOKEN }}"
