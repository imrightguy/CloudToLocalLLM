name: AUR Push

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish to AUR'
        required: true
        default: '10.1.200'

jobs:
  aur-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan aur.archlinux.org > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Configure git
        run: |
          git config --global user.email 'ci@cloudtolocalllm.online'
          git config --global user.name 'CloudToLocalLLM CI'

      - name: Prepare PKGBUILD from published release
        run: |
          set -euo pipefail
          VERSION='${{ inputs.version }}'
          APPIMAGE_NAME="cloudtolocalllm-${VERSION}-x86_64.AppImage"
          curl -fsSL -o /tmp/${APPIMAGE_NAME}.sha256 "https://github.com/CloudToLocalLLM-online/CloudToLocalLLM/releases/download/v${VERSION}/${APPIMAGE_NAME}.sha256"
          CHECKSUM=$(awk '{print $1}' /tmp/${APPIMAGE_NAME}.sha256)
          AUR_VERSION_OVERRIDE="$VERSION" AUR_APPIMAGE_SHA256="$CHECKSUM" ./scripts/packaging/update_aur_pkgbuild.sh

      - name: Push to AUR
        run: |
          set -euo pipefail
          rm -rf /tmp/aur-repo
          git clone ssh://aur@aur.archlinux.org/cloudtolocalllm.git /tmp/aur-repo
          cd /tmp/aur-repo
          cp "$GITHUB_WORKSPACE/dist/aur/PKGBUILD" .
          cp "$GITHUB_WORKSPACE/dist/aur/.SRCINFO" .
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo 'No AUR changes to push'
            exit 0
          fi
          git commit -m "Update to v${{ inputs.version }}"
          git push origin master
