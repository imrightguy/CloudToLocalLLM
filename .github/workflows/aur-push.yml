name: AUR Push

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '10.1.200'
  repository_dispatch:
    types: [aur-push]

jobs:
  aur-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aur-package
        uses: actions/checkout@v4
        with:
          repository: CloudToLocalLLM-online/CloudToLocalLLM
          path: aur-package
          sparse-checkout: |
            aur-package
          sparse-checkout-cone-mode: false

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/id_ed
          echo "${{ secrets.AUR_SSH_PUB }}" > ~/.ssh/id_ed.pub
          echo "${{ secrets.AUR_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed
          chmod 644 ~/.ssh/id_ed.pub
          chmod 644 ~/.ssh/known_hosts
          
      - name: Configure git
        run: |
          git config --global user.email "christopher.maltais@gmail.com"
          git config --global user.name "Christopher Maltais"

      - name: Push to AUR
        run: |
          cd aur-package
          git remote add aur git@aur.archlinux.org:cloudtolocalllm.git || true
          git push aur master
