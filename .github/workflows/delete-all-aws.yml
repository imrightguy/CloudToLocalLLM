name: "🗑️ Delete All AWS Resources"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DELETE-ALL-AWS" to confirm'
        required: true
        type: string
      dry_run:
        description: 'Dry run (show what would be deleted)'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: cloudtolocalllm-eks

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      confirmed: ${{ steps.check.outputs.confirmed }}
    steps:
      - name: Validate confirmation
        id: check
        run: |
          if [ "${{ inputs.confirm }}" = "DELETE-ALL-AWS" ]; then
            echo "confirmed=true" >> $GITHUB_OUTPUT
            echo "✅ Confirmation received"
          else
            echo "confirmed=false" >> $GITHUB_OUTPUT
            echo "❌ Invalid confirmation. You must type 'DELETE-ALL-AWS' exactly."
            exit 1
          fi

  delete-eks-workloads:
    needs: validate
    if: needs.validate.outputs.confirmed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }} || {
            echo "⚠️ Could not connect to EKS cluster - it may already be deleted"
            exit 0
          }

      - name: Delete all workloads in cloudtolocalllm namespace
        if: inputs.dry_run == false
        run: |
          echo "🗑️ Deleting all resources in cloudtolocalllm namespace..."
          kubectl delete namespace cloudtolocalllm --ignore-not-found --timeout=120s || true
          echo "✅ Namespace deletion initiated"

      - name: Dry run - show workloads
        if: inputs.dry_run == true
        run: |
          echo "📋 DRY RUN - Would delete these resources:"
          echo ""
          echo "=== Namespaces ==="
          kubectl get namespaces
          echo ""
          echo "=== Deployments in cloudtolocalllm ==="
          kubectl get deployments -n cloudtolocalllm 2>/dev/null || echo "None"
          echo ""
          echo "=== Services in cloudtolocalllm ==="
          kubectl get services -n cloudtolocalllm 2>/dev/null || echo "None"
          echo ""
          echo "=== Pods in cloudtolocalllm ==="
          kubectl get pods -n cloudtolocalllm 2>/dev/null || echo "None"

  delete-eks-cluster:
    needs: [validate, delete-eks-workloads]
    if: needs.validate.outputs.confirmed == 'true' && inputs.dry_run == false
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete EKS Node Group
        run: |
          echo "🗑️ Deleting EKS node groups..."
          NODE_GROUPS=$(aws eks list-nodegroups --cluster-name ${{ env.EKS_CLUSTER }} --query 'nodegroups[*]' --output text 2>/dev/null || echo "")
          
          if [ -n "$NODE_GROUPS" ]; then
            for ng in $NODE_GROUPS; do
              echo "Deleting node group: $ng"
              aws eks delete-nodegroup --cluster-name ${{ env.EKS_CLUSTER }} --nodegroup-name $ng || true
            done
            
            echo "⏳ Waiting for node groups to be deleted (this may take 5-10 minutes)..."
            for ng in $NODE_GROUPS; do
              aws eks wait nodegroup-deleted --cluster-name ${{ env.EKS_CLUSTER }} --nodegroup-name $ng 2>/dev/null || true
            done
          else
            echo "No node groups found"
          fi
          echo "✅ Node groups deleted"

      - name: Delete EKS Cluster
        run: |
          echo "🗑️ Deleting EKS cluster: ${{ env.EKS_CLUSTER }}..."
          aws eks delete-cluster --name ${{ env.EKS_CLUSTER }} 2>/dev/null || {
            echo "⚠️ Cluster may already be deleted or deletion failed"
            exit 0
          }
          
          echo "⏳ Waiting for cluster to be deleted (this may take 5-10 minutes)..."
          aws eks wait cluster-deleted --name ${{ env.EKS_CLUSTER }} 2>/dev/null || true
          echo "✅ EKS cluster deleted"

  delete-vpc-resources:
    needs: [validate, delete-eks-cluster]
    if: needs.validate.outputs.confirmed == 'true' && inputs.dry_run == false
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete VPC and related resources
        run: |
          VPC_ID="vpc-03628f637e676764b"
          
          echo "🗑️ Cleaning up VPC resources for: $VPC_ID"
          
          # Delete NAT Gateways
          echo "Deleting NAT Gateways..."
          NAT_GWS=$(aws ec2 describe-nat-gateways --filter "Name=vpc-id,Values=$VPC_ID" --query 'NatGateways[*].NatGatewayId' --output text 2>/dev/null || echo "")
          for nat in $NAT_GWS; do
            aws ec2 delete-nat-gateway --nat-gateway-id $nat 2>/dev/null || true
          done
          
          # Wait for NAT Gateways to delete
          sleep 30
          
          # Delete Internet Gateway
          echo "Deleting Internet Gateways..."
          IGW=$(aws ec2 describe-internet-gateways --filters "Name=attachment.vpc-id,Values=$VPC_ID" --query 'InternetGateways[*].InternetGatewayId' --output text 2>/dev/null || echo "")
          for igw in $IGW; do
            aws ec2 detach-internet-gateway --internet-gateway-id $igw --vpc-id $VPC_ID 2>/dev/null || true
            aws ec2 delete-internet-gateway --internet-gateway-id $igw 2>/dev/null || true
          done
          
          # Delete Subnets
          echo "Deleting Subnets..."
          SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC_ID" --query 'Subnets[*].SubnetId' --output text 2>/dev/null || echo "")
          for subnet in $SUBNETS; do
            aws ec2 delete-subnet --subnet-id $subnet 2>/dev/null || true
          done
          
          # Delete Route Tables (except main)
          echo "Deleting Route Tables..."
          RTS=$(aws ec2 describe-route-tables --filters "Name=vpc-id,Values=$VPC_ID" --query 'RouteTables[?Associations[0].Main!=`true`].RouteTableId' --output text 2>/dev/null || echo "")
          for rt in $RTS; do
            # Disassociate first
            ASSOCS=$(aws ec2 describe-route-tables --route-table-ids $rt --query 'RouteTables[0].Associations[*].RouteTableAssociationId' --output text 2>/dev/null || echo "")
            for assoc in $ASSOCS; do
              aws ec2 disassociate-route-table --association-id $assoc 2>/dev/null || true
            done
            aws ec2 delete-route-table --route-table-id $rt 2>/dev/null || true
          done
          
          # Delete Security Groups (except default)
          echo "Deleting Security Groups..."
          SGS=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC_ID" --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text 2>/dev/null || echo "")
          for sg in $SGS; do
            aws ec2 delete-security-group --group-id $sg 2>/dev/null || true
          done
          
          # Release Elastic IPs associated with this VPC
          echo "Releasing Elastic IPs..."
          EIPS=$(aws ec2 describe-addresses --query 'Addresses[?Domain==`vpc`].AllocationId' --output text 2>/dev/null || echo "")
          for eip in $EIPS; do
            aws ec2 release-address --allocation-id $eip 2>/dev/null || true
          done
          
          # Delete VPC
          echo "Deleting VPC..."
          aws ec2 delete-vpc --vpc-id $VPC_ID 2>/dev/null || {
            echo "⚠️ Could not delete VPC - there may be remaining dependencies"
          }
          
          echo "✅ VPC cleanup completed"

  delete-iam-roles:
    needs: [validate, delete-vpc-resources]
    if: needs.validate.outputs.confirmed == 'true' && inputs.dry_run == false
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete IAM Roles
        run: |
          echo "🗑️ Deleting IAM roles..."
          
          # EKS Cluster Role
          CLUSTER_ROLE="cloudtolocalllm-eks-cluster-role"
          echo "Deleting role: $CLUSTER_ROLE"
          
          # Detach policies first
          POLICIES=$(aws iam list-attached-role-policies --role-name $CLUSTER_ROLE --query 'AttachedPolicies[*].PolicyArn' --output text 2>/dev/null || echo "")
          for policy in $POLICIES; do
            aws iam detach-role-policy --role-name $CLUSTER_ROLE --policy-arn $policy 2>/dev/null || true
          done
          aws iam delete-role --role-name $CLUSTER_ROLE 2>/dev/null || true
          
          # EKS Node Role
          NODE_ROLE="cloudtolocalllm-eks-node-role"
          echo "Deleting role: $NODE_ROLE"
          
          POLICIES=$(aws iam list-attached-role-policies --role-name $NODE_ROLE --query 'AttachedPolicies[*].PolicyArn' --output text 2>/dev/null || echo "")
          for policy in $POLICIES; do
            aws iam detach-role-policy --role-name $NODE_ROLE --policy-arn $policy 2>/dev/null || true
          done
          
          # Remove from instance profiles
          PROFILES=$(aws iam list-instance-profiles-for-role --role-name $NODE_ROLE --query 'InstanceProfiles[*].InstanceProfileName' --output text 2>/dev/null || echo "")
          for profile in $PROFILES; do
            aws iam remove-role-from-instance-profile --instance-profile-name $profile --role-name $NODE_ROLE 2>/dev/null || true
            aws iam delete-instance-profile --instance-profile-name $profile 2>/dev/null || true
          done
          
          aws iam delete-role --role-name $NODE_ROLE 2>/dev/null || true
          
          echo "✅ IAM roles deleted"

  summary:
    needs: [validate, delete-eks-workloads, delete-eks-cluster, delete-vpc-resources, delete-iam-roles]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "============================================"
          echo "🗑️ AWS CLEANUP SUMMARY"
          echo "============================================"
          echo ""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "📋 DRY RUN COMPLETED - No resources were deleted"
          else
            echo "✅ Deleted resources:"
            echo "   - EKS cluster: cloudtolocalllm-eks"
            echo "   - EKS node groups"
            echo "   - Kubernetes namespace: cloudtolocalllm"
            echo "   - VPC: vpc-03628f637e676764b"
            echo "   - Subnets, NAT Gateways, Internet Gateway"
            echo "   - Security Groups"
            echo "   - IAM Roles: cloudtolocalllm-eks-cluster-role, cloudtolocalllm-eks-node-role"
            echo ""
            echo "⚠️ You may want to manually verify in AWS Console that all resources are deleted"
            echo "⚠️ Check for any orphaned resources in: EC2, VPC, IAM, EKS"
          fi
