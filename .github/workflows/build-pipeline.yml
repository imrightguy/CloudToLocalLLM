name: "🚀 Build Pipeline"

on:
  repository_dispatch:
    types: [orchestrator-build]

env:
  KILOCODE_IMAGE: kiloai/cli:latest
  KILOCODE_MODEL: x-ai/grok-code-fast-1

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.analyze.outputs.components }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: "Analyze Changes"
        id: analyze
        env:
          KILOCODE_TOKEN: ${{ secrets.KILOCODE_TOKEN || secrets.KILOCODE_API_KEY }}
          KILOCODE_MODEL: ${{ env.KILOCODE_MODEL }}
        run: |
          # Upstream void analysis logic: targeted purging starts here.
          echo "Forensic audit of changes..."
          
          DIFF=$(git diff HEAD^ HEAD || git diff HEAD)
          if [ -z "$DIFF" ]; then
            echo "No changes detected."
            echo "components=" >> $GITHUB_OUTPUT
            exit 0
          fi

          PROMPT="Analyze the following git diff and identify which components need to be rebuilt. Respond ONLY with a JSON object like {\"components\": [\"api\", \"web\"]}. Diff: ${DIFF:0:2000}"
          
          echo "Executing native Kilocode CLI..."
          
          docker run --rm \
            -v "$(pwd):/workspace" \
            -e KILO_PROVIDER_TYPE=kilocode \
            -e KILOCODE_TOKEN \
            -e KILOCODE_MODEL \
            -e CI=true \
            ${{ env.KILOCODE_IMAGE }} \
            --auto --json "$PROMPT" > raw_response.json 2>cli_debug.log || {
              echo "CLI execution failed:"
              cat cli_debug.log
              exit 1
            }
            
          # Clean and validate JSON
          if ! jq -e . raw_response.json > /dev/null 2>&1; then
            sed -n '/{/,/}/p' raw_response.json > clean_response.json
          else
            cp raw_response.json clean_response.json
          fi

          if ! jq -e . clean_response.json > /dev/null 2>&1; then
            echo "Error: Invalid JSON response."
            cat clean_response.json
            exit 1
          fi

          COMPONENTS=$(jq -r '.components | join(",")' clean_response.json)
          echo "components=$COMPONENTS" >> $GITHUB_OUTPUT

  build_base:
    needs: detect_changes
    if: needs.detect_changes.outputs.components != ''
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building base images..."

  deploy_secrets:
    needs: detect_changes
    if: needs.detect_changes.outputs.components != ''
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying secrets..."

  build_api:
    needs: [build_base, deploy_secrets]
    if: contains(needs.detect_changes.outputs.components, 'api')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building API..."

  build_web:
    needs: [build_base, deploy_secrets]
    if: contains(needs.detect_changes.outputs.components, 'web')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building Web..."

  promote_to_gitops:
    needs: [build_api, build_web]
    if: always() && needs.detect_changes.outputs.components != ''
    runs-on: ubuntu-latest
    steps:
      - run: echo "Promoting to GitOps..."

  create_release:
    needs: promote_to_gitops
    if: needs.detect_changes.outputs.components != ''
    runs-on: ubuntu-latest
    steps:
      - run: echo "Creating release..."

  build_linux:
    needs: detect_changes
    if: contains(needs.detect_changes.outputs.components, 'linux')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building Linux app..."

  build_windows:
    needs: detect_changes
    if: contains(needs.detect_changes.outputs.components, 'windows')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building Windows app..."
