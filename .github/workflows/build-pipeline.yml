name: "🚀 Build Pipeline"

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [orchestrator-build]

env:
  KILOCODE_IMAGE: kiloai/cli:latest
  KILOCODE_MODEL: x-ai/grok-code-fast-1

jobs:
  orchestrator_entry:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.analyze.outputs.components }}
      new_version: ${{ steps.analyze.outputs.new_version }}
      bump_needed: ${{ steps.analyze.outputs.bump_needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: "Orchestrator: Forensic Analysis"
        id: analyze
        env:
          KILOCODE_TOKEN: ${{ secrets.KILOCODE_TOKEN || secrets.KILOCODE_API_KEY }}
          KILOCODE_MODEL: ${{ env.KILOCODE_MODEL }}
        run: |
          echo "Executing forensic audit of the void..."
          
          # Improved diff detection for automated version bumps
          if [ "${{ github.event_name }}" == "push" ]; then
            # Check if this is a fresh branch or the first commit
            if [ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]; then
              DIFF=$(git diff HEAD^ HEAD)
            else
              DIFF=$(git diff ${{ github.event.before }} ${{ github.event.after }})
            fi
          else
            DIFF=$(git diff HEAD^ HEAD || git diff HEAD)
          fi

          if [ -z "$DIFF" ]; then
            echo "components=api,web,linux,windows" >> $GITHUB_OUTPUT
            echo "bump_needed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          VERSION=$(jq -r '.version' assets/version.json || echo "0.0.0")
          PROMPT="Analyze changes. Identify components (api, web, linux, windows) AND decide if version bump is needed for version $VERSION. Respond ONLY with JSON like {\"components\": [\"api\"], \"version_bump_needed\": true, \"new_version\": \"1.2.3\"}. Diff: ${DIFF:0:2000}"
          
          # Native CLI execution
          docker run --rm \
            -v "$(pwd):/workspace" \
            -e KILO_PROVIDER_TYPE=kilocode \
            -e KILOCODE_TOKEN \
            -e KILOCODE_MODEL \
            -e CI=true \
            ${{ env.KILOCODE_IMAGE }} \
            --auto --json "$PROMPT" > raw_response.json
            
          # Strict JSON Sanitization & Validation
          if ! jq -e . raw_response.json > /dev/null 2>&1; then
            sed -n '/{/,/}/p' raw_response.json > clean_response.json
          else
            cp raw_response.json clean_response.json
          fi

          # Emergency fallback if logic fails
          if ! jq -e . clean_response.json > /dev/null 2>&1; then
             echo '{"components":["api","web","linux","windows"],"version_bump_needed":false}' > clean_response.json
          fi

          COMPONENTS=$(jq -r '.components | join(",")' clean_response.json)
          BUMP=$(jq -r '.version_bump_needed // "false"' clean_response.json)
          NEW_VERSION=$(jq -r '.new_version // ""' clean_response.json)
          
          echo "components=$COMPONENTS" >> $GITHUB_OUTPUT
          echo "bump_needed=$BUMP" >> $GITHUB_OUTPUT
          echo "new_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Audit: Components discovered: $COMPONENTS, Bump: $BUMP, New Version: $NEW_VERSION"

      # Version increment moved to orchestrator context to ensure execution
      - name: "Orchestrator: Commit Version Bump"
        if: steps.analyze.outputs.bump_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.analyze.outputs.new_version }}"
          echo "Executing automated version bump to $NEW_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          jq --arg v "$NEW_VERSION" '.version = $v' assets/version.json > tmp.json && mv tmp.json assets/version.json
          git add assets/version.json
          git commit -m "chore: automated version bump to $NEW_VERSION"
          git push origin main

  # Build jobs triggered by components output
  build_base:
    needs: orchestrator_entry
    if: needs.orchestrator_entry.outputs.components != ''
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building base images..."

  deploy_secrets:
    needs: orchestrator_entry
    if: needs.orchestrator_entry.outputs.components != ''
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying secrets..."

  build_api:
    needs: [build_base, deploy_secrets]
    if: contains(needs.orchestrator_entry.outputs.components, 'api')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building API..."

  build_web:
    needs: [build_base, deploy_secrets]
    if: contains(needs.orchestrator_entry.outputs.components, 'web')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building Web..."

  # Decoupled GitHub Release
  create_github_release:
    needs: [build_api, build_web]
    if: needs.orchestrator_entry.outputs.bump_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Executing decoupled release"
        run: |
          NEW_VERSION="${{ steps.analyze.outputs.new_version }}"
          echo "Creating release for $NEW_VERSION..."

  promote_to_gitops:
    needs: [build_api, build_web]
    if: always() && needs.orchestrator_entry.outputs.components != ''
    runs-on: ubuntu-latest
    steps:
      - run: echo "Promoting to GitOps..."

  build_linux:
    needs: orchestrator_entry
    if: contains(needs.orchestrator_entry.outputs.components, 'linux')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building Linux app..."

  build_windows:
    needs: orchestrator_entry
    if: contains(needs.orchestrator_entry.outputs.components, 'windows')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building Windows app..."
