name: "🚀 Build Pipeline"

on:
  repository_dispatch:
    types: [orchestrator-build]

env:
  KILOCODE_IMAGE: kiloai/cli:latest

jobs:
  validate_prerequisites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Validate Environment"
        run: |
          echo "Validating build environment..."
          # Instead of running a complex script, we just ensure the native binary is reachable in the container
          docker run --rm ${{ env.KILOCODE_IMAGE }} --version

  detect_changes:
    needs: validate_prerequisites
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.analyze.outputs.components }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: "Analyze Changes"
        id: analyze
        env:
          KILOCODE_TOKEN: ${{ secrets.KILOCODE_TOKEN || secrets.KILOCODE_API_KEY }}
        run: |
          # Use the native Kilocode CLI directly for analysis
          # This replaces the dependency on the deleted .cjs script
          
          DIFF=$(git diff HEAD^ HEAD)
          PROMPT="Analyze the following git diff and identify which components need to be rebuilt. Respond ONLY with a JSON object like {\"components\": [\"api\", \"web\"]}. Diff: ${DIFF:0:2000}"
          
          echo "Analyzing changes with Kilocode CLI..."
          docker run --rm \
            -v "$(pwd):/workspace" \
            -e KILO_PROVIDER_TYPE=kilocode \
            -e KILOCODE_TOKEN \
            ${{ env.KILOCODE_IMAGE }} \
            --auto --json "$PROMPT" > analysis.json
            
          COMPONENTS=$(jq -r '.components | join(",")' analysis.json)
          echo "Identified components: $COMPONENTS"
          echo "components=$COMPONENTS" >> $GITHUB_OUTPUT

  build_base:
    needs: detect_changes
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building base images..."

  deploy_secrets:
    needs: detect_changes
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying secrets..."

  build_api:
    needs: [build_base, deploy_secrets]
    if: contains(needs.detect_changes.outputs.components, 'api')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building API..."

  build_web:
    needs: [build_base, deploy_secrets]
    if: contains(needs.detect_changes.outputs.components, 'web')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building Web..."

  promote_to_gitops:
    needs: [build_api, build_web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "Promoting to GitOps..."

  create_release:
    needs: promote_to_gitops
    runs-on: ubuntu-latest
    steps:
      - run: echo "Creating release..."

  build_linux:
    needs: detect_changes
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building Linux app..."

  build_windows:
    needs: detect_changes
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building Windows app..."
