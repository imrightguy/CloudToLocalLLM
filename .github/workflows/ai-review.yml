name: "🔎 AI Code Review"

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_call:
    inputs:
      additional_context:
        type: "string"
        description: "Any additional context from the request"
        required: false

concurrency:
  group: "${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}"
  cancel-in-progress: true

defaults:
  run:
    shell: "bash"

env:
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: "read"
      id-token: "write"
      issues: "write"
      pull-requests: "write"
    steps:
      - name: "Mint identity token"
        id: "mint_identity_token"
        if: |-
          ${{ vars.APP_ID }}
        uses: "actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b" # ratchet:actions/create-github-app-token@v2
        with:
          app-id: "${{ vars.APP_ID }}"
          private-key: "${{ secrets.APP_PRIVATE_KEY }}"
          permission-contents: "read"
          permission-issues: "write"
          permission-pull-requests: "write"

      - name: "Checkout repository"
        uses: "actions/checkout@v4"
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: "Azure Login"
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "Log in to Azure Container Registry"
        run: az acr login --name imrightguycloudtolocalllm

      - name: "Run AI pull request review"
        id: "ai_pr_review"
        env:
          KILOCODE_TOKEN: "${{ secrets.KILOCODE_TOKEN || secrets.KILOCODE_API_KEY }}"
          KILOCODE_MODEL: "x-ai/grok-code-fast-1"
          KILOCODE_POSTHOG_API_KEY: "${{ secrets.KILOCODE_POSTHOG_API_KEY }}"
          GITHUB_TOKEN: "${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}"
          ISSUE_TITLE: "${{ github.event.pull_request.title || github.event.issue.title }}"
          ISSUE_BODY: "${{ github.event.pull_request.body || github.event.issue.body }}"
          ADDITIONAL_CONTEXT: "${{ inputs.additional_context }}"
        run: |
          cat <<EOF > kilocode.config.json
          {
            "providers": [
              {
                "id": "default",
                "provider": "kilocode",
                "kilocodeToken": "${KILOCODE_TOKEN}",
                "kilocodeModel": "${KILOCODE_MODEL}",
                "kilocodePosthogApiKey": "${KILOCODE_POSTHOG_API_KEY}"
              }
            ]
          }
          EOF

          mkdir -p .ai-agent
          cat > .ai-agent/settings.json <<EOF
          {
            "model": { "maxSessionTurns": 25 },
            "output": { "format": "json" },
            "mcpServers": {
              "github": {
                "command": "docker",
                "args": [
                  "run", "-i", "--rm",
                  "-e", "GITHUB_PERSONAL_ACCESS_TOKEN",
                  "ghcr.io/github/github-mcp-server:v0.18.0"
                ],
                "env": {
                  "GITHUB_PERSONAL_ACCESS_TOKEN": "$GITHUB_TOKEN"
                }
              }
            }
          }
          EOF
          echo "🔄 Starting AI PR review..."

          TITLE_ESCAPED=$(echo "$ISSUE_TITLE" | sed 's/\"/\\\\\"/g')
          BODY_ESCAPED=$(echo "$ISSUE_BODY" | sed 's/\"/\\\\\"/g')
          CONTEXT_ESCAPED=$(echo "$ADDITIONAL_CONTEXT" | sed 's/\"/\\\\\"/g')
          IMAGE_TAG="${{ secrets.ACR_REGISTRY }}/kilocode-cli:latest"
          if ! docker run --rm -v $(pwd):/app -w /app \
            -e KILOCODE_TOKEN \
            -e KILOCODE_MODEL \
            -e KILOCODE_POSTHOG_API_KEY \
            -e GITHUB_TOKEN \
            $IMAGE_TAG "Please review this pull request. Title: $TITLE_ESCAPED. Body: $BODY_ESCAPED. Context: $CONTEXT_ESCAPED." > raw_output.json 2> ai_error.log; then
            echo "::warning::AI Agent CLI failed, check logs for details"
            cat ai_error.log
            exit 1
          fi
          echo "✅ AI PR review completed successfully"

      - name: "KiloCode Fallback"
        if: failure()
        run: |
          echo "::warning::AI review failed, using fallback"
          echo '{"result": "Review failed, using default fallback", "suggestions": []}' > raw_output.json
