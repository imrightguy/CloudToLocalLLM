name: "🔎 AI Code Review"

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_call:
    inputs:
      additional_context:
        type: "string"
        description: "Any additional context from the request"
        required: false

concurrency:
  group: "${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}"
  cancel-in-progress: true

defaults:
  run:
    shell: "bash"

env:
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  review:
    runs-on: "blacksmith-4vcpu-ubuntu-2404"
    timeout-minutes: 7
    permissions:
      contents: "read"
      id-token: "write"
      issues: "write"
      pull-requests: "write"
    steps:
      - name: "Mint identity token"
        id: "mint_identity_token"
        if: |-
          ${{ vars.APP_ID }}
        uses: "actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b" # ratchet:actions/create-github-app-token@v2
        with:
          app-id: "${{ vars.APP_ID }}"
          private-key: "${{ secrets.APP_PRIVATE_KEY }}"
          permission-contents: "read"
          permission-issues: "write"
          permission-pull-requests: "write"

      - name: "Checkout repository"
        uses: "actions/checkout@v4"
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: "Run AI pull request review"
        id: "ai_pr_review"
        env:
          KILOCODE_TOKEN: "${{ secrets.KILOCODE_TOKEN }}"
          KILOCODE_MODEL: "${{ vars.KILOCODE_MODEL }}"
          KILOCODE_POSTHOG_API_KEY: "${{ secrets.KILOCODE_POSTHOG_API_KEY }}"
          GITHUB_TOKEN: "${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}"
          ISSUE_TITLE: "${{ github.event.pull_request.title || github.event.issue.title }}"
          ISSUE_BODY: "${{ github.event.pull_request.body || github.event.issue.body }}"
          ADDITIONAL_CONTEXT: "${{ inputs.additional_context }}"
        run: |
          # Generate Kilocode Configuration
          cat <<EOF > kilocode.config.json
          {
            "version": "1.0.0",
            "mode": "code",
            "telemetry": true,
            "provider": "default",
            "providers": [
              {
                "id": "default",
                "provider": "kilocode",
                "kilocodeToken": "$KILOCODE_TOKEN",
                "kilocodeModel": "$KILOCODE_MODEL",
                "kilocodePosthogApiKey": "$KILOCODE_POSTHOG_API_KEY"
              }
            ],
            "autoApproval": {
              "enabled": true,
              "read": {
                "enabled": true,
                "outside": false
              },
              "write": {
                "enabled": true,
                "outside": true,
                "protected": false
              },
              "browser": {
                "enabled": true
              },
              "retry": {
                "enabled": true,
                "delay": 10
              },
              "mcp": {
                "enabled": true
              },
              "mode": {
                "enabled": true
              },
              "subtasks": {
                "enabled": true
              },
              "execute": {
                "enabled": true,
                "allowed": [
                  "ls",
                  "cat",
                  "echo",
                  "pwd",
                  "mkdir",
                  "cd",
                  "kubectl",
                  "curl"
                ],
                "denied": [
                  "rm -rf",
                  "sudo rm",
                  "mkfs",
                  "dd if="
                ]
              },
              "question": {
                "enabled": false,
                "timeout": 60
              },
              "todo": {
                "enabled": true
              }
            },
            "theme": "dark",
            "customThemes": {}
          }
          EOF

          mkdir -p .ai-agent
          cat > .ai-agent/settings.json <<EOF
          {
            "model": { "maxSessionTurns": 25 },
            "output": { "format": "json" },
            "mcpServers": {
              "github": {
                "command": "docker",
                "args": [
                  "run", "-i", "--rm",
                  "-e", "GITHUB_PERSONAL_ACCESS_TOKEN",
                  "ghcr.io/github/github-mcp-server:v0.18.0"
                ],
                "env": {
                  "GITHUB_PERSONAL_ACCESS_TOKEN": "$GITHUB_TOKEN"
                }
              }
            }
          }
          EOF
          echo "🔄 Starting AI PR review..."
          
          # Ensure local kilocode CLI is usable
          if [ -f scripts/kilocode-cli.cjs ]; then
            chmod +x scripts/kilocode-cli.cjs
            sudo ln -sf "$(pwd)/scripts/kilocode-cli.cjs" /usr/local/bin/kilocode
          fi

          TITLE_ESCAPED=$(echo "$ISSUE_TITLE" | sed 's/\"/\\\\\"/g')
          BODY_ESCAPED=$(echo "$ISSUE_BODY" | sed 's/\"/\\\\\"/g')
          CONTEXT_ESCAPED=$(echo "$ADDITIONAL_CONTEXT" | sed 's/\"/\\\\\"/g')
          if ! kilocode "Please review this pull request. Title: $TITLE_ESCAPED. Body: $BODY_ESCAPED. Context: $CONTEXT_ESCAPED." > raw_output.json 2> ai_error.log; then
            echo "::error::AI Agent CLI failed"
            echo "📝 Error details:"
            cat ai_error.log
            echo "::group::Debug Information"
            echo "Environment:"
            env | sort
            echo "::endgroup::"
            exit 1
          fi
          echo "✅ AI PR review completed successfully"
