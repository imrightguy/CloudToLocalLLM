name: "🔎 AI Code Review"

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_dispatch:
  workflow_call:
    inputs:
      additional_context:
        type: "string"
        description: "Any additional context from the request"
        required: false

concurrency:
  group: "${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}"
  cancel-in-progress: true

defaults:
  run:
    shell: "bash"

env:
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  # Official Kilocode CLI Docker image
  KILOCODE_IMAGE: kiloai/cli:latest

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: "read"
      id-token: "write"
      issues: "write"
      pull-requests: "write"
    steps:
      - name: "Mint identity token"
        id: "mint_identity_token"
        if: |-
          ${{ vars.APP_ID }}
        uses: "actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b" # ratchet:actions/create-github-app-token@v2
        with:
          app-id: "${{ vars.APP_ID }}"
          private-key: "${{ secrets.APP_PRIVATE_KEY }}"
          permission-contents: "read"
          permission-issues: "write"
          permission-pull-requests: "write"

      - name: "Checkout repository"
        uses: "actions/checkout@v4"
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: "Pull Official Kilocode CLI Image"
        run: |
          echo "Pulling official Kilocode CLI image from Docker Hub..."
          docker pull ${{ env.KILOCODE_IMAGE }}
          echo "✅ Successfully pulled ${{ env.KILOCODE_IMAGE }}"

      - name: "Run AI pull request review"
        id: "ai_pr_review"
        env:
          KILOCODE_TOKEN: "${{ secrets.KILOCODE_TOKEN || secrets.KILOCODE_API_KEY }}"
          KILOCODE_MODEL: "x-ai/grok-code-fast-1"
          GITHUB_TOKEN: "${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}"
          ISSUE_TITLE: "${{ github.event.pull_request.title || github.event.issue.title }}"
          ISSUE_BODY: "${{ github.event.pull_request.body || github.event.issue.body }}"
          ADDITIONAL_CONTEXT: "${{ inputs.additional_context }}"
        run: |
          mkdir -p .ai-agent
          cat > .ai-agent/settings.json <<EOF
          {
            "model": { "maxSessionTurns": 25 },
            "output": { "format": "json" },
            "mcpServers": {
              "github": {
                "command": "docker",
                "args": [
                  "run", "-i", "--rm",
                  "-e", "GITHUB_PERSONAL_ACCESS_TOKEN",
                  "ghcr.io/github/github-mcp-server:v0.18.0"
                ],
                "env": {
                  "GITHUB_PERSONAL_ACCESS_TOKEN": "$GITHUB_TOKEN"
                }
              }
            }
          }
          EOF
          echo "🔄 Starting AI PR review..."

          TITLE_ESCAPED=$(echo "$ISSUE_TITLE" | sed 's/\"/\\\\\"/g')
          BODY_ESCAPED=$(echo "$ISSUE_BODY" | sed 's/\"/\\\\\"/g')
          CONTEXT_ESCAPED=$(echo "$ADDITIONAL_CONTEXT" | sed 's/\"/\\\\\"/g')
          
          PROMPT="Please review this pull request. Title: $TITLE_ESCAPED. Body: $BODY_ESCAPED. Context: $CONTEXT_ESCAPED."
          
          # Implementation of robust error handling with retries and timeout
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES..."
            # Use echo pipe to avoid TUI/interactive issues and suppress TUI with CI env vars
            if echo "$PROMPT" | timeout 300 docker run --rm -i \
              -v "$(pwd):/workspace" \
              -e CI=true \
              -e TERM=dumb \
              -e KILO_PROVIDER_TYPE=kilocode \
              -e KILOCODE_TOKEN \
              -e KILOCODE_MODEL \
              -e KILO_TELEMETRY=false \
              -e KILO_AUTO_APPROVAL_ENABLED=true \
              -e GITHUB_TOKEN \
              ${{ env.KILOCODE_IMAGE }} \
              kilocode --auto > raw_output.json 2> ai_error.log; then
              SUCCESS=true
              break
            else
              echo "::warning::Attempt $((RETRY_COUNT + 1)) failed. CLI Exit Code: $?"
              cat ai_error.log
              RETRY_COUNT=$((RETRY_COUNT + 1))
              [ $RETRY_COUNT -lt $MAX_RETRIES ] && sleep 15
            fi
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "::error::AI Agent CLI failed after $MAX_RETRIES attempts"
            exit 1
          fi
          echo "✅ AI PR review completed successfully"

      - name: "KiloCode Fallback"
        if: failure()
        run: |
          echo "::warning::AI review failed, using fallback"
          echo '{"result": "Review failed, using default fallback", "suggestions": []}' > raw_output.json
