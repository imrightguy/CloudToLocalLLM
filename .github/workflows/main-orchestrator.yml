name: "🔀 Main Orchestrator"

on:
  push:
    branches: [main, release, "fix/*", "feat/*", "!dependabot/**"]
    paths-ignore:
      - "assets/version.json"
      - "pubspec.yaml"
      - "package.json"
  pull_request:
    branches: [main, release]
    types: [opened, reopened, synchronize]
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

defaults:
  run:
    shell: bash

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.actor != 'github-actions[bot]' && 
      github.actor != 'dependabot[bot]' && 
      !startsWith(github.event.head_commit.message, 'chore: bump version') && 
      !startsWith(github.event.head_commit.message, 'chore(deploy): promote') && 
      !startsWith(github.event.head_commit.message, 'chore(deps') && 
      !startsWith(github.event.head_commit.message, 'build(deps')
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    outputs:
      command: ${{ steps.extract_command.outputs.command }}
      additional_context: ${{ steps.extract_command.outputs.additional_context }}
    steps:
      - uses: actions/checkout@v4 # Ensure repo context is available for gh/git

      - name: Extract command
        id: extract_command
        uses: actions/github-script@v7
        env:
          EVENT_TYPE: "${{ github.event_name }}.${{ github.event.action }}"
          COMMENT_BODY: "${{ github.event.comment.body }}"
          REVIEW_BODY: "${{ github.event.review.body }}"
          ISSUE_BODY: "${{ github.event.issue.body }}"
        with:
          script: |
            const eventType = process.env.EVENT_TYPE;
            const commentBody = process.env.COMMENT_BODY;
            const reviewBody = process.env.REVIEW_BODY;
            const issueBody = process.env.ISSUE_BODY;
            const request = (commentBody || reviewBody || issueBody || '').trim();
            const eventName = context.eventName;

            if (eventName === 'push') {
              core.setOutput('command', 'orchestrate');
            } else if (eventType === 'pull_request.opened') {
              core.setOutput('command', 'review');
            } else if (['issues.opened', 'issues.reopened'].includes(eventType)) {
              core.setOutput('command', 'triage');
            } else if (request.startsWith("@ai-agent /review")) {
              core.setOutput('command', 'review');
              core.setOutput('additional_context', request.replace(/^@ai-agent \/review/, '').trim());
            } else if (request.startsWith("@ai-agent /triage")) {
              core.setOutput('command', 'triage');
            } else if (request.startsWith("@ai-agent /deploy")) {
              core.setOutput('command', 'orchestrate');
              core.setOutput('additional_context', request.replace(/^@ai-agent \/deploy/, '').trim());
            } else if (request.startsWith("@ai-agent")) {
              core.setOutput('command', 'invoke');
              core.setOutput('additional_context', request.replace(/^@ai-agent/, '').trim());
            } else {
              core.setOutput('command', 'fallthrough');
            }

      - name: Kill Previous Orchestrator Builds
        if: steps.extract_command.outputs.command == 'orchestrate'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for active Build Pipeline runs on ${{ github.ref }}..."
          BRANCH=$(echo "${{ github.ref }}" | sed -e 's|^refs/heads/||' -e 's|^refs/pull/||')
          
          # List and cancel in-progress runs of the Build Pipeline
          RUNS=$(gh run list --workflow "🚀 Build Pipeline" --branch "$BRANCH" --status in_progress --json databaseId --jq '.[].databaseId')
          
          for RUN_ID in $RUNS; do
            echo "Cancelling previous Build Pipeline run: $RUN_ID"
            gh run cancel "$RUN_ID" || echo "Failed to cancel run $RUN_ID"
          done

  orchestrate:
    needs: dispatch
    if: ${{ needs.dispatch.outputs.command == 'orchestrate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 50
          fetch-tags: true

      - name: "Log in to Azure Container Registry"
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: "Cache Kilocode Config"
        uses: actions/cache@v4
        with:
          path: ~/.kilocode
          key: ${{ runner.os }}-kilocode-${{ hashFiles('scripts/kilocode-cli.cjs') }}
          restore-keys: |
            ${{ runner.os }}-kilocode-

      - name: Orchestration Logic
        env:
          # Prefer wiring to existing secret names without renaming secrets.
          # The CLI expects KILOCODE_TOKEN, but some repos store this as KILOCODE_API_KEY.
          KILOCODE_TOKEN: ${{ secrets.KILOCODE_TOKEN || secrets.KILOCODE_API_KEY }}
          KILOCODE_MODEL: x-ai/grok-code-fast-1
          KILOCODE_POSTHOG_API_KEY: ${{ secrets.KILOCODE_POSTHOG_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Safe CI validation: confirm token is present and can reach the API without printing secrets.
          if [ -z "$KILOCODE_TOKEN" ]; then
            echo "::error::Missing Kilocode token. Expected secrets.KILOCODE_TOKEN or secrets.KILOCODE_API_KEY."
            exit 1
          fi
          API_HOST="${KILOCODE_API_HOST:-api.kilocode.ai}"
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${KILOCODE_TOKEN}" "https://${API_HOST}/v1/models" || true)
          if [ -z "$HTTP_CODE" ] || [ "$HTTP_CODE" = "000" ]; then
            echo "::warning::Kilocode API connectivity check failed (no HTTP response)"
          else
            echo "Kilocode API connectivity check: HTTP ${HTTP_CODE}"
          fi

          # Create runner configuration replicating local Kilocode CLI config
          mkdir -p ~/.kilocode
          cat <<EOF > ~/.kilocode/config.json
          {
            "providers": [
              {
                "id": "default",
                "provider": "kilocode",
                "kilocodeToken": "${KILOCODE_TOKEN}",
                "kilocodeModel": "${KILOCODE_MODEL}",
                "kilocodePosthogApiKey": "${KILOCODE_POSTHOG_API_KEY}"
              }
            ]
          }
          EOF


          VERSION=$(cat assets/version.json | jq -r '.version' || echo "7.0.0")
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          BUMP_NEEDED="false"
          NEW_VERSION="$VERSION"

          echo "Running Kilocode analysis (Grok)..."
          # Health check for Kilocode API
          echo "Performing Kilocode API health check..."
          if ! timeout 30 node scripts/kilocode-cli.cjs "Health check: Respond with OK" > /dev/null 2>&1; then
            echo "::warning::Kilocode API health check failed, but proceeding with analysis"
          else
            echo "✅ Kilocode API health check passed"
          fi

          echo "Attempting Kilocode analysis..."
          if timeout 120 node scripts/kilocode-cli.cjs "Analyze the latest changes and decide if a release is needed. Version=$VERSION. Commit message: $COMMIT_MSG. Respond ONLY with a JSON object like {\"version_bump_needed\": boolean, \"new_version\": \"string\"}." > raw_output.json 2>ai_error.log; then
            echo "✅ Kilocode analysis completed successfully"
          else
            echo "::warning::Kilocode API analysis failed, using fallback"
            # Fallback: assume no bump needed if analysis fails critically
            echo '{"version_bump_needed": false, "new_version": "'$VERSION'"}' > raw_output.json
          fi

          CLEAN_RESPONSE=$(cat raw_output.json)
          echo "Cleaned response: $CLEAN_RESPONSE"

          BUMP_NEEDED=$(echo "$CLEAN_RESPONSE" | jq -r '.version_bump_needed' | xargs)
          NEW_VERSION=$(echo "$CLEAN_RESPONSE" | jq -r '.new_version' | xargs)

          if [ "$BUMP_NEEDED" == "null" ] || [ "$NEW_VERSION" == "null" ]; then
              echo "❌ ERROR: Kilocode returned null values or invalid JSON. Strict orchestration failed."
              exit 1
          fi

          if [ "$BUMP_NEEDED" == "true" ]; then
            echo "Bumping version to $NEW_VERSION"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            tmp=$(mktemp)
            jq --arg v "$NEW_VERSION" '.version = $v' assets/version.json > "$tmp" && mv "$tmp" assets/version.json
            
            if [ -f scripts/update-all-versions.sh ]; then
                chmod +x scripts/update-all-versions.sh
                ./scripts/update-all-versions.sh "$NEW_VERSION" "${{ github.sha }}"
            fi
            
            git add -A
            git commit -m "chore: bump version to $NEW_VERSION"
            
            MAX_RETRIES=5
            COUNT=0
            while [ $COUNT -lt $MAX_RETRIES ]; do
              if git push origin main; then
                break
              fi
              COUNT=$((COUNT + 1))
              echo "Push failed, retrying ($COUNT/$MAX_RETRIES)..."
              git pull --rebase origin main
              sleep 5
            done
            if [ $COUNT -eq $MAX_RETRIES ]; then
              echo "❌ ERROR: Failed to push version bump after $MAX_RETRIES attempts."
              exit 1
            fi

            echo "Triggering build for bumped version on main..."
            jq -n \
              --arg event "orchestrator-build" \
              --arg ref "refs/heads/main" \
              '{event_type: $event, client_payload: {ref: $ref}}' > payload.json
              
            gh api repos/${{ github.repository }}/dispatches --input payload.json
          else
            echo "Triggering build for current ref..."
            jq -n \
              --arg event "orchestrator-build" \
              --arg ref "${{ github.ref }}" \
              '{event_type: $event, client_payload: {ref: $ref}}' > payload.json
              
            gh api repos/${{ github.repository }}/dispatches --input payload.json
          fi
