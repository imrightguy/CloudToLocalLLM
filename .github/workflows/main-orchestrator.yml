name: "🔀 Main Orchestrator"

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/version.json"
      - "pubspec.yaml"
      - "package.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  # Official Kilocode CLI Docker image
  KILOCODE_IMAGE: kilocode/cli:latest

defaults:
  run:
    shell: bash

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.actor != 'github-actions[bot]' && 
      github.actor != 'dependabot[bot]' && 
      !startsWith(github.event.head_commit.message, 'chore: bump version') && 
      !startsWith(github.event.head_commit.message, 'chore(deploy): promote') && 
      !startsWith(github.event.head_commit.message, 'chore(deps') && 
      !startsWith(github.event.head_commit.message, 'build(deps')
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    outputs:
      command: ${{ steps.extract_command.outputs.command }}
      additional_context: ${{ steps.extract_command.outputs.additional_context }}
    steps:
      - uses: actions/checkout@v4 # Ensure repo context is available for gh/git

      - name: Extract command
        id: extract_command
        uses: actions/github-script@v7
        env:
          EVENT_TYPE: "${{ github.event_name }}.${{ github.event.action }}"
          COMMENT_BODY: "${{ github.event.comment.body }}"
          REVIEW_BODY: "${{ github.event.review.body }}"
          ISSUE_BODY: "${{ github.event.issue.body }}"
        with:
          script: |
            const eventType = process.env.EVENT_TYPE;
            const commentBody = process.env.COMMENT_BODY;
            const reviewBody = process.env.REVIEW_BODY;
            const issueBody = process.env.ISSUE_BODY;
            const request = (commentBody || reviewBody || issueBody || '').trim();
            const eventName = context.eventName;

            if (eventName === 'push') {
              core.setOutput('command', 'orchestrate');
            } else if (eventType === 'pull_request.opened') {
              core.setOutput('command', 'review');
            } else if (['issues.opened', 'issues.reopened'].includes(eventType)) {
              core.setOutput('command', 'triage');
            } else if (request.startsWith("@ai-agent /review")) {
              core.setOutput('command', 'review');
              core.setOutput('additional_context', request.replace(/^@ai-agent \/review/, '').trim());
            } else if (request.startsWith("@ai-agent /triage")) {
              core.setOutput('command', 'triage');
            } else if (request.startsWith("@ai-agent /deploy")) {
              core.setOutput('command', 'orchestrate');
              core.setOutput('additional_context', request.replace(/^@ai-agent \/deploy/, '').trim());
            } else if (request.startsWith("@ai-agent")) {
              core.setOutput('command', 'invoke');
              core.setOutput('additional_context', request.replace(/^@ai-agent/, '').trim());
            } else {
              core.setOutput('command', 'fallthrough');
            }

      - name: Kill Previous Orchestrator Builds
        if: steps.extract_command.outputs.command == 'orchestrate'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for active Build Pipeline runs on ${{ github.ref }}..."
          BRANCH=$(echo "${{ github.ref }}" | sed -e 's|^refs/heads/||' -e 's|^refs/pull/||')
          
          # List and cancel in-progress runs of the Build Pipeline
          RUNS=$(gh run list --workflow "🚀 Build Pipeline" --branch "$BRANCH" --status in_progress --json databaseId --jq '.[].databaseId')
          
          for RUN_ID in $RUNS; do
            echo "Cancelling previous Build Pipeline run: $RUN_ID"
            gh run cancel "$RUN_ID" || echo "Failed to cancel run $RUN_ID"
          done

  orchestrate:
    needs: dispatch
    if: ${{ needs.dispatch.outputs.command == 'orchestrate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 50
          fetch-tags: true

      - name: "Validate Secrets"
        run: |
          echo "Checking for required secrets..."
          if [ -z "${{ secrets.KILOCODE_TOKEN || secrets.KILOCODE_API_KEY }}" ]; then
            echo "::error::Missing KILOCODE_TOKEN or KILOCODE_API_KEY secret"
            exit 1
          fi
          echo "✅ Required secrets are present"

      - name: "Authenticate with Docker Hub"
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ] && [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          else
            echo "::info::Docker Hub credentials not found, skipping authentication"
          fi

      - name: "Pull Official Kilocode CLI Image"
        run: |
          echo "Pulling official Kilocode CLI image from Docker Hub..."
          docker pull ${{ env.KILOCODE_IMAGE }}
          echo "✅ Successfully pulled ${{ env.KILOCODE_IMAGE }}"

      - name: "Health Check Container"
        run: |
          echo "Verifying container execution..."
          docker run --rm --entrypoint node ${{ env.KILOCODE_IMAGE }} --version
          echo "✅ Container is functional"

      - name: Orchestration Logic
        env:
          # Prefer wiring to existing secret names without renaming secrets.
          # The CLI expects KILOCODE_TOKEN, but some repos store this as KILOCODE_API_KEY.
          KILOCODE_TOKEN: ${{ secrets.KILOCODE_TOKEN || secrets.KILOCODE_API_KEY }}
          KILOCODE_MODEL: x-ai/grok-code-fast-1
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Safe CI validation: confirm token is present
          if [ -z "$KILOCODE_TOKEN" ]; then
            echo "::error::Missing Kilocode token. Expected secrets.KILOCODE_TOKEN or secrets.KILOCODE_API_KEY."
            exit 1
          fi

          VERSION=$(cat assets/version.json | jq -r '.version' || echo "7.0.0")
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          BUMP_NEEDED="false"
          NEW_VERSION="$VERSION"

          echo "Running Kilocode analysis (Grok)..."
          
          # Implementation of robust error handling with retries and timeout
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=false
          
          # Prepare the prompt
          PROMPT="Analyze the latest changes and decide if a release is needed. Version=$VERSION. Commit message: $COMMIT_MSG. IMPORTANT: Perform STATIC ANALYSIS ONLY. DO NOT try to run the code, install dependencies, or execute build commands. Respond ONLY with a JSON object like {\"version_bump_needed\": boolean, \"new_version\": \"string\"}."
          
          # Configure Kilocode settings for JSON output
          mkdir -p .ai-agent
          cat > .ai-agent/settings.json <<EOF
          {
            "output": { "format": "json" }
          }
          EOF

          echo "Running Kilocode analysis (Grok)..."
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES..."
            
            # Health check for Kilocode API
            echo "Performing Kilocode API health check..."
            # Health check for Kilocode API
            echo "Performing Kilocode API health check..."
            # Use arguments instead of pipe and remove explicit 'kilocode' command (assuming ENTRYPOINT)
            set +e # Disable exit on error for the check
            timeout 300 docker run --rm \
              -v "$(pwd):/workspace" \
              -e CI=true \
              -e TERM=dumb \
              -e KILO_PROVIDER_TYPE=kilocode \
              -e KILOCODE_TOKEN \
              -e KILOCODE_MODEL \
              -e KILO_TELEMETRY=false \
              -e KILO_AUTO_APPROVAL_ENABLED=true \
              ${{ env.KILOCODE_IMAGE }} \
              --auto "Health check: Respond with OK" > /dev/null 2>&1
            EXIT_CODE=$?
            set -e # Re-enable exit on error
            
            if [ $EXIT_CODE -ne 0 ]; then
              echo "::warning::Kilocode API health check failed on attempt $((RETRY_COUNT + 1)). Exit Code: $EXIT_CODE"
            else
              echo "✅ Kilocode API health check passed"
              
              echo "Attempting Kilocode analysis..."
              if timeout 300 docker run --rm \
                -v "$(pwd):/workspace" \
                -e CI=true \
                -e TERM=dumb \
                -e KILO_PROVIDER_TYPE=kilocode \
                -e KILOCODE_TOKEN \
                -e KILOCODE_MODEL \
                -e KILO_TELEMETRY=false \
                -e KILO_AUTO_APPROVAL_ENABLED=true \
                ${{ env.KILOCODE_IMAGE }} \
                --auto "$PROMPT" > raw_output.json 2>ai_error.log; then
                SUCCESS=true
                break
              fi
            fi
            
            echo "::warning::Attempt $((RETRY_COUNT + 1)) failed. CLI Exit Code: $?"
            cat ai_error.log 2>/dev/null || true
            RETRY_COUNT=$((RETRY_COUNT + 1))
            [ $RETRY_COUNT -lt $MAX_RETRIES ] && sleep 15
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "::error::Kilocode analysis failed after $MAX_RETRIES attempts"
            exit 1
          fi

          echo "✅ Kilocode analysis completed successfully"

          # Robust JSON extraction using Python
          python3 -c "import sys, textwrap; print(textwrap.dedent(sys.stdin.read()))" > extract_json.py <<'EOF'
          import sys, json, re

          def strip_ansi(text):
              ansi_escape = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
              return ansi_escape.sub('', text)

          try:
              with open('raw_output.json', 'r') as f:
                  content = f.read()
              
              content = strip_ansi(content)
              
              # Try to find the last valid JSON object in the output
              # Generic match for { ... } including nested braces (recursive logic not needed for simple response)
              # But to be safe, we iterate over all { ... } candidates that look like JSON
              
              # Strategy: Find all substrings starting with { and ending with }
              # This is O(N^2) but fine for log files.
              # We search from the end to find the last valid JSON.
              
              candidates = []
              for match in re.finditer(r'\{', content):
                  start = match.start()
                  # Try to parse from this start to every subsequent closing brace
                  # Optimization: Just take chunks that look like complete JSON
                  # Simple approach: Regex for balanced braces is hard.
                  # Let's rely on the assumption that the response is at the end.
                  pass

              # Regex for non-nested JSON
              simple_matches = list(re.finditer(r'\{[^{}]*\}', content))
              
              # Regex for potentially nested (one level) or just loose matching
              # We use a greedy match for the whole block if simple fails
              complex_matches = list(re.finditer(r'\{.*\}', content, re.DOTALL))
              
              all_matches = simple_matches + complex_matches
              
              for match in reversed(all_matches):
                  candidate = match.group(0)
                  try:
                      json_obj = json.loads(candidate)
                      if 'version_bump_needed' in json_obj:
                          print(json.dumps(json_obj))
                          sys.exit(0)
                  except:
                      continue
              
              # Fallback: Try to clean the " > " prefix if it exists inside the match?
              # Actually, strip_ansi should have handled codes.
              # If " > " is text, it breaks JSON.
              # content = content.replace(" > {", "{") ?
              
              print('Error: No valid JSON found', file=sys.stderr)
              print("DEBUG: Content after ANSI strip:", file=sys.stderr)
              print(content, file=sys.stderr)
              sys.exit(1)
          except Exception as e:
              print(f"Error reading file: {e}", file=sys.stderr)
              sys.exit(1)
          EOF
          python3 extract_json.py > clean_output.json

          if [ -s clean_output.json ]; then
            CLEAN_RESPONSE=$(cat clean_output.json)
          else
            echo "::warning::Failed to extract JSON from output. Using raw output for debugging."
            CLEAN_RESPONSE=$(cat raw_output.json)
          fi
          
          echo "Cleaned response: $CLEAN_RESPONSE"

          BUMP_NEEDED=$(echo "$CLEAN_RESPONSE" | jq -r '.version_bump_needed' | xargs)
          NEW_VERSION=$(echo "$CLEAN_RESPONSE" | jq -r '.new_version' | xargs)

          if [ "$BUMP_NEEDED" == "null" ] || [ "$NEW_VERSION" == "null" ]; then
              echo "❌ ERROR: Kilocode returned null values or invalid JSON. Strict orchestration failed."
              exit 1
          fi

          if [ "$BUMP_NEEDED" == "true" ]; then
            echo "Bumping version to $NEW_VERSION"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            tmp=$(mktemp)
            jq --arg v "$NEW_VERSION" '.version = $v' assets/version.json > "$tmp" && mv "$tmp" assets/version.json
            
            if [ -f scripts/update-all-versions.sh ]; then
                chmod +x scripts/update-all-versions.sh
                ./scripts/update-all-versions.sh "$NEW_VERSION" "${{ github.sha }}"
            fi
            
            git add -A
            git commit -m "chore: bump version to $NEW_VERSION"
            
            MAX_RETRIES=5
            COUNT=0
            while [ $COUNT -lt $MAX_RETRIES ]; do
              if git push origin main; then
                break
              fi
              COUNT=$((COUNT + 1))
              echo "Push failed, retrying ($COUNT/$MAX_RETRIES)..."
              git pull --rebase origin main
              sleep 5
            done
            if [ $COUNT -eq $MAX_RETRIES ]; then
              echo "❌ ERROR: Failed to push version bump after $MAX_RETRIES attempts."
              exit 1
            fi

            echo "Triggering build for bumped version on main..."
            jq -n \
              --arg event "orchestrator-build" \
              --arg ref "refs/heads/main" \
              '{event_type: $event, client_payload: {ref: $ref}}' > payload.json
              
            gh api repos/${{ github.repository }}/dispatches --input payload.json
          else
            echo "Triggering build for current ref..."
            jq -n \
              --arg event "orchestrator-build" \
              --arg ref "${{ github.ref }}" \
              '{event_type: $event, client_payload: {ref: $ref}}' > payload.json
              
            gh api repos/${{ github.repository }}/dispatches --input payload.json
          fi
