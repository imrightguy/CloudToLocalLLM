version: 2

updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "flutter"

  - package-ecosystem: "npm"
    directory: "/services/api-backend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "api-backend"
    ignore:
      - dependency-name: "drizzle-kit"
        versions: [">=0.20.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
