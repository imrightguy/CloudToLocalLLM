apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemini-cli-gitops-overlord
  namespace: gemini-cli-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gemini-cli-gitops-overlord
  template:
    metadata:
      labels:
        app: gemini-cli-gitops-overlord
    spec:
      serviceAccountName: gemini-cli-controller-sa
      containers:
      - name: overlord
        image: gemini-cli/gitops-overlord:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: KILO_PROVIDER_TYPE
          value: "gemini-cli"
        - name: KILOCODE_TOKEN
          valueFrom:
            secretKeyRef:
              name: gemini-cli-secrets
              key: token
        - name: POLL_INTERVAL_MS
          value: "180000"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: state
          mountPath: /state
        - name: git-ssh-key
          mountPath: /root/.ssh
          readOnly: true
      volumes:
      - name: workspace
        emptyDir: {}
      - name: state
        persistentVolumeClaim:
          claimName: overlord-state-pvc
      - name: git-ssh-key
        secret:
          secretName: git-ssh-key
          defaultMode: 0400
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gemini-cli-controller-sa
  namespace: gemini-cli-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gemini-cli-dominion-role
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gemini-cli-controller-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gemini-cli-dominion-role
subjects:
- kind: ServiceAccount
  name: gemini-cli-controller-sa
  namespace: gemini-cli-system
