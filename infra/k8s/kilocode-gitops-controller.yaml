apiVersion: apps/v1
kind: Deployment
metadata:
  name: kilocode-gitops-overlord
  namespace: kilocode-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kilocode-gitops-overlord
  template:
    metadata:
      labels:
        app: kilocode-gitops-overlord
    spec:
      serviceAccountName: kilocode-controller-sa
      containers:
      - name: overlord
        image: kilocode/gitops-overlord:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: KILO_PROVIDER_TYPE
          value: "kilocode"
        - name: KILOCODE_TOKEN
          valueFrom:
            secretKeyRef:
              name: kilocode-secrets
              key: token
        - name: POLL_INTERVAL_MS
          value: "180000"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: state
          mountPath: /state
        - name: git-ssh-key
          mountPath: /root/.ssh
          readOnly: true
      volumes:
      - name: workspace
        emptyDir: {}
      - name: state
        persistentVolumeClaim:
          claimName: overlord-state-pvc
      - name: git-ssh-key
        secret:
          secretName: git-ssh-key
          defaultMode: 0400
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kilocode-controller-sa
  namespace: kilocode-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kilocode-dominion-role
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kilocode-controller-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kilocode-dominion-role
subjects:
- kind: ServiceAccount
  name: kilocode-controller-sa
  namespace: kilocode-system
