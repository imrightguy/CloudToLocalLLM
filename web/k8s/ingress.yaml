apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-ingress
  namespace: zoidbot
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "zoidbot-static-ip"
    networking.gke.io/managed-certificates: "zoidbot-certificate"
spec:
  rules:
  - host: zoidbot.online
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: web
            port:
              number: 80
  - host: app.zoidbot.online
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: web
            port:
              number: 80
  - host: docs.zoidbot.online
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: web
            port:
              number: 80
  - host: api.zoidbot.online
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: api-backend
            port:
              number: 8080
  - host: streaming.zoidbot.online
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: streaming-proxy
            port:
              number: 8080
