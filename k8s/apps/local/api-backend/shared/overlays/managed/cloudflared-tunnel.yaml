apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared
  namespace: zoidbot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: zoidbot
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      serviceAccountName: cloudflared
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tunnel-credentials
                  key: token
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000

            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
            items:
              - key: config.yaml
                path: config.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: zoidbot
data:
  config.yaml: |
    tunnel: 62da6c19-947b-4bf6-acad-100a73de4e0d
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      # App Subdomain - Streaming Proxy (WS)
      - hostname: app.zoidbot.online
        path: /ws
        service: http://streaming-proxy.zoidbot.svc.cluster.local:3001
      
      # App Subdomain - Streaming Proxy (API)
      - hostname: app.zoidbot.online
        path: /api/tunnel
        service: http://streaming-proxy.zoidbot.svc.cluster.local:3001
      
      # App Subdomain - API Backend Health
      - hostname: app.zoidbot.online
        path: /health
        service: http://api-backend.zoidbot.svc.cluster.local:8080

      # App Subdomain - API Backend
      - hostname: app.zoidbot.online
        path: /api
        service: http://api-backend.zoidbot.svc.cluster.local:8080

      # App Subdomain - Web Frontend (Root)
      - hostname: app.zoidbot.online
        service: http://web.zoidbot.svc.cluster.local:8080

      # API Subdomain - API Backend Health
      - hostname: api.zoidbot.online
        path: /health
        service: http://api-backend.zoidbot.svc.cluster.local:8080

      # API Subdomain - API Backend (Root)
      - hostname: api.zoidbot.online
        service: http://api-backend.zoidbot.svc.cluster.local:8080
      
      # Argo CD UI
      - hostname: argocd.zoidbot.online
        service: http://argocd-server.argocd.svc.cluster.local:80

      # Grafana UI
      - hostname: grafana.zoidbot.online
        service: http://grafana.zoidbot.svc.cluster.local:3000

      # Streaming Subdomain - Streaming Proxy
      - hostname: streaming.zoidbot.online
        service: http://streaming-proxy.zoidbot.svc.cluster.local:3001

      # Root Domain - Web Frontend
      - hostname: zoidbot.online
        service: http://web.zoidbot.svc.cluster.local:8080
      
      # Catch-all 404
      - service: http_status:404
