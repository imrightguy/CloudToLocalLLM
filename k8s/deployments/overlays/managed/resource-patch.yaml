apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-backend
  namespace: CloudToLocalLLM
spec:
  template:
    spec:
      containers:
        - name: api-backend
          resources:
            requests:
              memory: "48Mi"
              cpu: "20m"
            limits:
              memory: "192Mi"
              cpu: "150m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: CloudToLocalLLM
spec:
  template:
    spec:
      containers:
        - name: web
          resources:
            requests:
              memory: "24Mi"
              cpu: "10m"
            limits:
              memory: "96Mi"
              cpu: "120m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-proxy
  namespace: CloudToLocalLLM
spec:
  template:
    spec:
      containers:
        - name: streaming-proxy
          resources:
            requests:
              memory: "48Mi"
              cpu: "20m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: CloudToLocalLLM
spec:
  template:
    spec:
      containers:
        - name: cloudflared
          resources:
            requests:
              memory: "16Mi"
              cpu: "5m"
            limits:
              memory: "64Mi"
              cpu: "100m"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: CloudToLocalLLM
spec:
  template:
    spec:
      containers:
        - name: postgres
          resources:
            requests:
              memory: "96Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-tunnel-state
  namespace: CloudToLocalLLM
spec:
  template:
    spec:
      containers:
        - name: redis
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
