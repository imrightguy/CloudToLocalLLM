apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared-admin
  namespace: argocd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-admin
  namespace: argocd
  labels:
    app: cloudflared-admin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cloudflared-admin
  template:
    metadata:
      labels:
        app: cloudflared-admin
      annotations:
        checksum/config: "${CLOUDFLARED_ADMIN_CONFIG_SHA}"
    spec:
      serviceAccountName: cloudflared-admin
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2024.12.2
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tunnel-credentials-admin
                  key: token
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: cloudflared-admin-config
            items:
              - key: config.yaml
                path: config.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-admin-config
  namespace: argocd
data:
  config.yaml: |
    tunnel: ${CLOUDFLARED_ADMIN_TUNNEL_ID}
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: argocd-admin.cloudtolocalllm.online
        service: http://argocd-server.argocd.svc.cluster.local:80
      - service: http_status:404
