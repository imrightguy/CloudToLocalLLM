services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudtolocalllm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudtolocalllm}
      POSTGRES_USER: ${POSTGRES_USER:-cloudtolocalllm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../services/api-backend/database/schema.pg.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudtolocalllm} -d ${POSTGRES_DB:-cloudtolocalllm}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: ../..
      dockerfile: services/api-backend/Dockerfile.prod
    container_name: cloudtolocalllm-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-cloudtolocalllm}
      DB_USER: ${POSTGRES_USER:-cloudtolocalllm}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-dev-vivn1fcgzi0c2czy.us.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.cloudtolocalllm.online}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SENTRY_DSN: ${SENTRY_DSN:-}
      CLOUDTOLOCALLLM_ENABLE_LEGACY_PROXY_ROUTES: ${CLOUDTOLOCALLLM_ENABLE_LEGACY_PROXY_ROUTES:-false}
      CLOUDTOLOCALLLM_ENABLE_LEGACY_TUNNEL_ROUTES: ${CLOUDTOLOCALLLM_ENABLE_LEGACY_TUNNEL_ROUTES:-false}
      CLOUDTOLOCALLLM_ENABLE_LEGACY_OLLAMA_PROXY: ${CLOUDTOLOCALLLM_ENABLE_LEGACY_OLLAMA_PROXY:-false}
      CLOUDTOLOCALLLM_ENABLE_LEGACY_STREAMING_PROXY_ROUTES: ${CLOUDTOLOCALLLM_ENABLE_LEGACY_STREAMING_PROXY_ROUTES:-false}
      CLOUDTOLOCALLLM_ENABLE_LEGACY_DIRECT_PROXY_ROUTES: ${CLOUDTOLOCALLLM_ENABLE_LEGACY_DIRECT_PROXY_ROUTES:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - internal

  web:
    build:
      context: ../..
      dockerfile: config/docker/Dockerfile.web
    container_name: cloudtolocalllm-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - internal

  proxy:
    image: nginx:1.27-alpine
    container_name: cloudtolocalllm-proxy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${PUBLIC_HTTP_PORT:-3100}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
